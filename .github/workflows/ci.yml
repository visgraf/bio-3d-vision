name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PULL REQUESTS RUN 3.13 ONLY; MAIN RUNS BOTH. Conditional, so here is
        # why, because the next reader will ask.
        #
        # 3.13 is what every developer machine and every verification clone
        # uses. That makes 3.12 the ONLY environment in which pyproject.toml:10's
        # `requires-python = ">=3.12"` is tested at all. Dropping it entirely
        # would leave that declaration an untested claim carried forward on
        # nobody's authority -- met-001's shape exactly: an inherited criterion
        # used unexamined across TEN experiments (exp001-005, exp007-011) before
        # anyone asked what it tested, at which point the re-analysis moved
        # eleven comparisons.
        #
        # ELEVEN, AND NOT THE 45 THIS COMMENT USED TO CITE. 45 is the size of the
        # se-bar DISAGREEMENT SET, and exp012's own amendment records that the se
        # bar as specified -- |mean| > sd/sqrt(n), which is t > 1, two-sided p of
        # 0.33 at n = 24 rising to 0.39 at n = 4 -- is not a significance test at
        # any conventional level. The 45 is "where two non-tests disagree", not
        # 45 real effects. Of them, ELEVEN pass an exact two-sided sign test at
        # p < 0.05 and THIRTY-FOUR do not, and fc-007, the load-bearing one, did
        # NOT move: 6 of 8 seeds, sign-test p = 0.289. The argument never needed
        # the big number, and a CI comment is precisely where an unqualified
        # figure gets requoted later without its qualification -- which is the
        # failure met-001 is an example of.
        #
        # Keeping 3.12 on `main` means the claim is still tested before anything
        # lands, while a PR iteration pays for one interpreter instead of two.
        #
        # ONE JOB WITH A CONDITIONAL MATRIX, not two jobs with `if:`. Two jobs
        # would need the whole step list twice -- install, lint, format, types,
        # tests, and the four long comments explaining why the blender extra is
        # installed and which tests skip -- so every future edit would have to be
        # made in both copies and would eventually be made in one. The cost of
        # this form is that the expression is dense; the cost of the other is a
        # duplicate that drifts. `fromJSON` is needed because a matrix dimension
        # must be a real list, and a GitHub expression cannot produce one
        # literally.
        # Folded scalar: every continuation line sits at the SAME indent, so
        # YAML folds the newlines to spaces and Actions receives one expression.
        # Indenting them further would make YAML keep the newlines literally.
        python-version: >-
          ${{ github.event_name == 'pull_request'
          && fromJSON('["3.13"]')
          || fromJSON('["3.12", "3.13"]') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The `blender` extra is installed here on purpose. It is OPTIONAL for
          # users - the package imports and the loop runs without it, pinned by
          # tests/test_blender_load.py::test_the_package_imports_without_the_blender_extra
          # - but falsifier 1a reads a real Blender render out of
          # tests/data/bioeye-e908170, and that is the one check of the render
          # path that can run with no Blender binary present. Without the extra
          # it would skip here and the path would be unverified in CI.
          pip install -e ".[dev,blender]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      # Type checker. Blocking, not advisory: a type error is a failure.
      - name: Types
        run: mypy

      # The suite. Includes the spikes/ import ban and the no-reference-checkout
      # guard, which is why those rules can be stated as enforced rather than
      # intended. Note the reference clones are git-ignored and absent here, so
      # any code that reached into one would fail at this step.
      # falsifier 1b needs a Blender binary and there is none on the runner, so
      # its three tests skip here. That is a stated gap, not a silent one: they
      # skip with a reason naming what is unverified, and the renderer is
      # exercised by hand against a real Blender before a render lands.
      - name: Tests
        run: pytest -rs
