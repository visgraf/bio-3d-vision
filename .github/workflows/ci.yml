name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      # Type checker. Blocking, not advisory: a type error is a failure.
      - name: Types
        run: mypy

      # The suite. Includes the spikes/ import ban and the no-reference-checkout
      # guard, which is why those rules can be stated as enforced rather than
      # intended. Note the reference clones are git-ignored and absent here, so
      # any code that reached into one would fail at this step.
      - name: Tests
        run: pytest
