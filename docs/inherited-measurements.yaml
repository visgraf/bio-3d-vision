# ==============================================================================
# MEASUREMENTS — inherited priors, this project's own numbers, and gaps.
#
# Read `status` on every entry. There are now three kinds:
#
#   inherited  Measured in a predecessor repository, under conditions this one
#              has not adopted. A PRIOR, not a fact about this project. Using one
#              without re-measuring is an assumption; say so when you do.
#   measured   Produced by a run IN THIS REPOSITORY. These are facts about this
#              project, and they are the only entries that are.
#   gap        A measurement that was NOT made, and whose absence is load-bearing.
#
# The file keeps its name because most of it is still inherited and renaming it
# would break every citation.
#
# Each value below was measured in a predecessor repository, under a geometry, a
# matcher configuration, and a stimulus family that THIS repository has not
# adopted. None of it has been reproduced here. Nothing here is established.
#
# Using one of these numbers without re-measuring it is making an assumption, not
# citing a fact. That is sometimes the right thing to do — but it must be visible
# in whatever you write, and the entry id is how you make it visible.
#
# This file exists because prose cannot be contradicted and therefore cannot
# carry. A datum with provenance can be contradicted by a future measurement, so
# it can. When you re-measure one of these, do not edit its value: add the new
# measurement as its own entry and set this one's `status` to `superseded`, with
# `superseded_by`. The disagreement is the information.
#
# `status: gap` entries are measurements that were NOT made, and whose absence is
# load-bearing. They have no value. They are here so that the absence is as
# citable as a number, and so nobody rediscovers it by assuming it away.
#
# Original prose is in docs/reference/ and is NON-AUTHORITATIVE background.
# ==============================================================================

schema_version: 1

record:
  statuses:
    inherited: >-
      Measured elsewhere, under conditions this repository has not adopted. A
      prior awaiting re-test. Not established, not a baseline, not a target.
    measured: >-
      Produced by a run in this repository, with the commit that produced it.
      These are the numbers this project owns rather than inherits.
    gap: >-
      Not measured. Recorded because the absence is load-bearing.
  compiled_at: 2026-08-29
  compiled_by: read of the reference checkouts named below; no run was executed

sources:
  - key: active-stereo
    repo: github.com/visgraf/active-stereo
    sha: 3f7a263011d9c5c53a4733957ac34cd28c2e85ba
    role: >-
      Every `source:` path below resolves against this checkout. Note the
      distinction from `measured_at_sha`, which is the commit the RUN was made
      at, as recorded by the findings file itself.
  - key: bioeye
    repo: github.com/visgraf/bioeye
    sha: e90817018e629ce1cd23af0c9e8bc4a6aa15daff
    role: >-
      Contributes no measurements. Has no findings files and no tests. Its
      absence is recorded as gap-004 and gap-005.

schema:
  id: Stable. Never reused, never renumbered. Cite this.
  statement: One line. What was measured.
  value: Scalar, or a mapping when the measurement is inherently per-condition.
  units: Explicit. `fraction`, `px`, `m`, `mm`, `px^2`, `ratio`, `percent`, `GB`, `s`.
  n: What the value is aggregated over. Never omitted; `null` where the source does not say.
  stimulus_family: rds | rendered_chart | middlebury2014 | middeval3 | synthetic_pair
  matcher: block | sgbm | energy | multiscale_energy | none
  configuration: The settings that make the number reproducible.
  provenance: {cited_as, source, experiment, run_id, measured_at_sha, environment}
  provenance.environment: >-
    The interpreter and numeric-library versions the run executed under, as
    {python, numpy, scipy, matplotlib}. `null` where the source records nothing,
    which is the honest state for every `inherited` entry and, as it turns out,
    for thirteen `measured` ones.
    A FIELD RATHER THAN A COMMENT, AND ADDED LATE. It was prose in three places —
    this file's bio- block header, bio-009's `configuration`, and fv-003-1's
    `detail` in docs/state.yaml — which meant the one thing several of these
    numbers actually claim, that they do not depend on their environment, was not
    queryable. `measured_at_sha` says which code produced a number; `environment`
    says which interpreter did, and for a reproduction claim the second is the
    load-bearing half.
    BACKFILL IS NOT INFERENCE. It was applied only where a source already
    recorded the environment in prose: bio-001 through bio-009. bio-010 through
    bio-022 get `null`, because nothing in the tree records what they ran under.
    The interpreter can be guessed from build artifacts that are git-ignored and
    from the fact that the three experiments post-date bio-009, and a guess is
    exactly what this field exists to stop being written down as a fact.
  status: inherited | measured | gap
  notes: Optional. Caveats that travel with the value, from the source.

# ------------------------------------------------------------------------------
# CARRIED METHODS
#
# Added at exp012. Carried NUMBERS have had a `status` field since step 2;
# carried METHODS had none, and the two-clause bar is what that omission cost:
# it walked in from the predecessor with no marker and acquired the authority of
# a repository decision, which nothing here had ever examined.
#
# `kind` is the whole point of this section:
#   measurement — this repository measured it, and the measurement is cited.
#   choice      — this repository chose it deliberately and said why, here.
#   carried     — it walked in and has NEVER been examined here. The third
#                 category is the finding; the count is recorded as gap-011.
#
# NOTHING IN THIS SECTION IS RE-DERIVED. The audit is the deliverable. A value
# being `carried` is not an accusation that it is wrong — it is a statement that
# nobody here knows whether it is.
# ------------------------------------------------------------------------------
methods:

  - id: met-001
    what: exp001's clause 1 — the effect must exceed the seed-to-seed spread, sd(d_s)
    kind: carried
    from: >-
      The predecessor's own exp001 criterion, "a margin exceeding the seed-to-seed
      spread across 5 seeds". exp001_gaze_objective/preregistration.md:155-157 says
      so explicitly: "reused rather than invented".
    re_derived_here: >-
      NO, AND THAT IS WHAT IT COST. Used unexamined in exp001, exp002, exp003,
      exp004, exp005, exp007, exp008, exp009, exp010 and exp011 — every comparison
      this repository has ever scored. exp011 was the first iteration to notice it
      is a SAMPLE STANDARD DEVIATION and not a standard error, and exp012 is the
      first to measure what that costs: 45 of 96 nulls (46.9%) read differently
      under the other bar (bio-074).
    to_re_derive: >-
      Nothing to derive — it is a threshold, not a quantity. What it needs is a
      STATEMENT OF WHAT IT ASKS, which exp012 supplies: "does the effect exceed
      scene-to-scene variation", i.e. would this reliably help on a NEW scene. That
      is a legitimate and deliberately strict question. The defect was never the
      bar; it was that no one had said which question it answers.
    status: examined_at_exp012

  - id: met-002
    what: exp001's clause 2 — the 2% materiality floor, 0.02 x mean(reference arm)
    kind: choice
    from: >-
      Declared in exp001_gaze_objective/preregistration.md:158-160. NO SOURCE IS
      CITED, and clause 1 in the same list IS attributed to the predecessor, so the
      contrast suggests it was chosen here. Nothing derives the 2%.
    re_derived_here: >-
      NO. Reused verbatim as MATERIALITY = 0.02 or RELATIVE_FLOOR = 0.02 in all ten
      analysers. It is doing real work: exp012 measures it BINDING under the se bar
      in 138 of 353 comparisons, where the two bars therefore agree by construction
      rather than by evidence.
    to_re_derive: >-
      A statement of what difference in metres would change a decision about this
      loop, which is a judgement about the application and not a measurement. It
      cannot be derived from data at all, which is an argument for stating it as a
      judgement rather than as a number with a percent sign.
    status: never_examined

  - id: met-003
    what: exp004's band thresholds — AT <= 10 px, AWAY >= 24 px, discontinuity |dd| > 1.0 px
    kind: choice
    from: >-
      Derived in exp004_scene_model_check/preregistration.md:20-45 FROM MEASURED
      SCENE GEOMETRY: 1.0 px is the smallest disparity step that can expose a
      one-pixel strip in one eye; 10 px covers the fixture's widest disparity step
      of 8.85 px "with a margin and is rounded, not fitted"; 24 px is 2.7x that
      strip and beyond the 7x7 window's reach. exp004 also swept both and reported
      the sensitivity rather than tuning to it.
    re_derived_here: >-
      DERIVED ONCE, THEN CARRIED BY FIVE EXPERIMENTS THAT NEVER RE-CHECKED IT.
      exp005, exp007, exp008, exp010 and exp011 all use 10 / 24 / 1.0 unchanged,
      on stimuli exp004 did not measure — split_cards at four occlusion levels and
      rendered scenes. The derivation rests on the widest disparity step being
      8.85 px; whether that still holds for those stimuli was never checked.
    to_re_derive: >-
      Recompute the widest disparity step for each stimulus and repeat exp004's
      argument. Cheap — it is arithmetic on the scene model — and deliberately not
      done here.
    status: derived_once_then_carried

  - id: met-004
    what: K_LISTING_DEFAULT = 0.25, the temporal tilt of each eye's Listing plane
    kind: carried
    from: The reference; ADR-0014 introduced it and ADR-0016 corrected its rationale.
    re_derived_here: >-
      NOT RE-DERIVED, BUT EXAMINED — and this is the shape the other carried values
      lack. The value is distinguished in the docstring from the k = 1/2
      plane-of-regard optimum "one line apart in the reference", the ADR-0014 ->
      ADR-0016 correction travels WITH the parameter rather than in a document, and
      a test pins it: test_the_default_k_is_a_quarter_not_a_half. bio-046 measured
      the consequence at k = 0 against k = 1/2 in a render.
    to_re_derive: >-
      It is a modelling constant from the literature, not a measurable property of
      this rig. What can be measured is its CONSEQUENCE, and 17b did.
    status: carried_but_examined

  - id: met-005
    what: the ported front end's LR-consistency tolerance, tol = 1.5 px
    kind: carried
    from: visgraf/bioeye@e908170:active_stereo_demo.py:112-174, ported "numerically unchanged".
    re_derived_here: >-
      NO. It has no comment, no citation at the parameter, and no test that would
      fail if it changed. Every valid mask in every experiment depends on it.
    to_re_derive: >-
      Sweep it and report the valid fraction and error against it, as exp004 did
      for its band thresholds. Nothing here has done that for any front-end
      parameter.
    status: never_examined

  - id: met-006
    what: the ported front end's ratio test, distinct > 0.10
    kind: carried
    from: The same port, matching.py:103.
    re_derived_here: >-
      NO. Same standing as met-005 — no citation at the parameter, no test, and
      every valid mask depends on it. exp009 measured that a 2-D search makes this
      test systematically stricter, which is the closest anything has come to
      examining it, and that was incidental.
    to_re_derive: Sweep, as for met-005.
    status: never_examined

  - id: met-007
    what: the matcher window, win = 7
    kind: carried
    from: The same port. Repeated as a default in loop.py, matching.py and acquisition.py.
    re_derived_here: >-
      NO. bio-056 and exp009 both REASON against it — "1.0-1.4 px of vertical
      disparity against a 7 px window" — so it has been used as a yardstick without
      ever being examined as a choice.
    to_re_derive: Sweep the window and report error and valid fraction.
    status: never_examined

  - id: met-008
    what: INHIBITION_RADIUS = 20.0 px
    kind: carried
    from: >-
      visgraf/active-stereo@3f7a263:src/activestereo/policy/gaze.py:13, recorded in
      ADR-0002's consequences item 2. Cited by repo@sha at the parameter.
    re_derived_here: >-
      NO, AND IT IS SAID SO AT THE PARAMETER — "Not tuned here". This is the best
      documented of the carried values and is still unexamined: fc-007 closes IN
      FAVOUR OF "argmax variance plus inhibition of return at the predecessor's
      20.0 px radius", so a foreclosure names it without anything having measured it.
    to_re_derive: >-
      A sweep of the radius as a policy arm. RASTER_PITCH is derived from it
      (20.0 * sqrt(pi)), so exp002's uninformed arms move with it too.
    exposure_noted_at_18a: >-
      RECORDED AS A KNOWN RISK, NOT SWEPT. Step 18 varies gaze geometry
      substantially — a spherical capture has no field edge and the oculomotor
      layer admits azimuth out to pi/2 (bio-081) — so amplitudes far beyond the
      pinhole policy's half-field of 0.224 rad become reachable. An inhibition
      radius fixed at 20.0 PIXELS is a fixed angle only while the lattice pitch is
      fixed; on the equirect lattice the pitch varies with theta by 81.5x in solid
      angle (bio-080), so the same radius means very different things near the pole
      and at the equator. fc-007 closes IN FAVOUR OF a policy naming this constant.
      A cold session reading fc-007 into 18b should see this before it does.
    status: never_examined

  - id: met-009
    what: SALIENCY_SIGMA = 4.0, the port's saliency blur
    kind: carried
    from: ActiveStereo.step, via the port. Marked "Carried, not endorsed" at the parameter.
    re_derived_here: >-
      NO. It is the blur applied before every argmax this repository has taken, and
      loop.py records DEFECT 2 against it — the blur mixes invalid pixels written
      as 0.0 into their valid neighbours BEFORE the mask is reapplied. So a known
      defect and an unexamined constant sit in the same operation.
    to_re_derive: Sweep it, or fix DEFECT 2 first and then sweep it.
    status: never_examined

  - id: met-010
    what: fovea_sigma = 34.0 px
    kind: carried
    from: ActiveStereo's default, via the port.
    re_derived_here: >-
      NO. bio-065 measured that the foveal peak sits 3.6-56 px off the target under
      the shifted principal point and expressed the miss IN UNITS OF THIS SIGMA
      without ever asking where 34 came from. fc-009 records that an ANGULAR foveal
      weight is step 17/18 work, which would replace it rather than examine it.
    to_re_derive: Sweep it; or replace it with an angular weight, which is a different task.
    exposure_noted_at_18a: >-
      RECORDED AS A KNOWN RISK, NOT SWEPT. This already sits under the 21 px
      principal-point offset flagged at 17c (bio-065): the shift centres the gaze
      DIRECTION while the target is a POINT, so the foveal peak misses by 21 px at
      vergence 0.06 against sigma 34. On a spherical lattice a Gaussian in ROW AND
      COLUMN is not a Gaussian in angle at all — rows are meridians and columns are
      colatitude, so a circular pixel kernel is an increasingly elongated angular
      kernel toward the poles. fc-009 already names an ANGULAR foveal weight as
      step 17/18 work; 18b is where it stops being deferrable.
    status: never_examined

  - id: met-011
    what: prior_depth = 3.0 m and prior_std = 3.0 m
    kind: carried
    from: ActiveStereo's defaults, via the port.
    re_derived_here: >-
      NO — AND exp011's HEADLINE RESULT IS DENOMINATED IN IT. bio-072's coverage
      finding is that an open loop leaves "1.35-1.39 m of silent prior error" on
      28-34% of the belief. That number IS prior_depth minus the true range: the
      scene is 2.4-4.5 m and the prior is 3.0. A different carried prior would move
      the largest effect this repository has measured.
    to_re_derive: >-
      State it as a modelling assumption with its consequence, or report the
      coverage result against a prior-free baseline such as "fraction of cells
      unmeasured" alone. Neither is done here.
    status: never_examined

  - id: met-012
    what: the disparity search window, dmin = 0 and dmax = f*b/0.8 (0.8 m near clip) -> [0, 56]
    kind: carried
    from: ActiveStereo's default, via the port; loop.py:101.
    re_derived_here: >-
      THE WINDOW WAS EXAMINED AS A VARIABLE, THE 0.8 m NEAR CLIP WAS NOT. exp003
      tested NARROWING it (arms N and V) and fc-010 closed that; nothing tested the
      default itself, and no one has asked why 0.8 m. bio-057 later found the
      deeper issue is not the bounds but the SIGN — cost_volume cannot search
      negative disparity at all — which no sweep of the bounds would have found.
    to_re_derive: >-
      State the near clip as a scene assumption and check it against each
      stimulus's actual depth range, which exp009 had to do by hand and recorded as
      SCENE_NEAR_M / SCENE_FAR_M in its runner rather than in src/.
    status: partly_examined

  - id: met-013
    what: CANDIDATE_STRIDE = 4, the field-integral policy's candidate grid
    kind: measurement
    from: >-
      Pre-registered as 8 with a declared halving check, WHICH IT FAILED — stride 8
      picks (128, 176) and stride 4 picks (120, 180) — so it was reduced to 4 before
      any arm was scored, and stride 4 passes its own halving check.
    re_derived_here: >-
      YES. This is the one constant in this section that this repository derived,
      by a pre-registered rule, and recorded the failure that moved it. It is
      included as the CONTRAST CASE: it shows what the others would look like if
      they had been examined.
    to_re_derive: Already done; bio-013 records the ladder.
    status: derived_here


measurements:
  # ==============================================================================
  # exp001 — matcher baseline on random-dot stereograms
  # Provenance warning: this experiment's run SHA is recorded in the source as
  # "(pre-commit)". Its numbers are not recoverable to a commit. See falsifier 1.
  # ==============================================================================

  - id: as-exp001-foveal-mae
    statement: Median absolute foveal depth error, block matching vs SGBM, on a piecewise-constant RDS.
    value: {block: 1.27e-3, sgbm: 0.0}
    spread: {block: 1.24e-5, sgbm: 0.0}
    units: m
    n: {seeds: 5}
    stimulus_family: rds
    matcher: [block, sgbm]
    configuration: rds_disk, 240x320, dot size 2, block d48_w7, sgbm d48_b7, ADR-0003 foveal confinement active at coefficient 1e-4
    provenance:
      cited_as: visgraf/active-stereo@3f7a263
      source: experiments/exp001_matcher_baseline/findings.md:26-27
      experiment: exp001
      run_id: exp001-20260815T211624
      measured_at_sha: null
    status: inherited
    notes: >-
      The source flags SGBM's exactly-0.0 as suspicious in its own threats section:
      `disk` is piecewise-constant in depth, two integer disparities, no gradient.
      It asks for a rerun on slanted_plane and corrugated, which never happened
      (gap-006). Treat 0.0 as an artefact of stimulus easiness, not as precision.

  - id: as-exp001-coverage
    statement: Fraction of pixels answered, block matching vs SGBM, on a piecewise-constant RDS.
    value: {block: 0.993, sgbm: 0.877}
    units: fraction
    n: {seeds: 5}
    stimulus_family: rds
    matcher: [block, sgbm]
    configuration: as as-exp001-foveal-mae
    provenance:
      cited_as: visgraf/active-stereo@3f7a263
      source: experiments/exp001_matcher_baseline/findings.md:26-27
      experiment: exp001
      run_id: exp001-20260815T211624
      measured_at_sha: null
    status: inherited
    notes: The source reads block's near-perfect coverage as a symptom, not a virtue.

  - id: as-exp001-hallucination
    statement: Fraction of ground-truth half-occluded pixels given a confident depth, on RDS.
    value: {block: 0.796, sgbm: 0.090}
    units: fraction
    n: {seeds: 5}
    stimulus_family: rds
    matcher: [block, sgbm]
    configuration: as as-exp001-foveal-mae
    provenance:
      cited_as: visgraf/active-stereo@3f7a263
      source: experiments/exp001_matcher_baseline/findings.md:26-27
      experiment: exp001
      run_id: exp001-20260815T211624
      measured_at_sha: null
    status: inherited
    notes: >-
      SGBM's 0.090 did not transfer: 0.536 on photographs (as-exp004-heldout-medians).
      The source repo's own recommendation of SGBM rested on this value.

  # ==============================================================================
  # exp002 — energy-model encoder validation on synthetic random-dot pairs
  # ==============================================================================

  - id: as-exp002-gain-invariance-drift
    statement: Population-mean peak-channel drift across a 3x interocular contrast gain sweep.
    value: 0.031
    range: [0.024, 0.035]
    units: px
    n: {seeds: 5}
    stimulus_family: synthetic_pair
    matcher: energy
    configuration: DisparityEncoder at committed config.yaml, gains {0.5, 0.75, 1.0, 1.25, 1.5}, d0=8
    provenance:
      cited_as: visgraf/active-stereo@3f7a263
      source: experiments/exp002_energy_model_validation/findings.md:41-44
      experiment: exp002
      run_id: exp002-20260815T200128-965a3ad
      measured_at_sha: 965a3ad
    status: inherited
    notes: >-
      Two orders under the 0.5 px falsifier. Backed by an algebraic argument (pooling
      is linear and precedes rectification) rather than by the number alone, which is
      the reason it later reproduced end-to-end as as-exp006-gain-multiplier.

  - id: as-exp002-peak-precision
    statement: Fraction of valid pixels whose peak channel lands within one bank step of true disparity.
    value: 0.580
    range: [0.50, 0.58]
    units: fraction
    n: {seeds: 5}
    stimulus_family: synthetic_pair
    matcher: energy
    configuration: as as-exp002-gain-invariance-drift, gain 1.0, threshold +/-1 bank step
    provenance:
      cited_as: visgraf/active-stereo@3f7a263
      source: experiments/exp002_energy_model_validation/findings.md:52-56
      experiment: exp002
      run_id: exp002-20260815T200128-965a3ad
      measured_at_sha: 965a3ad
    status: inherited
    notes: >-
      Failed its >=0.95 falsifier. Not a bias problem: per-seed population-mean peak
      channel is 7.93-8.16 against d0=8 (as-exp002-population-mean-peak). A per-pixel
      precision limit, diagnosed as correlated Gabor pooling and never independently
      confirmed.

  - id: as-exp002-population-mean-peak
    statement: Per-seed population-mean peak channel against a true disparity of 8 px.
    value: [7.93, 8.16]
    units: px
    n: {seeds: 5}
    stimulus_family: synthetic_pair
    matcher: energy
    configuration: as as-exp002-gain-invariance-drift, gain 1.0
    provenance:
      cited_as: visgraf/active-stereo@3f7a263
      source: experiments/exp002_energy_model_validation/findings.md:54-55
      experiment: exp002
      run_id: exp002-20260815T200128-965a3ad
      measured_at_sha: 965a3ad
    status: inherited
    notes: Recorded as a per-seed range; the source gives no single pooled value.

  # ==============================================================================
  # exp003 — appearance and matching on a rendered Blender material chart
  # ==============================================================================

  - id: as-exp003-variance-by-region
    statement: Median reported disparity variance by region class, block matcher, on a rendered chart.
    value: {textured_matched: 90.0, textureless_matched: 57340, half_occluded: 425.8}
    units: px^2
    n: {renders: 12}
    stimulus_family: rendered_chart
    matcher: block
    configuration: material-chart, 8 coplanar patches at 1.05 m, backdrop 1.6 m, 3 lighting rigs x 4 permutations, 512 spp, block d48_w7, confine_to_fovea NOT applied
    provenance:
      cited_as: visgraf/active-stereo@3f7a263
      source: experiments/exp003_appearance_and_matching/findings.md:121-126
      experiment: exp003
      run_id: exp003-20260816T131125-3fe9985
      measured_at_sha: 3fe9985
    status: inherited
    notes: >-
      The source corrected itself here: it had asserted the matcher "has no idea" it
      is wrong on textureless surfaces, then measured it and inverted the conclusion.

  - id: as-exp003-occluded-matched-variance-ratio
    statement: Occluded/matched reported-variance ratio on a rendered chart, block matcher.
    value: 4.73
    units: ratio
    n: {renders: 12}
    stimulus_family: rendered_chart
    matcher: block
    configuration: as as-exp003-variance-by-region
    provenance:
      cited_as: visgraf/active-stereo@3f7a263
      source: experiments/exp003_appearance_and_matching/findings.md:121-126
      experiment: exp003
      run_id: exp003-20260816T131125-3fe9985
      measured_at_sha: 3fe9985
    status: inherited
    notes: >-
      Derived here as 425.8/90.0 from as-exp003-variance-by-region; the source states
      it as "5x" and does not print the quotient. ABOVE 1.0 — under-inflated but not
      inverted. Contrast as-exp004-variance-ratio (0.324, inverted) on photographs and
      as-exp005a-rds-comparison (1.923, block on RDS). No contrast split exists for
      this value; see gap-001.

  - id: as-exp003-textureless-variance-ratio
    statement: Textureless/textured reported-variance ratio on a rendered chart, block matcher.
    value: 637
    units: ratio
    n: {renders: 12}
    stimulus_family: rendered_chart
    matcher: block
    configuration: as as-exp003-variance-by-region
    provenance:
      cited_as: visgraf/active-stereo@3f7a263
      source: experiments/exp003_appearance_and_matching/findings.md:121-126
      experiment: exp003
      run_id: exp003-20260816T131125-3fe9985
      measured_at_sha: 3fe9985
    status: inherited
    notes: >-
      Error inflates ~100x while variance inflates 637x, so inverse-variance fusion
      discounts these enough. This is the case the machinery handles correctly.

  - id: as-exp003-error-and-coverage-by-material
