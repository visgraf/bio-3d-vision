  - id: gap-010
    statement: The analytic fixture has no true half-occlusions, so no occlusion claim can be measured on it.
    value: null
    units: null
    n: null
    stimulus_family: analytic_fixture
    matcher: [block]
    configuration: not measurable on this fixture by construction
    provenance:
      cited_as: visgraf/bio-3d-vision
      source: >-
        src/bio3dvision/fixture.py::make_synthetic_scene, ported unchanged from
        visgraf/bioeye@e908170:active_stereo_demo.py:75; verified empirically at
        commit ae11496
      experiment: null
      run_id: null
      measured_at_sha: ae11496
    status: gap
    notes: >-
      The right image is not rendered, it is RESAMPLED FROM THE LEFT:
      map_coordinates(left, [ys, xs + d_gt], order=1, mode="reflect"). There is one
      texture array in the generator and no second surface, so no pixel of the right
      image can contain anything the left image does not already contain — and that
      is precisely what a half-occlusion is: a region visible to one eye and hidden
      from the other, showing a DIFFERENT surface.
      Verified rather than read off. Measured on the committed fixture at seed 0: 0
      right-image values fall outside the left image's value range; 430 adjacent
      right-pixel pairs have a non-increasing sampling position x + d(x), which is
      exactly where a renderer would produce an occlusion band and where this
      sampler instead re-reads left texture it has already used; and 2640 pixels
      (3.4% of 76800) sample beyond the last column, where mode="reflect" folds
      texture back rather than revealing unseen background.
      TWO MECHANISMS, worth separating because the brief named only one.
      mode="reflect" is the EDGE mechanism and accounts for the 3.4%. At interior
      depth steps the occlusion is erased by something else: the forward map is
      non-monotonic there, and linear interpolation of a non-monotonic map yields a
      stretched copy of the occluding surface's texture. Removing mode="reflect"
      would fix neither.
      CONSEQUENCE, and it belongs next to gap-001: any occlusion claim measured on
      this fixture is unsound, and that explicitly includes anything about the
      occluded/matched variance ratio. The fixture cannot even pose gap-001's
      question, let alone answer it — which is why closing gap-001 needs a rendered
      stimulus (od-002 in docs/state.yaml).
      This reinforces fc-004 concretely: the fixture is a TEST FIXTURE, and a
      finding that rests on it has misused it. bio-008 is the live example — the
      posterior std ranks error positively here (+0.42), and it would be a
      straightforward misreading to cite that as evidence against the
      anti-calibration. It is not evidence either way.
