      front_end_median_abs_err_m: 0.0668
      front_end_scored_fraction: 0.694
      solid_angle_with_geometry: 0.7295
    units: m
    n: {seeds: 8, budget: 40, belief_cells: 131072, lattice: [2048, 1024]}
    stimulus_family: rendered_chart
    matcher: block
    configuration: >-
      ONE equirect capture per seed, shared by both arms, which fc-013 licenses.
      2048x1024 raster, transposed and row-reversed onto EquirectSampling((2048,
      1024)); the pole is posed on the baseline so rows are epipolar. Disparity is
      matched with the ported block matcher on column-reversed images — theta_R >
      theta_L makes d negative in this lattice and cost_volume cannot search
      negative (bio-057), and reversing is an index permutation. Range comes from
      the sine rule and variance from bio-083's Jacobian. Ground truth is the depth
      pass. Belief on EquirectSampling((512, 256)). Seeds vary the plane distances,
      not only the texture.
    provenance:
      cited_as: visgraf/bio-3d-vision
      source: exp013, falsifier (c)
      experiment: exp013_spherical_allocation
      run_id: null
      measured_at_sha: f2fc52c
      environment: {python: 3.13.15, numpy: 2.5.2, scipy: 1.18.1, matplotlib: 3.11.1}
    status: measured
    notes: >-
      OUTCOME (c), AND THE MECHANISM IS MEASURED RATHER THAN ASSERTED: F puts more
      than 1% of its peak weight on 21.5% of the sphere's solid angle and U on
      100%. F leaves four fifths of the sphere at the prior.
      THE READING IS NOT "ALLOCATION IS WORTHLESS". A foveal weight models an
      ACUITY GRADIENT. A uniform capture has none, so weighting by gaze discards
      information that is already in hand and buys nothing back. That is fc-013's
      argument arriving in an experiment, and od-004's case stated from the other
      side: the weight is justified by a SENSOR PROPERTY, and this sensor does not
      have it.
      THE COMPARISON CANNOT SHOW (a), AND SAYING SO IS PART OF THE RESULT. In the
      pinhole loop, foveal advantage has two sources: the acuity weight, and
      scale_to_depth's LINEARISATION REMAINDER, which loop.py's own comment says
      "confines each fixation's confident estimate to its foveal neighbourhood".
      The sine rule is exact, so the second source has no spherical analogue and F
      has upside only if down-weighting helps, which it cannot. exp011's accuracy
      term may therefore be a property of the SCALING LAYER rather than of
      allocation — a claim this experiment raises and does not settle.
      U IS NOT exp011's OPEN. OPEN also used a foveal weight; U uses none, so U is
      a STRONGER arm than either exp011 arm. A faithful transposition of exp011's
      pair is impossible here because CLOSED-vs-OPEN is degenerate (fc-013), and
      this is the nearest well-posed question, not the same one.
      FOUR APPARATUS FAULTS PRECEDED THIS NUMBER and are recorded in the runner
      commit. One of them had a WRONG FIRST EXPLANATION written down before the
      real cause was found.

