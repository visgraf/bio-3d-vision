  # visgraf/bioeye@e908170 (bio-009), so these describe the PREDECESSOR'S loop
  # exactly — they are this repository's measurements of inherited behaviour, not
  # measurements of anything new. Two of the three defects named in loop.py are
  # visible in them, which is the point: they are the baseline a deviation is
  # measured against.
