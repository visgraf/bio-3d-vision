    notes: >-
      CORRECTION TO THE BRIEF THAT COMMISSIONED THIS RECORD. The gap was given as "the
      occluded/matched variance ratio was measured on photographs only (exp004,
      exp006); exp001 measured hallucination on RDS but reported no variance ratio."
      The second clause is confirmed — exp001's table carries MAE, spread, coverage and
      hallucination and no variance column. The first clause is FALSE, and the
      instruction was to verify before recording, so the gap is not recorded as stated.
      Two counter-examples: exp005 Stage A reports an occluded/matched variance ratio
      on RDS (findings.md:33 — block 1.923, energy 0.957), and exp003 reports one on a
      rendered chart (4.73, as-exp003-occluded-matched-variance-ratio). What is
      genuinely absent is narrower and sharper: every synthetic measurement is POOLED
      over contrast, while on photographs the inversion lives specifically in the
      HIGH-CONTRAST cell (0.254 in exp006, and below the matched median in 8 of 8
      scenes in exp004). The pooled synthetic numbers are on the safe side of 1.0
      (1.923 on RDS, 4.73 on the chart) and the pooled photograph number is on the
      dangerous side (0.324) — so pooling is exactly where the disagreement could be
      hiding, and no synthetic run has ever split it.
      Why load-bearing here: any precision weighting applied to a synthetic stimulus in
      this repository inherits an untested premise, and it is untested in BOTH
      directions — the photograph result may not transfer, and the RDS result may be
      concealing the same inversion inside a pooled average. A further obstacle worth
      stating: a contrast split may not even be well defined on a binary random-dot
      stereogram, which would mean testing the photograph finding synthetically
      requires a stimulus family that neither reference repository contains.

