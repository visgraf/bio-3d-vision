  - id: bio-083
    statement: >-
      The spherical depth Jacobian is theta-dependent. var_r goes as 1/sin^2(theta),
      so the least certain directions on the sphere are the EPIPOLES.
    value:
      closed_form: "dr/dd = -b * sin(theta_L) / sin^2(d)"
      max_rel_err_vs_central_difference: 1.29e-08
      points_checked: 50000
      large_r_form: "|dr/dd| ~ r^2 / (b sin(theta))"
      pinhole_form_angular_units: "|dZ/deta| = Z^2 / b, no theta at all"
      var_r_ratio_vs_equator: {60: 1.33, 45: 2.00, 30: 4.00, 20: 8.55, 10: 33.16, 5: 131.65, 2: 821.04, 1: 3283.14}
      jacobian_m_per_rad_at_3m: {90: 138.53, 45: 201.91, 20: 421.51, 10: 831.77, 5: 1657.99, 2: 4141.12}
    units: mixed
    n: {points: 50000}
    stimulus_family: analytic_fixture
    matcher: none
    configuration: >-
      Derived by hand from r(d) = b sin(theta_L + d)/sin(d) — the numerator of the
      derivative collapses to -sin(theta_L) — and checked against a central
      difference at h = 1e-7 over 50000 random (theta_L, d) pairs. No CAS; sympy is
      not a dependency here and none was added.
    provenance:
      cited_as: visgraf/bio-3d-vision
      source: step 18b Part C
      experiment: null
      run_id: null
      measured_at_sha: f2fc52c
      environment: {python: 3.13.15, numpy: 2.5.2, scipy: 1.18.1, matplotlib: 3.11.1}
    status: measured
    notes: >-
      THE PINHOLE JACOBIAN IS CONSTANT PER FIXATION AND THIS ONE IS NOT. var_Z is
      what every allocation policy reads, so a pinhole Jacobian applied to
      spherical data would misweight the whole field systematically with theta.
      THE PREDICTION IT GENERATES POINTS THE OPPOSITE WAY TO THE SPECIFICATION.
      The specification expected a variance-driven policy to "prefer the equator".
      That holds for a policy seeking GOOD measurements; argmax-variance seeks
      UNCERTAIN ones, and uncertainty is worst exactly where measurement is worst —
      at theta -> 0 and pi, which are the EPIPOLES, the directions in which stereo
      carries no depth information at all. So the derivation predicts the policy is
      DRAWN toward the poles and wastes budget there.
      MEASURED IN exp013 AND NOT CONFIRMED AS A POLICY PREFERENCE (bio-085): the
      gaze median is 62.8 degrees and only 10.3% of fixations land within 30
      degrees of an epipole. The mechanism is real and is PRE-EMPTED — the matcher
      cannot resolve sub-column disparities near the epipoles, so those cells fail
      validity and are excluded from selection before the policy can prefer them.
      Two independent effects pointing the same way, one of them arriving first.

