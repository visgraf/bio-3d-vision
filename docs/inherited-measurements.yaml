      eye. The analytic figures are 199806 random points at |P| > 0.5 m.
    provenance:
      cited_as: visgraf/bio-3d-vision
      source: step 18a falsifier 2
      experiment: null
      run_id: null
      measured_at_sha: c44af87
      environment: {python: 3.13.15, numpy: 2.5.2, scipy: 1.18.1, matplotlib: 3.11.1}
    status: measured
    notes: >-
      FALSIFIER 2 PASSES, AND THE PARAMETERISATION IS AVAILABLE BY POSING RATHER
      THAN WARPING — the option exp009 established is worth having. Longitude is
      IDENTICAL between the eyes to 0.0 rad, not merely close.
      BLENDER RASTERISES IT TRANSPOSED FROM WHAT THE MATCHER NEEDS. With the pole
      on the baseline the epipolar great circles are meridians, and meridians are
      COLUMNS, so as rendered the disparity is vertical and cost_volume's
      horizontal shift would find nothing. The fix is a transpose, which is an
      exact index permutation: no interpolation, no correlation introduced, and so
      none of the variance cost that made exp009 prefer posing to warping. The
      transposed raster has equal angular pitch on both axes, 0.012272 rad.
      THE DEPTH RELATION IS THE SINE RULE AND NOT f*b/z. r_L = b sin(theta_R) /
      sin(theta_R - theta_L), which is the triangle (left centre, right centre,
      point) solved with the sine rule. IT DEPENDS ON THETA, THE ANGLE FROM THE
      BASELINE, AND THE PINHOLE RELATION HAS NO ANALOGUE OF THAT: at 3 m the
      disparity is 5.8x larger at theta = 90 deg than at 10 deg. Substituting into
      f*b/z is wrong rather than approximate.
      ONE CONVENIENCE THE PINHOLE CASE DID NOT HAVE: the angular disparity of a
      parallel pair is STRICTLY POSITIVE everywhere (minimum 9.2e-05 rad over
      199806 points), so bio-057's defect — cost_volume cannot search negative
      disparity — does not bite here. That is a property of the geometry, not a
      repair of the matcher.

