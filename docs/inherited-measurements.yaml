  # ==============================================================================
  # MEASURED IN THIS REPOSITORY
  #
  # The first numbers this project owns. All produced by one run of the ported
  # baseline: bio3dvision.run_baseline(steps=18, seed=0), block matcher, on the
  # ported analytic fixture.
  #
  # What they are and are not. The port is bit-identical to
  # visgraf/bioeye@e908170 (bio-009), so these describe the PREDECESSOR'S loop
  # exactly — they are this repository's measurements of inherited behaviour, not
  # measurements of anything new. Two of the three defects named in loop.py are
  # visible in them, which is the point: they are the baseline a deviation is
  # measured against.
  #
  # All were independently checked against values supplied from a different
  # environment (Python 3.12.3, numpy 2.4.4, scipy 1.17.1, matplotlib 3.10.8) and
  # reproduced to every digit given, here on Python 3.14.6, numpy 2.5.2,
  # scipy 1.18.1, matplotlib 3.11.1.
  #
  # THAT SENTENCE IS NOW ALSO A FIELD. It is the origin of `provenance.environment`
  # — it was the only record of what these numbers ran under, and being prose it
  # could not be queried, compared or contradicted. Each of bio-001..bio-009 now
  # carries the same fact per entry. bio-010..bio-022 carry `null`, because no
  # comparable sentence was ever written for them.
  # bio-023 re-runs the eight of these that are pinned as tests, on Python 3.13.15
  # from the CI matrix. Read its `notes` before citing it: the numeric libraries
  # were unchanged, so it crosses interpreters and not library versions.
  # ==============================================================================

