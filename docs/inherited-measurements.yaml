    status: measured
    notes: >-
      NOT A RESULT ABOUT THE EXPERIMENT — A FINDING ABOUT src/matching.py, and the
      most consequential thing exp009 turned up. bio-056 recorded that the matcher
      assumes a RECTIFIED pair. This is stronger and was not visible then: it
      assumes a PARALLEL one. Rectification is what makes a pair parallel, so the
      two assumptions are only distinguishable once something renders a converged
      pair and matches it without rectifying, which exp009 is the first thing to do.
      IT DOES NOT FAIL. It returns confident garbage: the first complete exp009 run
      reported TOED valid fractions of 0.019 and range errors of 3.8-17 m on a
      2.4-4.5 m scene, and those numbers were briefly written down as a result.
      matching.lr_consistency inherits it — it mirrors the pair and calls
      cost_volume, so on a converged pair every cost slice is identical and the
      argmin is whichever index comes first. That alone drove the valid fraction
      to 0.009.
      NOT FIXED IN src/. exp009 works around it in the experiment with a signed
      cost volume and a signed right-referenced consistency pass. Whether src/
      should carry a signed matcher is a decision, not a repair, and it belongs
      with the rectify-or-not decision this experiment measured for.

