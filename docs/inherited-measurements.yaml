      the direction is correct for an angular weight too; the offset is a
      consequence of the TARGET BEING A POINT, not of the weight being in pixels.
      The fix is to aim the weight at the fixation's own image — centre + d/2 in the
      left eye — which needs the vergence estimate the loop already computes.

