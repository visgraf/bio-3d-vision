      step 17/18 work. THIS IS A SECOND, SEPARATE THING and it is new with the
      shift: the shift centres the gaze DIRECTION, while the thing the loop is
      looking AT is a point at finite range, which images at +/- d/2 about that
      centre — LEFT EYE POSITIVE.
      WHY IT IS RECORDED RATHER THAN FIXED: a misaimed foveal accumulation would
      read as a result. At vergence 0.06 the target sits 21 px off the Gaussian's
      peak, 0.62 sigma, and still collects 83% weight — small enough to look like
      the loop simply not helping much, which is the exact ambiguity that has now
      been recorded three times in this repository under different names.
      IT IS NOT CONSTANT ACROSS THE SWEEP, WHICH IS WHAT MAKES IT DANGEROUS. At
      vergence 0.03 the target keeps 95% of the weight; at 0.16 it keeps 26%. A
      loop whose vergence moves therefore has a foveal weight whose aim degrades
      with the state, so an arm that verges nearer is penalised by the apparatus
      and not by its policy.
