      the world direction each cell views is invariant to the cell — so the frame
      logic carries over. But `reproject` ANDs `in_eye[..., 2] > 0.0` into
      visibility, which on a sphere discards the BACK HEMISPHERE at every amplitude.
      THE CONSTANT 0.5 IS THE SIGNATURE AND IS WHY THIS IS NOT A ROUNDING DETAIL.
      Pinhole grid loss GROWS with amplitude — 0.041 at 1 deg to 0.584 at 15
      (bio-055) — because what it loses is the field edge. This loses a fixed half
      sphere at every amplitude, including 1 degree, which no field-of-view effect
      can produce. NOT FIXED HERE: 18a builds and pins, and changing reproject is a
      decision about what the belief means, not a repair.
      THE NUMBER 18b's HYPOTHESIS RESTS ON IS THE FIRST ROW: ZERO grid lost by
      `contains` at every amplitude out to 60 degrees. exp011 measured OPEN
      ever-measuring 0.54-0.70 of the belief because one pinhole view cannot see
      more of the scene; a spherical capture has full coverage by construction, so
      the coverage term that dominated exp011 by 33x to 341x should vanish. THAT IS
      A HYPOTHESIS, NOT A RESULT — 18a builds the instrument and runs no experiment.
      THE DRIFT IS QUANTISATION, CHECKED RATHER THAN ASSERTED. Nearest-neighbour
      reprojection cannot preserve a direction exactly on a finite lattice. Halving
      the cell pitch halves the drift, and drift/pitch is flat at 0.656-0.701 across
      a 8x range of resolutions, so the residual is the cell and not a frame error.
      A LIMIT THAT IS THE OCULOMOTOR LAYER'S AND NOT THE SAMPLING'S: eye_rotations
      refuses azimuth >= pi/2, because beyond the interaural axis the Vieth-Muller
      chord subtends pi - vergence. So the sphere can represent every direction and
      the geometry cannot FIXATE beyond a quarter turn. 18b must respect that.

