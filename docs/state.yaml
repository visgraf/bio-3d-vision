  - iteration: 8
    id: fv-011-1a
    falsifier: >-
      The loader reads bioeye@e908170's shipped depth_left.exr correctly, and
      infer_depth_convention returns "planar" on it. If the depth path is wrong,
      every ground-truth comparison built on it would be silently corrupt.
    verdict: SPLIT — first clause did_not_fire, second clause REFUTED AS WRITTEN
    numbers:
      shape: [240, 320]
      channels_present: [B, G, R]
      channels_identical: true
      depth_range_m: [1.7018, 5.0000]
      finite_fraction: 1.0
      whole_image_median_m: 3.4225
      f_px: 311.1111111111111
      baseline_m: 0.065
      infer_depth_convention: unknown
    detail: >-
      THE LOADER CLAUSE PASSES. The shipped Blender 4.x artifact loads into the
      same four-tuple make_synthetic_scene returns, with the same CameraParams
      keys, at 240x320 and 1.702-5.000 m.
      THE SECOND CLAUSE IS WRONG AS SPECIFIED, and reporting it as passed would
      have required weakening the guard. infer_depth_convention returns "unknown"
      on this file, not "planar", and "unknown" is the correct answer. The pass
      IS planar — bioeye's render_stereo_blender.py:10 documents it as linear
      camera-space Z in metres — but the inference is only meaningful on a
      FRONTO-PARALLEL CALIBRATION RENDER and this is an ordinary scene of blocks.
      That refusal is the entire guard. The reference's docstring records that an
      earlier version answered "radial" here with complete confidence, because
      any scene with nearer objects mid-frame has depth growing toward the
      corners, and would have applied a spurious several-percent correction at
      the field edge — indistinguishable from a modelling result. Making this
      file answer "planar" means removing the radial-symmetry check that produces
      the refusal, which is the near-miss restored.
      So the specification asked for the one assertion that could only be
      satisfied by breaking the thing it asked to carry. The known-answer test it
      wanted exists and passes; it needs a flat-wall render and is fv-011-1b.
      Recorded as split rather than as either verdict alone.
    verified_at_commit: f58aa7d

  - iteration: 8
    id: fv-011-1b
    falsifier: >-
      The loader reads a fresh render from the installed Blender and the loaded
      depth matches the analytic Z = f*I/d on fronto-parallel surfaces at known
      distances, within a stated tolerance. This is the test gap-009 says the
      reference does not have, and the reason Blender moved from step 7 to step
      11: a renderer migrated before its consumer can only be self-tested.
    verdict: did_not_fire
    ran_against_a_real_blender: true
    numbers:
      blender: 5.2.0 LTS (fbe6228777e7)
      planes_m: [2.0, 3.0, 4.5]
      pixels_compared: 64320
      max_abs_error_m: 0.0
      tolerance_stated_m: 0.001
      finite_fraction: 0.8375
      disparity_range_px: [6.4198, 14.4444]
      wall_render_convention: planar
      tiled_render_convention: unknown
    detail: >-
      EXACT, over every pixel of all three planes, against a stated tolerance of
      1 mm. The exactness is a property of the apparatus and not a surprise: the
      planes sit at exactly representable distances and the Z pass is 32-bit
      float, so no arithmetic sits between the geometry and the file.
      It is not an insensitive test. A units error, an f_px scale error, or
      colour management reaching the depth pass would all move it, and so would a
      RADIAL pass compared against planar truth — that disagreement is zero at
      the centre of frame and several percent at the edge, and the maximum here
      is taken over whole planes including their edges. Zero is therefore a
      positive result about the convention.
      The convention guard was exercised in the same session on both scenes: it
      answers "planar" on the flat wall and "unknown" on the three-plane scene.
      Both are asserted together, because "planar" alone could come from an
      inference that always says planar and "unknown" alone from one that never
      decides.
      A DEFECT THIS FOUND, worth recording because it would have made the
      falsifier pass vacuously: the first version of the calibration scene stacked
      full-frame planes concentrically, so the nearest occluded the rest and the
      depth map contained exactly ONE distance. The render succeeded and reported
      nothing. A falsifier written to check three distances would have checked
      one. The planes are now tiled across the frame and the test asserts that
      each distance is present, that nothing else is, and that the gaps between
      them load as nan.
    verified_at_commit: f58aa7d

  - iteration: 8
    id: fv-011-2
    falsifier: >-
      If the minimum Blender path exceeds roughly 400 lines, the "migrate the
      minimum" reading was wrong, the Blender surface is not separable at the
      granularity assumed, and step 11's scope needs revisiting before more is
      built on it.
    verdict: did_not_fire ON CODE, FIRED ON TOTAL LINES
    numbers:
      reference_total: 1834
      migrated_total_lines: 756
      migrated_code_lines: 349
      migrated_doc_and_comment_lines: 247
      migrated_blank_lines: 139
      breakdown_code:
        render_path: 191
        calibration_scenes: 50
        loader: 108
      largest_function_code_lines: {setup_depth_output: 45, render_stereo: 45, load_render: 31}
    detail: >-
      BOTH NUMBERS ARE REPORTED BECAUSE THE VERDICT DEPENDS ON WHICH IS MEANT, and
      the specification did not say. 349 code lines is under the threshold; 756
      lines of file is over it, nearly twice.
      The reading taken here is that it did not fire, and the reason is what the
      falsifier was written to detect: whether the Blender surface separates at
      the assumed granularity. It did. 349 code lines against the reference's
      1834 is an 81% reduction, and nothing was migrated because something else
      migrated called it — the off-axis and toed-in modes, chart sweeps, appearance
      ground truth, albedo contrast, multi-config machinery and multi-part EXR
      walking were all left behind, and load_render's dependency on
      depth_to_disparity, cross_check_occlusion, StereoStimulus and boxsum all
      dropped out with them.
      The 247 documentation lines are the specification's own instruction, not
      drift: it required the depth-convention guard to be carried WITH its
      rationale, on the argument that a guard without its reason gets simplified
      away. bio-026 shows that concern was justified — both files this repository
      reads need the channel-naming tolerance, and neither would motivate it on
      its own inspection.
      HONEST LIMIT ON THIS VERDICT: 50 of the 349 code lines are calibration
      scenes, which are falsifier apparatus rather than the path from Blender to
      the loop. A stricter reading of "the minimum path" is 299. A looser one that
      counts every line of file is 756. The maintainer may take a different
      reading than the one recorded here, which is why all three numbers are on
      the record rather than the one that supports the verdict.
    verified_at_commit: f58aa7d

# ------------------------------------------------------------------------------
# STANDING CONSTRAINTS
#
# Measured costs and impossibilities that bind future work regardless of what is
# decided. Not decisions; consequences.
# ------------------------------------------------------------------------------
constraints:

  - id: cn-001
    from: exp001, falsifier 2
    statement: >-
      Any information-gain gaze policy costs a full field integral per candidate
      per step. The cheap single-pixel approximation does not substitute for it.
    evidence: >-
      B (argmax of the single-pixel Delta_c(c)) and C (argmax of the field
      integral Delta_total(c)) never selected the same candidate: argmax agreement
      0.000 over 144 comparisons (8 seeds x 18 steps), evaluated at the same state
      on the same grid, with picks a median 115 px apart — 3.4 x the 34 px fovea
      sigma, i.e. non-overlapping regions rather than neighbouring pixels.
      Spearman over the grid +0.278.
    cost_measured: >-
      C at stride 4 is 3314 field integrals per step, 1.8 s per step, against
      under a millisecond for argmax v with inhibition of return — roughly 1e4x.
    binds: >-
      Whoever reopens fc-007. It does not bind current work, because fc-007
      forecloses adopting such a policy at all.
    caveat: >-
      B and C were technically INDISTINGUISHABLE on the declared trajectory
      metrics, but the median comparison landed at 0.97 of its bar — a knife-edge,
      unlike the A'-vs-C verdict. This constraint rests on the argmax evidence,
      which is unambiguous, not on the trajectory comparison, which is not.
