# ==============================================================================
# STATE — written by Code, read by Chat. Never the reverse.
#
# Chat does not edit this file. That is what keeps it a report of what is true
# rather than a record of what was intended. It is the only durable channel from
# Code back to Chat, and it is why a Chat session can start without a briefing.
#
# Update it in the same commit as the change it describes. If it disagrees with
# the repository, the repository is right and this file is a bug.
# ==============================================================================

schema_version: 1
updated_at: 2026-08-29

# PROVENANCE, NOT A STALENESS TEST. This names the repository state the file
# describes — the same role `measured_at_sha` plays on a measurement. It
# NECESSARILY LAGS the commit that carries it, because no commit can name the
# merge that contains it, and that lag is not staleness. Do not compare it
# against HEAD and conclude anything.
#
# It previously carried the comment "so a reader can tell a stale state file from
# a current one", which invited exactly that comparison and would have failed
# after every merge. Staleness is tested per half, in `sequence`, and each half
# gets the test it can actually pass.
updated_by_commit: f58aa7d   # the repository state this file describes

# ------------------------------------------------------------------------------
# SEQUENCE — where this project is, and what it plans next
#
# TWO HALVES, AND THEY HAVE DIFFERENT STANDING. `position` is established: it is
# derivable from the foreclosure ledger and the merged history, and it cannot be
# wrong without the ledger being wrong. `plan` is INTENT, supplied from the Chat
# surface, and is not established by anything in this repository.
#
# The distinction is the same one docs/inherited-measurements.yaml draws between
# `measured` and `inherited`, and for the same reason: a future session should
# treat the plan half as a prior, not as a fact.
#
# Nothing normative lives here. Invariants are in CLAUDE.md, decisions in
# `foreclosures`, measurements in docs/inherited-measurements.yaml. This block
# exists so a session starting cold knows where it is.
#
# This block was originally specified as "position, not intent". That was wrong
# and is corrected here by splitting it: eighteen planned steps, amended twice in
# seven iterations and expected to be amended again, are not position.
# ------------------------------------------------------------------------------
sequence:

  staleness:
    note: >-
      NO SINGLE RULE, BECAUSE THE TWO HALVES GO STALE DIFFERENTLY. Each half
      carries the check it can actually pass; see `position.checking` and
      `plan.staleness`.
    amended: >-
      Corrected in place. This block previously read "stale if `updated_by_commit`
      lags the last merge on `main`" and recorded 5e181d0. That rule COULD NOT
      PASS: merging the block advanced `main` to dde3b47, and no commit can name
      the merge that contains it, so the rule fired immediately and would have
      fired after every subsequent merge. A check that always fires is one a cold
      session learns to skip, which is the failure the rule was written to
      prevent. Recorded rather than silently swapped, because the defect is worth
      more than the fix: it is the same shape as a claim that cannot fail.

  # --- POSITION: established, derivable from the ledger and merged history -----
  position:
    standing: >-
      Established. Every entry below is derivable from `foreclosures`, the
      measurement record, and the merged history. It cannot be wrong without one
      of those being wrong.
    checking: >-
      DERIVE IT, DO NOT TRUST IT. This half has no timestamp and needs none: it
      claims to be derivable, so the check is to derive it. Three questions, each
      with a definite answer from the repository alone:
        (1) for every step in `complete`, does the entry named in `evidence`
            EXIST, and does that entry, READ IN FULL, ACTUALLY DECIDE WHAT THE
            STEP'S TITLE NAMES. Both halves are required and the second is the
            one that bites: an id that resolves is not an id that agrees. If the
            step is "Decide X", find the sentence in the named entry that decides
            X. If there is no such sentence, the claim is unearned and this check
            has failed, however well-formed the reference is;
        (2) is `next` the lowest-numbered step that is neither complete nor
            deferred;
        (3) does every id referenced anywhere in this block resolve — in
            `foreclosures`, `open_decisions`, or docs/inherited-measurements.yaml
            — counting an id this block names as CLOSED and redirects
            (od-001 -> fc-009) as resolving through its redirect, not as dangling.
      If all three hold, this half is current, whatever the date says. If one
      fails, the ledger and this block disagree and THE LEDGER IS RIGHT.
    checking_run: >-
      Run on arrival at f58aa7d, against the STRENGTHENED clause (1): it FAILED,
      on step 10. That failure is what this commit corrects, and the block below
      is the corrected state. Re-run after the correction: all three pass.
      The previous record here read "Run on arrival at dde3b47: all three pass."
      It was run against the weaker clause (1) and it passed on a false claim.
      See `checking_amended`.
    checking_amended: >-
      CLAUSE (1) WAS STRENGTHENED AFTER IT FAILED TO CATCH THE THING IT EXISTS TO
      CATCH. It previously asked whether every step in `complete` "still has the
      artifact or foreclosure named for it in `evidence`, and does that entry
      still say what is claimed here" — which reads as a two-part test but was
      applied as a one-part one, because "what is claimed here" was taken to mean
      the `evidence` line's own words rather than the STEP'S TITLE.
      The near-miss: `evidence` named fc-010 for step 10, fc-010 exists, its
      `evidence` line ("taken on measured evidence; od-003 records what would
      reopen it") is a true description of fc-010, and the check passed — the
      block recorded "Run on arrival at dde3b47: all three pass", preserved in
      `checking_run` above. The claim was still false. Step 10's title is "Decide the plant" and fc-010
      decides the disparity search window; none of its eleven fields mentions a
      plant, and fv-007-1 in this same file had already recorded that the
      consequence toward the attentional branch WAS NOT INVOKED. A resolving id
      and a true sentence about it were enough to pass a check meant to establish
      that the step had been decided.
      Caught instead by a cold session's arrival audit of the assumed repository
      state, which is not where it should have been caught. Recorded rather than
      silently swapped, in the style of `sequence.staleness.amended` and for the
      same reason: the defect is worth more than the fix. A check that passes on a
      false claim is the same shape as a claim that cannot fail.
    complete: [1, 2, 3, 4, 7, 8, 9, 10, 11]
    deferred:
      - step: 5
        until: the end of Stage 0
      - step: 6
        until: the loop runs
    next: 12
    evidence:
      1: docs/migration-inventory.md — 114 items classified across both references
      2: docs/inherited-measurements.yaml — the carried-results record, 73 entries
      3: CLAUDE.md, docs/workflow.md, docs/state.yaml
      4: pyproject.toml, CI, the flat package, spikes/
      7: the initial stub commit e3a17cf
      8: src/bio3dvision/{fixture,matching,loop,figure,baseline}.py, bit-identical to bioeye@e908170 (bio-009)
      9: fc-007, the first fw foreclosure (exp001), with its scope annotated and extended by fc-008 (exp002)
      # This line previously read "10: fc-010 (exp003), taken on measured
      # evidence; od-003 records what would reopen it". fc-010 does not decide
      # the plant; see `checking_amended` above and am-002-c.
      10: fc-011, taken by the maintainer on the evidence of fc-008 and fc-010 — a decision, not a run
      11: src/bio3dvision/blender_{render,load}.py, fv-011-1a and fv-011-1b, bio-024..bio-026
    out_of_sequence:
      - what: >-
          The sample-index to unit-ray boundary. Was od-001; CLOSED, and now
          recorded as fc-009 — it will not be found in `open_decisions`.
        note: >-
          Implemented as infrastructure closing an open decision, not as a
          numbered step. Recorded here because a cold session finding fc-009 in
          the ledger would otherwise have no step to attach it to. Its falsifier-2
          verdict is DEFERRED, not additive; the geometry migration proper is
          step 15.

  # --- PLAN: intent, from Chat, NOT established here ---------------------------
  plan:
    source: chat
    standing: >-
      NOT ESTABLISHED IN THIS REPOSITORY. Supplied from the Chat surface, where it
      lives as a document in the maintainer's hands. Nothing here measures or
      pins it. Treat it as a prior, exactly as an `inherited` entry in
      docs/inherited-measurements.yaml is treated — usable, and an assumption
      whenever it is relied on.
    amended: twice in seven iterations, and expected to be amended again
    staleness:
      last_amended_commit: 19d2723
      rule: >-
        STALE IF AN AMENDMENT HAS BEEN TAKEN SINCE `last_amended_commit` AND IS
        NOT RECORDED BELOW. This half is the one that can rot silently — it is
        not derivable from anything here, so nothing in the repository
        contradicts it when it goes wrong.
        The marker is the last commit that CHANGED THE PLAN, not the last merge.
        Merges that do not touch the plan do not make it stale, which is why this
        will not fire spuriously — and why, unlike the rule it replaces, it can
        be passed.
      checking: >-
        Two steps, because this file changes for many reasons and only some of
        them are amendments.
          (1) `git log <last_amended_commit>..main -- docs/state.yaml` lists
              commits that touched the file at all. Most will not have touched the
              plan — the commit that wrote this rule did not.
          (2) For any that did, compare `sequence.plan` between the two revisions.
              ONLY a change to a step, a stage, or `amendments` bumps
              `last_amended_commit`. A change to any other part of this file,
              including this rule itself, does not make the plan stale.
        One clause is not answerable from the repository at all: whether the
        maintainer has taken an amendment that was never recorded here. No marker
        can close that, and it is exactly what `source: chat` is warning about.
    stages:

      - stage: 0
        name: Scaffold
        steps:
          - {n: 1, title: Audit the active-stereo structure, altitude: infra, status: complete}
          - {n: 2, title: Decide how carried results are held, altitude: infra, status: complete}
          - {n: 3, title: Adapt the methodology files, altitude: infra, status: complete}
          - {n: 4, title: Generate the general research scaffold, altitude: infra, status: complete}
          - n: 5
            title: Create the template repository
            altitude: infra
            status: deferred
            deferred_until: the end of Stage 0
            note: See amendment am-001.
          - n: 6
            title: Update the research description for bio-3d-vision
            altitude: infra
            status: deferred
            deferred_until: the loop runs
            note: >-
              A description written before the loop runs describes an intention.
              Deferred until there is something to describe.
          - {n: 7, title: Create the project repository, altitude: infra, status: complete}

      - stage: 1
        name: Gradient before infrastructure
        steps:
          - n: 8
            title: Port the bioeye loop, the analytic fixture, and the four-panel figure
            altitude: infra
            status: complete
          - n: 9
            title: "First framework foreclosure: variance versus expected information gain"
            altitude: fw
            status: complete
            outcome: fc-007, extended by fc-008
          - n: 10
            title: Decide the plant
            altitude: fw
            status: complete
            outcome: fc-011
            note: See amendment am-002, and its correction am-002-c.
            correction: >-
              THIS ENTRY PREVIOUSLY READ `status: complete` WITH `outcome:
              fc-010`. Both were false, and neither was ever derivable from the
              ledger. fc-010 closes NARROWING THE DISPARITY SEARCH WINDOW in
              favour of the wide search the port already does; none of its eleven
              fields mentions the plant, and its own `scope` field says "THIS IS A
              RESULT ABOUT THE PORTED CONTROLLER, NOT ABOUT VERGENCE".
              fv-007-1, in this same file and predating the claim, had already
              recorded that its stated consequence "IS NOT INVOKED... this does
              not by itself direct step 10 toward the attentional branch. The
              measured outcome bears on the same decision and is recorded as
              od-003 rather than deciding it here."
              So the file contradicted itself, and the half that was wrong is this
              one. Corrected here to the state the ledger actually supports.

      - stage: 2
        name: Rendering
        steps:
          - n: 11
            title: Migrate the Blender rendering code
            altitude: infra
            status: complete
            outcome: >-
              A rendered stereo pair reaches the loop. 349 code lines in two
              modules split at the testability boundary; fv-011-1a and
              fv-011-1b both pass, the second against a real Blender 5.2.
              Labelled infrastructure: it moved no measurement about vision and
              closed no open decision. od-002 is untouched.
            why_it_sits_here: >-
              ITS ALTITUDE IS infra, BUT IT IS NOT INFRASTRUCTURE MIGRATED ON
              FAITH. Three foreclosures — fc-007, fc-008 and fc-010 — are each
              limited by gap-010: this fixture has no true half-occlusions, so
              every one of them holds for a stimulus without them and no further.
              od-002 names Blender as the only instrument in this repository able
              to produce a stimulus with a controlled contrast axis at occlusion
              boundaries, which is what would lift that limit.
              That is why Blender moved from step 7 to step 11: it is not being
              migrated because a plan says so, but because three standing
              foreclosures cannot be tested past their limit without it.
          - {n: 12, title: Test rendering against the loop, altitude: geom, status: next}
          - {n: 13, title: Adapt the static pipeline to Blender rendering, altitude: geom, status: planned}
          - {n: 14, title: Reproduce the static-scene result on Blender data, altitude: geom, status: planned}

      - stage: 3
        name: Geometry and results
        steps:
          - n: 15
            title: Migrate the active-stereo geometry, in ray form
            altitude: geom
            status: planned
            note: >-
              fc-009 records that its cost estimate is UNTESTED and was not
              revised. It will be tested by the first commit in which a geometry
              layer consumes a ray directly.
          - {n: 16, title: Incorporate the carried results, altitude: geom, status: planned}

      - stage: 4
        name: The loop
        steps:
          - {n: 17, title: Build and test the active loop, altitude: fw, status: planned}
          - {n: 18, title: Prototype the omnidirectional rig in Blender, altitude: fw, status: planned}

    amendments:
      - id: am-001
        moved: step 5, Create the template repository
        from: its numbered position
        to: after step 7, deferred to the end of Stage 0
        reason: >-
          A template extracted from a working instance is an OBSERVATION; one
          built first is a GUESS. The template is extracted after this repository
          works, not designed before it.
      - id: am-002
        moved: step 10, Decide the plant
        from: its numbered position
        to: after the acquisition experiment (exp003)
        reason: >-
          A foreclosure taken without evidence is a guess carrying a decision's
          authority. The plant is decided after the acquisition experiment
          (exp003) rather than ahead of it.
        reason_amended: >-
          CORRECTED IN PLACE. The second half of this reason previously read "The
          plant was decided on measurement — fc-010 — rather than ahead of it, and
          od-003 records precisely what evidence would reopen it." THE REORDERING
          THIS AMENDMENT RECORDS IS REAL AND STANDS; the claim appended to it was
          not.
          fc-010 is about the disparity search window, not the plant. Deciding the
          plant on it would be exactly the substitution this amendment's own first
          sentence warns against — a decision drawing authority from a measurement
          that does not bear on it. od-003 is real and does record what would
          reopen the vergence question, but it is a retest condition for one
          estimator, not the evidence that a plant question was settled.
          What actually happened is recorded as am-002-c below.
      - id: am-002-c
        corrects: am-002
        what_was_inserted: >-
          `sequence.plan` step 10 was marked complete with outcome fc-010, and
          `sequence.position` listed 10 in `complete` with a matching `evidence`
          line, in 19d2723.
        who_and_how: >-
          NOT THE PLAN RUNNING AHEAD OF THE LEDGER — AN UNEARNED CLAIM INSERTED
          INTO THE PLAN. It was a Chat-surface decision supplied to the session
          that wrote the sequence block as though it were already established, and
          it was written into the `position` half, which is the half whose whole
          standing is that everything in it is DERIVABLE. Nothing in the ledger
          ever derived it.
          The distinction matters because the two failures have different fixes. A
          plan running ahead of the ledger is corrected by waiting; a claim
          inserted into the derivable half is corrected by deleting it and by
          asking why the derivation check passed. Both are done here — see
          `position.checking_amended`.
        why_it_is_recorded: >-
          `plan` is already labelled `source: chat` and `standing: NOT ESTABLISHED
          IN THIS REPOSITORY`, and that label did its job for the plan half. It
          did not protect the `position` half, which carries the opposite label.
          A claim that crosses from the first into the second loses its warning
          without losing its origin, and nothing in the file marked the crossing.

# ------------------------------------------------------------------------------
# WHAT RUNS
# ------------------------------------------------------------------------------
runs:
  summary: >-
    The ported baseline runs. It is the predecessor's loop, verified bit-identical
    to it, on the predecessor's analytic fixture, producing the predecessor's
    four-panel figure. No new science: this is a measured starting point, not a
    result.
  entry_points:
    - call: bio3dvision.run_baseline(steps=18, seed=0)
      does: >-
        Draws the analytic fixture, runs the block matcher once, then N fixations
        of the active loop, and returns the engine, history and panel arrays.
      cost: ~0.08 s for 18 steps
    - call: bio3dvision.save_result_fig(engine, depth_gt, history, out=None)
      does: Renders the four panels to results/fig_result.png and returns their data.
  library:
    package: bio3dvision
    modules: [fixture, matching, loop, figure, baseline, policy, sampling, acquisition,
              blender_render, blender_load]
    lines: 2098
    policies: [A, A_prime, B, C, D, E]
    sampling: >-
      SamplingModel Protocol with PinholeSampling; sits in front of ActiveStereo,
      not inside it. Uniform configuration is the identity (fc-009).
    public_api: [ActiveStereo, BaselineRun, CameraParams, PanelArrays, cost_volume,
                 decode_disparity, error_summary, front_end_block, lr_consistency,
                 make_synthetic_scene, panel_arrays, run_baseline, save_result_fig,
                 scale_to_depth, true_disparity]
    note: Still flat. Zero subpackages. See fc-002 and falsifier fv-003-2.
  test_suite:
    exists: true
    count: 78
    count_note: >-
      70 run everywhere; 8 need the optional `blender` extra and skip without it.
      CI installs the extra so those 8 run there — falsifier 1a is the only check
      of the render path that needs no Blender binary, and skipping it in CI would
      have left the path unverified in the one place it is always checked. Two
      further tests need a Blender BINARY (falsifier 1b) and skip on the runner,
      with a reason naming what is unverified.
    count_corrected: >-
      Read 27 until this commit, and had been wrong for some time — 27 is neither
      the collected node count (69) nor the number of test functions (60). The
      difference between those two is parametrisation, not missing tests.
      Measured rather than counted by hand: `pytest --collect-only -q`. A stale
      number in the file that describes what runs is a small defect with a large
      shape — this is the channel a cold session trusts without checking.
    test_functions: 60
    environment_last_run: {python: 3.13.15, numpy: 2.5.2, scipy: 1.18.1, matplotlib: 3.11.1}
    what_it_covers: >-
      The scaffold guards; the fixture's determinism and its lack of true
      half-occlusions (gap-010); the ported trajectory, the lockup and its
      per-pixel mechanism; the control/measurement boundary; and the four-panel
      figure's reproducibility under a fixed seed.
  loop:
    exists: true
    status: ported, faithful, with three known defects carried deliberately
    defects_carried:
      - "1e3 variance sentinel instead of nan - a convention this repository rejects"
      - "gaussian_filter over np.where(valid, var, 0.0) in the gaze policy - mixing before masking"
      - "no inhibition of return - the loop locks onto one pixel for its last 10 of 18 steps (bio-002)"
    note: >-
      Deviations are later commits, one at a time, each reporting its effect on the
      trajectory. They are decisions, not cleanups. Nothing here is step 9.
  experiments:
    - id: exp001_gaze_objective
      question: Does the gaze objective matter, once revisiting is controlled for?
      answer: No, on this fixture. See foreclosure fc-007.
      pre_registered: 19aee2a, committed alone before any arm was run
      amended: >-
        By exp002, by addition: its C_vs_B verdict flips with 16 seeds (bio-018),
        and its scope is narrower than it read — a null about the choice among
        variance-derived objectives, not about saliency.
    - id: exp002_saliency_value
      question: >-
        Does posterior variance carry information beyond the validity mask?
      answer: >-
        Yes, but barely. Mask-only coverage is distinguishably worse than
        variance-driven allocation, so variance is not empty (fc-008) — but the
        mask is worth 65x more than the variance on median error. See fc-008.
      pre_registered: 9179a55, committed alone before the runner existed
    - id: exp003_vergence_acquisition
      question: >-
        Does acquisition — an action that changes what data exists — buy
        anything, and does the gain require acting or merely narrowing?
      answer: >-
        It costs. Narrowing the search window makes the shared pixels 7.5x worse
        whether or not the loop re-centres it, and re-centring costs 2.6x the
        hypotheses to buy 21.7% more coverage of pixels whose error is 16x the
        baseline's. See fc-010, and od-003 for what the failure is attributable to.
      pre_registered: 4456337, committed alone before the runner existed
      first_closed_loop: >-
        Arm V re-runs the front end every fixation — the first arm in either
        repository in which an action changes what data exists.
  not_present:
    - >-
      Geometry. There is a sampling model producing rays (fc-009) but nothing
      that CONSUMES one: no oculomotor state, no rotations, no projection. The
      rays are produced and immediately turned back into indices, because
      ActiveStereo still takes a pixel.
    - >-
      Any rendered STIMULUS, though no longer any rendered pair. Step 11 built the
      path — bio3dvision.blender_render writes a rectified pair with a depth pass,
      and load_render returns the same four-tuple make_synthetic_scene does, so
      the loop consumes either without knowing which. What does not exist is a
      rendered scene anyone has ASKED A QUESTION OF. The only scenes this
      repository can build are ground-truth apparatus: tiled fronto-parallel
      planes and a flat wall, both emission-shaded, neither a stimulus. Blender
      still has no experiment attached (od-002), and the two limits that matter —
      gap-010's missing half-occlusions and gap-001's contrast axis — are exactly
      as open as before.
    - Any measurement of anything this repository has not inherited.

# ------------------------------------------------------------------------------
# LAST MEASURED NUMBERS
# Measurements made BY THIS REPOSITORY, each with the commit that produced it.
# Inherited priors are not measurements and do not belong here.
# ------------------------------------------------------------------------------
measurements:
  - ids: [bio-001, bio-002, bio-003, bio-004, bio-005, bio-006, bio-007, bio-008, bio-009]
    commit: ae11496
    what: >-
      The ported baseline's trajectory, its lockup and the per-pixel mechanism
      behind it, the error distribution, the error/uncertainty rank correlation,
      and the bit-identity of the port against visgraf/bioeye@e908170.
    where: docs/inherited-measurements.yaml, status "measured"
    headline: >-
      18 fixations, 9 of them distinct; the loop then spends its last 10 steps on
      pixel (170, 94). RMSE 0.4793 m, flat from step 5 onward. The worst 5% of
      pixels carry 80.9% of the squared error.
    caveat: >-
      These measure the PREDECESSOR'S loop, exactly — the port is bit-identical to
      it. They are this repository's measurements of inherited behaviour, and a
      baseline for deviations, not a result about anything new.

  - ids: [bio-010, bio-011, bio-012, bio-013]
    commit: ed0683a
    what: >-
      exp001's four gaze-policy arms over 8 seeds: final-step primary metrics,
      the A-vs-C and B-vs-C argmax agreement rates, and the candidate-stride
      ladder.
    where: docs/inherited-measurements.yaml, status "measured"
    headline: >-
      A' and C are indistinguishable on both primary metrics, while both beat the
      ported baseline. A and C never select the same fixation (0 of 144), and
      neither do B and C. Which pixel is fixated barely matters on this fixture;
      not repeating does.
    caveat: >-
      One fixture with no true half-occlusions (gap-010), one budget, one matcher.

  - ids: [bio-014, bio-015, bio-016, bio-017, bio-018]
    commit: c0b54a4
    what: >-
      exp002's six arms over 16 seeds at 40 fixations; the value of the validity
      mask and of posterior variance beyond it, separately quantified; their
      ratio; and the re-evaluation of exp001's C_vs_B with 16 seeds.
    where: docs/inherited-measurements.yaml, status "measured"
    headline: >-
      Posterior variance does carry information beyond the validity mask, but the
      mask is worth 65x more on median error (3.5x on p90). A policy knowing only
      where the data is recovers 97.3% of the median-error benefit of the full
      variance-driven policy.
    caveat: >-
      One fixture with no true half-occlusions (gap-010) — the limit that binds
      the 65:1 ratio hardest.

  - ids: [bio-019, bio-020, bio-021, bio-022]
    commit: b77b24e
    what: >-
      exp003's three search-window arms over 16 seeds: intersection error,
      coverage and its error cost, hypothesis and front-end cost, and the
      diagnosis of why the ported vergence controller cannot steer.
    where: docs/inherited-measurements.yaml, status "measured"
    headline: >-
      Narrowing the search window makes the shared pixels 7.5x worse whether or
      not the loop re-centres it. Re-centring costs 2.6x the hypotheses and 19
      front-end calls to buy 21.7% more coverage of pixels whose error is 16x the
      baseline's. Acting beats not-acting only in the tail.
    caveat: >-
      One fixture with no true half-occlusions (gap-010), one window width, and a
      failure localised to the ported vergence estimator rather than to vergence
      (od-003).

  - ids: [bio-023]
    commit: f58aa7d
    what: >-
      The full suite, re-run in a freshly built environment on Python 3.13.15 —
      an interpreter from the CI matrix, which nothing here had ever run on.
    where: docs/inherited-measurements.yaml, status "measured"
    headline: >-
      69 of 69 pass, and so do ruff, ruff format --check and mypy. bio-001
      through bio-008 are re-derived, because each is pinned by an assertion in
      tests/test_loop_port.py.
    caveat: >-
      NARROWER THAN "REPRODUCED IN A FRESH ENVIRONMENT" SOUNDS. The numeric
      libraries are identical to the original run — only the interpreter changed,
      3.14.6 -> 3.13.15 — so this crosses interpreters, not library versions, and
      fv-003-1 remains the wider claim. bio-009 is not covered (no test pins it)
      and neither is bio-010..bio-022 (experiments/ is not run by pytest). The
      port's baseline is re-verified; no experimental result is.
    why_it_was_run: >-
      Not planned. The environment the first seven iterations used was gone and
      had to be rebuilt; rebuilding it on a CI-tested interpreter instead of the
      untested 3.14 made the rebuild a measurement. Free, and not repeatable —
      the numbers can only be checked against a genuinely unfamiliar environment
      once.

  - ids: [bio-024, bio-025, bio-026]
    commit: f58aa7d
    what: >-
      The Blender path, at step 11: the EXR reader's silent-failure mode in the
      library that was not chosen, the loaded depth of a live Blender 5.2 render
      against analytic truth, and the depth channel's name across the two Blender
      versions this repository reads.
    where: docs/inherited-measurements.yaml, status "measured"
    headline: >-
      Rendered depth matches the analytic plane distances EXACTLY over 64320
      pixels on three planes, so the pass is planar and in metres with no scale
      error. The depth channel is named 'Z' in NEITHER file — R/G/B in bioeye's
      Blender 4 artifact, 'V' in a Blender 5.2 render — so the carried
      channel-naming tolerance is load-bearing rather than defensive. imageio
      with no EXR backend returns a (2, 13379, 1) array for a (240, 320) depth
      map and does not raise.
    caveat: >-
      bio-025 is apparatus, not a stimulus: fronto-parallel emission-shaded
      planes with no occlusion, curvature or texture. It establishes that the
      depth path is correct and nothing about what a render is worth as a
      stimulus. THE RENDERER ITSELF REMAINS UNTESTED — gap-009 is narrowed to the
      191 code lines that execute inside Blender, not closed.

measurements_note: >-
  No longer empty. Values enter this list only when a run in THIS repository
  produced them, with the commit that did. Inherited priors stay in
  docs/inherited-measurements.yaml with status "inherited" and are never promoted
  here without a re-measurement.

# ------------------------------------------------------------------------------
# OPEN DECISIONS
#
# altitude — how far the decision reaches, and therefore how expensive it is to
# get wrong:
#   fw     framework. Changes the shape of the thing: interfaces between layers,
#          what a type means, what the project is committed to. Expensive to
#          reverse; reversing it invalidates work built on top.
#   exp    experiment design. What gets measured, against what falsifier.
#   impl   implementation. Local, reversible, no interface moves.
#   infra  tooling, CI, layout. Reversible, affects no result.
# ------------------------------------------------------------------------------
open_decisions:

  - id: od-002
    altitude: fw
    status: open
    title: Closing gap-001 needs a stimulus with a controlled contrast axis at half-occlusion boundaries.
    decision: >-
      Not taken. Recorded, not scheduled. Nothing about this is work to start now.
    problem: >-
      gap-001 asks whether the occluded/matched variance anti-calibration is a property
      of real imagery or of high contrast. Answering it requires a stimulus in which
      contrast at half-occlusion boundaries can be VARIED while the occlusion geometry
      is held fixed. Nothing in either predecessor can produce one, and neither can the
      fixture ported in this repository (gap-010 — it has no true half-occlusions).
    why_blender: >-
      Blender is the only instrument in this repository capable of it: it can hold
      geometry bit-identical across conditions while changing surface appearance, which
      is exactly what the predecessor's exp003 did on a coplanar material chart. That
      experiment varied albedo texture on COPLANAR patches, so it had no occlusion
      geometry to speak of; the question here needs a depth step with controlled
      contrast across it.
    why_it_is_fw: >-
      It decides what the one rendered source is FOR. Blender is committed to as the
      single rendered source (fc-003) and currently has no experiment attached to it at
      all — the commitment has been made and never exercised. Attaching the first
      experiment to it sets the precedent for what renders are used to answer.
    why_not_scheduled: >-
      The repository does not run yet, and od-001 has not been implemented. Recording it
      here is the point: gap-001 otherwise names a question with no identified
      instrument, which reads as unanswerable rather than as unscheduled.
    depends_on: [gap-001, gap-010, fc-003]

  - id: od-003
    altitude: fw
    status: open
    title: >-
      Whether vergence acquisition deserves a retest with a controller that has a
      signed out-of-range error signal.
    decision: Not taken. Recorded, not scheduled.
    problem: >-
      exp003 measured that verging to acquire is worse than not verging, on every
      axis except coverage (fc-010). But the diagnosis localises the failure to
      the ESTIMATOR, not to the idea: ActiveStereo.vergence takes the median of
      in-window valid matches, so a target outside the window is either masked
      out or returns an arbitrary in-window value. It cannot produce a signed
      error, and it was observed verging away from the target.
      A controller driven by disparities outside the fusional range — which is
      what biological vergence is driven by — would be a different measurement.
      Nothing here says it would succeed.
    why_it_is_fw: >-
      It decides whether the mechanical plant gets a second hearing. fc-010 as it
      stands is evidence against the plant; whether that evidence is about the
      plant or about one estimator of it is exactly what this decides.
    why_not_scheduled: >-
      It would require replacing ActiveStereo.vergence, which is a carried part of
      the faithful port. That is a deviation commit, made one at a time with its
      effect on the trajectory reported, and it is not this iteration.
    depends_on: [fc-010, gap-010]

# ------------------------------------------------------------------------------
# FORECLOSURE LEDGER
#
# Options this repository has closed, and what reopening one would cost. Recorded
# so that a later session can tell "we decided against this" from "nobody thought
# of it" — the two look identical in a codebase and are not the same thing.
# ------------------------------------------------------------------------------
foreclosures:

  - id: fc-001
    closed: Carrying the predecessors' implementations.
    in_favour_of: >-
      Carrying tests, method notes, pinned ADRs, and measurements-with-provenance.
      Implementations are rewritten against carried tests.
    rationale: >-
      "Carry only what can fail." Applied in docs/migration-inventory.md over 114
      classified items from both references.
    cost_to_reopen: Low for any single module; the references are public and pinned.
    decided_in: docs/migration-inventory.md

  - id: fc-002
    closed: A directory per framework layer.
    in_favour_of: A flat package, with structure added when something needs it.
    rationale: >-
      Measured in the reference at 3f7a263: geometry 830, encoding 374, inference
      456, scaling 95, control 151, policy 200, scenes 2069 lines, library total
      4913. Stimulus infrastructure is 2069/4913 = 42.1%. The three layers that
      make it "active Bayesian" rather than a stereo matcher — scaling (metric
      scaling and MLE fusion), control (the vergence loop), policy (gaze) — are
      446/4913 = 9.1% between them. A directory per layer is an invitation to
      fill it, and the invitation was accepted unevenly.
    cost_to_reopen: Low. Splitting a flat package later is mechanical.

  - id: fc-003
    closed: More than one rendered stimulus source.
    in_favour_of: Blender, alone.
    rationale: >-
      One renderer to verify, one set of conventions to state. The reference
      records that nothing inside Blender can be covered by its test suite
      (gap-009), and that cost is worth paying once, not twice.
    cost_to_reopen: Medium. Needs an ADR, written after trying it.

  - id: fc-004
    closed: Growing the analytic fixture into a stimulus corpus.
    in_favour_of: >-
      One analytic fixture — closed-form, milliseconds, no monocular depth cues —
      that exists so tests are fast and exact.
    rationale: >-
      It is a test fixture. A finding that rests on it has misused it. This is
      the specific mechanism behind fc-002's 42%: stimulus infrastructure grows
      because each addition is individually reasonable.
    cost_to_reopen: >-
      Low mechanically, high in judgement — reopening it is how the predecessor
      got where it did, so it needs an ADR and a reason that is not "we needed
      one more case".

  - id: fc-005
    closed: A definition of done made only of artifact-quality clauses.
    in_favour_of: A definition of done whose first clause is a progress term.
    rationale: >-
      The predecessor's five clauses were all about artifact quality — tests
      pass, new behaviour has a test, docstrings state units and frames, the ADR
      is written, the diff is clean (CLAUDE.md:113-117 at 3f7a263). Every one can
      be satisfied by a perfect component added to a loop that has never run,
      which is what happened.
    cost_to_reopen: None mechanically. It is a rule, and rules are reopened by argument.

  - id: fc-006
    closed: CLAUDE.md as the authority on units and frames.
    in_favour_of: >-
      Frames declared at the function that returns the value; CLAUDE.md governs
      process only.
    rationale: >-
      The predecessor's §3 declared depth "metres, cyclopean frame" and
      geometry/oculomotor.py:337-348 records that this is false — the value is z
      in the rectified left-camera frame, and the two agree only at zero
      elevation. A sentence in a governance file has nothing to fail against.
    cost_to_reopen: None mechanically; the reason not to is recorded above.

  - id: fc-007
    altitude: fw
    closed: >-
      Reframing the gaze objective from posterior variance to expected information
      gain.
    in_favour_of: >-
      argmax of posterior variance plus inhibition of return at the predecessor's
      20.0 px radius.
    rationale: >-
      Measured, pre-registered, and against the hypothesis that motivated the
      experiment. exp001 ran four arms over 8 seeds: the principled objective
      (argmax of the field integral of expected variance reduction) and the cheap
      remedy (argmax variance + inhibition of return) are INDISTINGUISHABLE on
      both declared primary metrics, at a threshold declared before any arm ran.
      Both beat the ported baseline; neither beats the other. The two objectives
      never once selected the same fixation (0 of 144 comparisons at matched
      state), so this is not "the objectives agree" — it is that the choice does
      not change the outcome, while the ~1e4x cost difference is real.
    first_fw_foreclosure: true
    cost_to_reopen: >-
      An experiment on a stimulus with true half-occlusions. This one cannot
      settle the question there — see the limit below — so reopening is not
      merely allowed, it is anticipated.
    limit_on_this_foreclosure: >-
      gap-010: the fixture has no true half-occlusions. Its right image is
      resampled from its left, so the (170, 94) failure driving the lockup is a
      MATCHING failure in a fully visible region, not an occlusion. The two
      structurally different sources of high posterior variance that motivated the
      experiment are therefore represented by only one of their two mechanisms.
      THIS FORECLOSES THE QUESTION FOR A STIMULUS WITHOUT OCCLUSIONS AND NO
      FURTHER. Everything measured is consistent with the objective mattering a
      great deal on a stimulus with real occlusions.
    what_would_lift_it: >-
      A rendered stimulus with a controlled contrast axis at half-occlusion
      boundaries — gap-001, and od-002 which names Blender as the only instrument
      in this repository able to produce one. NOT by growing the fixture: that is
      fc-004, and reopening it needs an ADR and a better reason than needing one
      more case.
    does_not_close: >-
      od-001, despite a natural-looking association. od-001 decides whether the
      L6-to-L1 interface passes a DIRECTION or a PIXEL — a question about the type
      of the boundary. exp001 varied the OBJECTIVE behind the choice, and every
      arm passed a pixel to step(fixation=...). Nothing here measured the
      interface type, so closing od-001 on this evidence would be unsupported.
      od-001 stays open.
    scope_annotation_added_by_exp002: >-
      NARROWER THAN IT LOOKS. Every arm exp001 compared was informed by posterior
      variance, so this foreclosure is a null about the CHOICE AMONG
      VARIANCE-DERIVED OBJECTIVES, not about saliency. exp002 ran the uninformed
      arms and found that variance DOES carry information beyond the validity
      mask: mask-only coverage (E) is distinguishably worse than argmax-variance
      plus inhibition of return (A') on both primary metrics, at 40 and again at
      45 fixations. See fc-008 and bio-016. The original verdict stands; only its
      scope is clarified.
      exp002 produced an A'-vs-C row at 40 fixations with 16 seeds that is
      DISTINGUISHABLE on median at 1.05x bar, favouring A'. It points the same way
      this foreclosure already went, but it is POST-HOC — exp002's
      pre-registration declares only the C_vs_B re-check — and it is not the same
      measurement as exp001's, which was step 18 with 8 seeds. It is also split at
      the noise floor: median 1.05x favouring A', p90 0.26x favouring C, rmse
      0.03x. It is recorded as a flag, not as evidence, and this foreclosure does
      NOT rest on it. See the post_hoc_annotation in
      experiments/exp002_saliency_value/verdicts.json.
    outstanding_test: >-
      A PRE-REGISTERED A'-versus-C comparison at the 40-45 fixation budget. exp001
      settled the pair at 18 fixations with 8 seeds; nothing has settled it at the
      longer budget, and the only figure that exists there is the post-hoc row
      above. NOT SCHEDULED, and recorded here so the absence is visible rather
      than inferred from a row that was never declared.
    decided_in: experiments/exp001_gaze_objective/findings.md

  - id: fc-008
    altitude: fw
    closed: >-
      Replacing variance-driven gaze allocation with uninformed or mask-only
      coverage.
    in_favour_of: >-
      Keeping a posterior-variance-driven policy — argmax v plus inhibition of
      return, unchanged from fc-007.
    rationale: >-
      Measured and pre-registered, and it closes the gap fc-007 left open. All
      four exp001 arms read posterior variance, so fc-007 could not say whether
      variance mattered at all. exp002 ran two deliberately impoverished arms: D
      (blind raster, no information) and E (masked coverage, the validity mask
      only), at a pitch derived from the inhibition radius so that spacing is not
      confounded with policy type.
      E is DISTINGUISHABLY WORSE than A' on both primary metrics — median +0.00028
      at 1.38x the bar, p90 +0.04957 at 1.96x — and worse than C on p90. So the
      strong outcome, that the allocation half of the framework's claim is empty
      here, does NOT hold. Posterior variance carries information beyond the mask.
      The verdict survives the check that nearly overturned it: A' and C had
      converged by step 40 while D and E had not, making the gap plausibly an
      approach-rate artefact. Re-run to 45 fixations (E's lattice limit,
      post-hoc), E has stopped improving — median moved 1e-5 and p90 got worse —
      and the gap persists at 1.17x and 1.55x the bar.
    but_the_effect_is_small: >-
      THE SIZE MATTERS AS MUCH AS THE SIGN, and this foreclosure should not be
      cited without it. The validity mask is worth 0.01854 m of median error
      (63.7% of D's), and posterior variance on top of it is worth 0.00028 m
      (2.7% of E's) — a ratio of 65 : 1. On p90 the ratio narrows to 3.5 : 1.
      A policy that knows only WHERE THE DATA IS recovers 97.3% of the
      median-error benefit and 88.4% of the p90 benefit of the full
      variance-driven policy. Variance is a real but small correction on a much
      larger effect that is purely about coverage. See bio-015, bio-016, bio-017.
    limit_on_this_foreclosure: >-
      THIS FIXTURE HAS NO TRUE HALF-OCCLUSIONS (gap-010). Its right image is
      resampled from its left, so high posterior variance here never marks a
      region that is geometrically UNMEASURABLE — only one that is hard to match.
      The two structurally different sources of high variance that motivate an
      active policy are therefore represented by one of them.
      So this holds FOR A STIMULUS WITHOUT HALF-OCCLUSIONS AND NO FURTHER. The
      claim most exposed is the 65:1 ratio: on a stimulus with real occlusions the
      variance channel would carry a signal about geometric unmeasurability that
      it cannot carry here, and the ratio could move a long way.
    what_would_lift_it: >-
      A rendered stimulus with a controlled contrast axis at half-occlusion
      boundaries — gap-001, and od-002 which names Blender as the only instrument
      here able to produce one. NOT by growing the fixture: that is fc-004.
    cost_to_reopen: An experiment on a stimulus with true half-occlusions.
    decided_in: experiments/exp002_saliency_value/findings.md

  - id: fc-009
    altitude: fw
    closed: >-
      Passing a pixel index across the boundary from the active-sampling layer
      into geometry. Was od-001, taken by the maintainer and now implemented.
    in_favour_of: >-
      A unit ray in a stated frame, produced by a sampling model that sits in
      front of ActiveStereo rather than inside it.
    implemented_as: >-
      src/bio3dvision/sampling.py — a SamplingModel Protocol (direction, index,
      contains, shape, frame) with PinholeSampling as the only implementation,
      plus route_through_sampling, the adapter that turns a policy's choice into
      a direction and back again. Note the "and back again": it returns a PIXEL,
      because ActiveStereo consumes one. A ray is constructed on every step and
      no ray leaves the adapter, which is why falsifier 2 is deferred rather than
      answered.
    frame_declaration: >-
      Directions are unit vectors in the RECTIFIED LEFT-CAMERA frame: +x right
      along increasing column, +y down along increasing row, +z forward along the
      optical axis, right-handed. Stated at every public function that returns
      one, not at governance level — fc-006 records why, and the repetition
      across docstrings is deliberate.
    component_cost_measured: >-
      A RESULT ABOUT THE COMPONENT, NOT ABOUT THE INTERFACE. Constructing the
      sampling model cost ZERO lines of change to six existing modules — loop.py
      byte-identical to main by SHA-256, and matching.py, fixture.py, figure.py,
      baseline.py and policy.py untouched — with the only edit to pre-existing
      code being 10 added lines of exports in __init__.py, nothing removed. The
      work itself is 257 lines of new module and 212 lines of new test. The
      pinhole round trip is exact over all 76800 indices with a pre-rounding
      error of 2.8e-14 against the 0.5 that would flip one, 13 orders of margin.
      That is real and it is what this commit measured. It is NOT a measurement
      of what passing a ray costs.
    falsifier_2_outcome: >-
      DEFERRED. Not additive, not invasive — UNANSWERED, and the earlier verdict
      of ADDITIVE was an overstatement of what was measured.
      Why the evidence does not bear on the question: route_through_sampling
      converts index -> ray -> index and hands ActiveStereo a PIXEL. No ray
      crosses the boundary in this commit. The empty diff to loop.py therefore
      follows from the round trip being the identity — ActiveStereo receives a
      value bit-identical to the one it received before, so of course it did not
      have to change — and not from the ray commitment being cheap. The test that
      would discriminate has not been run, because nothing yet consumes a ray.
      Falsifier 2 asked whether PASSING A RAY is invasive. That remains open.
    step_15_estimate: >-
      NOT REVISED, in either direction. It is untested. It will be tested by the
      first commit in which a geometry layer consumes a ray directly — that is,
      the first commit in which model.index drops out of the policy path and
      route_through_sampling's second hop disappears. Until then there is no
      measurement of the interface cost to revise an estimate against, and this
      foreclosure supplies none.
    amendment: >-
      Corrected after first writing, in place, because the original was an
      overstatement rather than a verdict that later data reversed — the two are
      different and are handled differently here. cost_measured claimed to be
      "the number step 15's estimate should be revised against" and
      falsifier_2_outcome read ADDITIVE, NOT INVASIVE with the migration
      inventory's reading SUPPORTED. Neither was measured. The component cost is
      kept under its own name above; the interface verdict is now deferred; and
      step 15's estimate is explicitly not revised. fv-006-2 carried the same
      overstatement and is corrected in the same commit.
    reproduction: >-
      Uniform sampling on the existing pinhole grid is exactly the identity:
      index -> ray -> index is bit-exact over all 76 800 indices, with a
      pre-rounding float error of 2.8e-14 against the 0.5 that would flip an
      index — 13 orders of margin. All six arms reproduce main bit-for-bit on
      fixture arrays, d_sub, var_d, valid, scanpath, posterior mean and variance,
      and all four figure panels, by np.array_equal rather than allclose.
    what_it_does_not_do: >-
      No foveated lattice, no spherical projection, no plant question. The
      interface admits the first two without a signature change — direction is an
      arbitrary index-to-unit-vector map, index returns the nearest sample, and
      contains exists because membership stops being a bounds check on a
      non-uniform lattice — but no speculative parameter was added for either.
      They are decisions before they are code.
    one_declaration_not_a_measurement: >-
      PinholeSampling's principal point defaults to the geometric centre
      ((H-1)/2, (W-1)/2). CameraParams carries no principal point because the
      ported loop never projects a 3-D point, so nothing measured in this
      repository constrains it, and nothing currently reads the absolute
      orientation of the returned rays — only that the round trip is the
      identity, which holds for any principal point. Recorded so that a later
      component which does depend on absolute orientation knows this value was
      chosen here rather than measured.
    infrastructure: >-
      Labelled infrastructure under CLAUDE.md's definition of done, clause 1. It
      moved no measurement and closed no scientific question; it closed an open
      decision, which is the clause's second admissible outcome.
    cost_to_reopen: >-
      Low. The pixel path is not deleted — ActiveStereo still consumes an index,
      and route_through_sampling's second hop exists only because of that. When a
      geometry layer arrives the ray goes straight into it and model.index drops
      out of the path.
    decided_in: docs/state.yaml od-001; implemented on branch feat/sampling-model

  - id: fc-010
    altitude: fw
    closed: >-
      Narrowing the disparity search window as a strategy on this fixture,
      whether fixed (N) or re-centred by verging at every fixation (V).
    in_favour_of: The wide search the port already does.
    rationale: >-
      Measured and pre-registered, under a coverage rule these arms needed and
      the earlier experiments did not. On the intersection of the three arms'
      valid sets — the same 37383 pixels measured three ways — the wide baseline
      reads median 0.01476 m and both narrow arms read ~0.111 m, about 7.5x
      worse, at 2.01x and 11.30x the declared bar. Narrowing does not improve
      quality on this stimulus; it destroys it.
      V additionally costs 147 disparity hypotheses against W's 57 (2.6x) and 19
      front-end invocations against 1.
    what_v_did_buy: >-
      Coverage, and bad coverage. V's union valid set is 64731 against W's 53168,
      +11563 pixels or +21.7% — but the median error on the pixels only V reaches
      is 0.235 m, 16x the wide baseline's error on the shared pixels. N does not
      even buy that: narrowing without re-centring LOSES 6175 pixels, because
      matches whose true disparity falls outside a fixed window fail the ratio
      and consistency tests faster than the receding border constraint adds
      columns.
    mechanism: >-
      THE VERGENCE CONTROLLER HAS NO ERROR SIGNAL, and this is the finding under
      all the numbers. ActiveStereo.vergence estimates fixation disparity as the
      median of d_sub over VALID pixels in a foveal window. A pixel whose true
      disparity lies outside the window usually fails validity and is excluded
      from that median — measured at window [8,12] with the near card at 18.96
      px, only 41.8% survive and their median d_sub reads 10.32. The survivors
      return an arbitrary in-window disparity rather than a signed "too near /
      too far": at seed 0 fixations 5-7 the fixation sat on true disparities of
      15.17 and 18.96 while d_sub read 8.00 and 6.00, the LOWER edge, and the
      controller verged AWAY from the target, 10.0 -> 7.9 -> 5.95.
      The pixels carrying the vergence error signal are exactly the pixels the
      validity mask removes. A real vergence system is driven by disparities
      outside the fusional range; this one is driven by the median of what it can
      already fuse, which is a fixed point by construction.
    scope: >-
      THIS IS A RESULT ABOUT THE PORTED CONTROLLER, NOT ABOUT VERGENCE. A
      vergence estimator with a signed out-of-range error signal — coarse-to-fine,
      or disparity energy — is untested and is not what was measured. Recorded as
      od-003.
    limit_on_this_foreclosure: >-
      gap-010: no true half-occlusions on this fixture, so nothing here speaks to
      a region that is geometrically unmeasurable rather than merely out of
      window. Holds for a stimulus without half-occlusions and no further. One
      window width was run, declared in advance and not swept.
    cost_to_reopen: >-
      A retest with a controller that has a signed out-of-range error signal
      (od-003), or a stimulus with half-occlusions (od-002).
    decided_in: experiments/exp003_vergence_acquisition/findings.md

  - id: fc-011
    altitude: fw
    closed: >-
      Modelling L5 as a mechanical plant — an actuator layer whose job is to move
      the eyes — as the branch this project develops next.
    in_favour_of: >-
      L5 models ATTENTIONAL ALLOCATION: where the system spends its limited
      measurement budget, not how an eyeball is driven there.
    decided_by: >-
      The maintainer, on the evidence of fc-008 and fc-010. NOT DERIVED FROM A
      MEASUREMENT IN THIS REPOSITORY, and recorded that way deliberately: it is a
      judgement about which of two branches to develop, taken on an asymmetry
      between two states of knowledge (below), not a result that a run produced.
    the_asymmetry_that_decided_it: >-
      THIS IS THE WHOLE ARGUMENT, and it is about states of knowledge rather than
      about outcomes.
      ALLOCATION IS MEASURED, AND IT WORKS WEAKLY. exp002 ran the deliberately
      impoverished arms and found posterior variance does carry information beyond
      the validity mask (fc-008) — distinguishably, on both primary metrics, and
      small: the mask is worth 65x more than the variance on median error, and a
      policy knowing only where the data is recovers 97.3% of the median benefit.
      That is a weak positive. It is still a positive, and it is repeatable.
      ACQUISITION IS MEASURED ONCE, WITH A CONTROLLER THAT CANNOT STEER. exp003
      measured verging-to-acquire as worse than not verging on every axis except
      coverage (fc-010) — but fc-010's own `mechanism` field localises the failure
      to the estimator, not to the act.
      A weak measured positive and a single measurement made with a broken
      instrument are different states of knowledge, and this decision reflects the
      difference. It develops the branch that has evidence, and it does not
      convert the absence of a working instrument into evidence against the branch
      that lacked one.
    the_plant_is_untested_not_refuted: >-
      READ THIS BEFORE CITING fc-010 AGAINST A PLANT. fc-010 is evidence about ONE
      VERGENCE ESTIMATOR, and that estimator PROVABLY cannot produce the signal a
      plant would need.
      The proof is structural, not statistical, and it is in fc-010's `mechanism`:
      ActiveStereo.vergence estimates fixation disparity as the median of d_sub
      over VALID pixels in a foveal window. A pixel whose true disparity lies
      outside the window generally fails validity and is excluded from that
      median, so the estimate is confined to the window's interior BY
      CONSTRUCTION. It can report a value; it cannot report "too near" or "too
      far". The measured instance: at window [8,12] with the near card at 18.96 px
      only 41.8% of pixels survive and their median d_sub reads 10.32, and at seed
      0 fixations 5-7 the controller verged AWAY from the target, 10.0 -> 7.9 ->
      5.95.
      An actuator commanded by a signal that cannot carry a sign is not a test of
      actuation. So fc-010 is not evidence about mechanical actuation as such, and
      this foreclosure does not treat it as any.
      WHY THIS IS SPELLED OUT RATHER THAN ASSUMED: writing fc-010 into the ledger
      as evidence against plants would repeat the exact overstatement fc-009's
      amendment already had to correct once — a measurement recorded as bearing on
      a question it does not bear on. It was corrected there in place; it is
      pre-empted here.
    retest_condition: >-
      od-003, which is pointed at rather than restated. It records what evidence
      would reopen the vergence question and what it would cost, and duplicating
      its terms here would create a second copy to keep in step with it.
    agrees_with: >-
      fv-007-1, which recorded at b77b24e that exp003's falsifier did not fire on
      its stated condition and that "THE STATED CONSEQUENCE IS NOT INVOKED... this
      does not by itself direct step 10 toward the attentional branch. The
      measured outcome bears on the same decision and is recorded as od-003 rather
      than deciding it here."
      This foreclosure is the decision fv-007-1 declined to take on that evidence,
      taken now by the maintainer, on a stated asymmetry, and NOT on the falsifier
      firing. The two entries agree: the falsifier did not license this, and this
      does not claim it did. fv-007-1 carries a reciprocal pointer back to here.
    forecloses_nothing_downstream: >-
      AN ATTENTIONAL L5 MUST NOT MAKE A PLANT UNREPRESENTABLE. This closes a
      branch of development, not a region of design space, and the difference has
      to survive into the code or the foreclosure will quietly become structural.
      CONCRETELY, AND THIS IS THE TESTABLE PART: no assumption that sensory data
      is FIXED ACROSS FIXATIONS may be baked into any interface. An interface that
      takes the image pair once and then serves fixations out of it forever is
      cheap to write, is adequate for every experiment run so far, and would make
      a plant unrepresentable without anyone deciding that it should be. exp003's
      arm V is the existing counter-example: it re-runs the front end every
      fixation, and it is the first arm in either repository in which an action
      changes what data exists.
      So the shape to preserve is the one arm V already needs. Any interface added
      after this foreclosure must be able to express "the data changed because the
      system moved", whether or not anything currently moves.
    cost_to_reopen: >-
      Low as a decision, and that is the point of recording it this way: nothing
      is being built that a plant would have to be dug out of. Reopening it needs
      the retest in od-003, not an unwinding of work.
    decided_in: >-
      docs/state.yaml, this entry. There is no findings file because there was no
      run: this is a maintainer's decision on the evidence already in the ledger,
      not a result. fc-007, fc-008 and fc-010 were each decided in an
      experiment's findings; this one is not, and the difference is visible here
      rather than inferred.
    vocabulary_note: >-
      "L5" IS CHAT-SURFACE VOCABULARY AND IS NOT DEFINED IN THIS REPOSITORY. The
      layer numbering belongs to the framework document the maintainer holds; the
      only other place it surfaces here is fc-007's `does_not_close`, on the
      L6-to-L1 interface. Recorded so that a session finding "L5" here does not go
      looking for a definition that is not in the tree. The clause that this
      repository can actually check is `forecloses_nothing_downstream`.

# ------------------------------------------------------------------------------
# FALSIFIER VERDICTS
