# ------------------------------------------------------------------------------
# OPEN DECISIONS
#
# altitude — how far the decision reaches, and therefore how expensive it is to
# get wrong:
#   fw     framework. Changes the shape of the thing: interfaces between layers,
#          what a type means, what the project is committed to. Expensive to
#          reverse; reversing it invalidates work built on top.
#   exp    experiment design. What gets measured, against what falsifier.
#   impl   implementation. Local, reversible, no interface moves.
#   infra  tooling, CI, layout. Reversible, affects no result.
# ------------------------------------------------------------------------------
open_decisions:

  - id: od-001
    altitude: fw
    status: taken_by_maintainer_awaiting_implementation
    title: The L6 to L1 interface takes a direction, not a pixel.
    decision: >-
      The boundary from the active-sampling layer into geometry passes a
      direction — a unit ray in a stated frame — and not a pixel index. Taken by
      the maintainer. Not yet implemented, and NOT work to start now.
    what_it_replaces:
      reference: visgraf/active-stereo@3f7a263
      symbol: geometry/oculomotor.py:286 target_to_fixation
      current_signature: "target_to_fixation(target_px: tuple[int, int], depth_at_target, rig, current)"
      current_behaviour: >-
        Takes a pixel and un-projects it inline at oculomotor.py:391-392 using
        rig.focal_px and rig.principal_point, then rotates the resulting ray into
        the head frame. The pinhole intrinsics are consumed inside the geometry
        layer, at the one place the reference calls "the only place a pixel
        becomes a rotation".
    consequence: >-
      Under the ray commitment the un-projection moves OUT of geometry and into a
      sensor model that maps a sample index to a unit ray. Neither reference
      repository contains such a component: projection.py runs world -> pixel
      only, and the inverse exists nowhere as a named thing — it is the four
      inline lines cited above. So this is a component to be written, not a
      component to be migrated.
    why_it_is_fw: >-
      It moves an intrinsic out of a layer and creates a boundary that does not
      exist yet. Everything built against the pixel-taking signature would have
      to move with it.
    evidence:
      - >-
        docs/migration-inventory.md measured that 43 of 59 core geometry tests in
        the reference assert nothing requiring a focal length, principal point,
        or pixel — so the ray content is already largely separable from the
        intrinsic, and the coupling is in the StereoRig type rather than in the
        mathematics.
      - >-
        The same inventory measured two places where the coupling is definitional
        rather than incidental: ADR-0017's rectification criterion ("puts the
        plane of regard on the principal row") and the toed-in projection's
        pixel-valued observables. Those do not follow the ray commitment for free.
    open_parts:
      - What frame the unit ray is expressed in, and where that is declared.
      - Whether the sensor model is a protocol with pinhole as one implementation.
      - What the sensor model does with a sample index that has no valid ray.
    blocked_on: Nothing. Deliberately not started; the repository does not run yet.

  - id: od-002
    altitude: fw
    status: open
    title: Closing gap-001 needs a stimulus with a controlled contrast axis at half-occlusion boundaries.
    decision: >-
      Not taken. Recorded, not scheduled. Nothing about this is work to start now.
    problem: >-
      gap-001 asks whether the occluded/matched variance anti-calibration is a property
      of real imagery or of high contrast. Answering it requires a stimulus in which
      contrast at half-occlusion boundaries can be VARIED while the occlusion geometry
      is held fixed. Nothing in either predecessor can produce one, and neither can the
      fixture ported in this repository (gap-010 — it has no true half-occlusions).
    why_blender: >-
      Blender is the only instrument in this repository capable of it: it can hold
      geometry bit-identical across conditions while changing surface appearance, which
      is exactly what the predecessor's exp003 did on a coplanar material chart. That
      experiment varied albedo texture on COPLANAR patches, so it had no occlusion
      geometry to speak of; the question here needs a depth step with controlled
      contrast across it.
    why_it_is_fw: >-
      It decides what the one rendered source is FOR. Blender is committed to as the
      single rendered source (fc-003) and currently has no experiment attached to it at
      all — the commitment has been made and never exercised. Attaching the first
      experiment to it sets the precedent for what renders are used to answer.
    why_not_scheduled: >-
      The repository does not run yet, and od-001 has not been implemented. Recording it
      here is the point: gap-001 otherwise names a question with no identified
      instrument, which reads as unanswerable rather than as unscheduled.
    depends_on: [gap-001, gap-010, fc-003]

# ------------------------------------------------------------------------------
# FORECLOSURE LEDGER
#
# Options this repository has closed, and what reopening one would cost. Recorded
# so that a later session can tell "we decided against this" from "nobody thought
# of it" — the two look identical in a codebase and are not the same thing.
# ------------------------------------------------------------------------------
foreclosures:

  - id: fc-001
    closed: Carrying the predecessors' implementations.
    in_favour_of: >-
      Carrying tests, method notes, pinned ADRs, and measurements-with-provenance.
      Implementations are rewritten against carried tests.
    rationale: >-
      "Carry only what can fail." Applied in docs/migration-inventory.md over 114
      classified items from both references.
    cost_to_reopen: Low for any single module; the references are public and pinned.
    decided_in: docs/migration-inventory.md

  - id: fc-002
    closed: A directory per framework layer.
    in_favour_of: A flat package, with structure added when something needs it.
    rationale: >-
      Measured in the reference at 3f7a263: geometry 830, encoding 374, inference
      456, scaling 95, control 151, policy 200, scenes 2069 lines, library total
      4913. Stimulus infrastructure is 2069/4913 = 42.1%. The three layers that
      make it "active Bayesian" rather than a stereo matcher — scaling (metric
      scaling and MLE fusion), control (the vergence loop), policy (gaze) — are
      446/4913 = 9.1% between them. A directory per layer is an invitation to
      fill it, and the invitation was accepted unevenly.
    cost_to_reopen: Low. Splitting a flat package later is mechanical.

  - id: fc-003
    closed: More than one rendered stimulus source.
    in_favour_of: Blender, alone.
    rationale: >-
      One renderer to verify, one set of conventions to state. The reference
      records that nothing inside Blender can be covered by its test suite
      (gap-009), and that cost is worth paying once, not twice.
    cost_to_reopen: Medium. Needs an ADR, written after trying it.

  - id: fc-004
    closed: Growing the analytic fixture into a stimulus corpus.
    in_favour_of: >-
      One analytic fixture — closed-form, milliseconds, no monocular depth cues —
      that exists so tests are fast and exact.
    rationale: >-
      It is a test fixture. A finding that rests on it has misused it. This is
      the specific mechanism behind fc-002's 42%: stimulus infrastructure grows
      because each addition is individually reasonable.
    cost_to_reopen: >-
      Low mechanically, high in judgement — reopening it is how the predecessor
      got where it did, so it needs an ADR and a reason that is not "we needed
      one more case".

  - id: fc-005
    closed: A definition of done made only of artifact-quality clauses.
    in_favour_of: A definition of done whose first clause is a progress term.
    rationale: >-
      The predecessor's five clauses were all about artifact quality — tests
      pass, new behaviour has a test, docstrings state units and frames, the ADR
      is written, the diff is clean (CLAUDE.md:113-117 at 3f7a263). Every one can
      be satisfied by a perfect component added to a loop that has never run,
      which is what happened.
    cost_to_reopen: None mechanically. It is a rule, and rules are reopened by argument.

  - id: fc-006
    closed: CLAUDE.md as the authority on units and frames.
    in_favour_of: >-
      Frames declared at the function that returns the value; CLAUDE.md governs
      process only.
    rationale: >-
      The predecessor's §3 declared depth "metres, cyclopean frame" and
      geometry/oculomotor.py:337-348 records that this is false — the value is z
      in the rectified left-camera frame, and the two agree only at zero
      elevation. A sentence in a governance file has nothing to fail against.
    cost_to_reopen: None mechanically; the reason not to is recorded above.

  - id: fc-007
    altitude: fw
    closed: >-
      Reframing the gaze objective from posterior variance to expected information
      gain.
    in_favour_of: >-
      argmax of posterior variance plus inhibition of return at the predecessor's
      20.0 px radius.
    rationale: >-
      Measured, pre-registered, and against the hypothesis that motivated the
      experiment. exp001 ran four arms over 8 seeds: the principled objective
      (argmax of the field integral of expected variance reduction) and the cheap
      remedy (argmax variance + inhibition of return) are INDISTINGUISHABLE on
      both declared primary metrics, at a threshold declared before any arm ran.
      Both beat the ported baseline; neither beats the other. The two objectives
      never once selected the same fixation (0 of 144 comparisons at matched
      state), so this is not "the objectives agree" — it is that the choice does
      not change the outcome, while the ~1e4x cost difference is real.
    first_fw_foreclosure: true
    cost_to_reopen: >-
      An experiment on a stimulus with true half-occlusions. This one cannot
      settle the question there — see the limit below — so reopening is not
      merely allowed, it is anticipated.
    limit_on_this_foreclosure: >-
      gap-010: the fixture has no true half-occlusions. Its right image is
      resampled from its left, so the (170, 94) failure driving the lockup is a
      MATCHING failure in a fully visible region, not an occlusion. The two
      structurally different sources of high posterior variance that motivated the
      experiment are therefore represented by only one of their two mechanisms.
      THIS FORECLOSES THE QUESTION FOR A STIMULUS WITHOUT OCCLUSIONS AND NO
      FURTHER. Everything measured is consistent with the objective mattering a
      great deal on a stimulus with real occlusions.
    what_would_lift_it: >-
      A rendered stimulus with a controlled contrast axis at half-occlusion
      boundaries — gap-001, and od-002 which names Blender as the only instrument
      in this repository able to produce one. NOT by growing the fixture: that is
      fc-004, and reopening it needs an ADR and a better reason than needing one
      more case.
    does_not_close: >-
      od-001, despite a natural-looking association. od-001 decides whether the
      L6-to-L1 interface passes a DIRECTION or a PIXEL — a question about the type
      of the boundary. exp001 varied the OBJECTIVE behind the choice, and every
      arm passed a pixel to step(fixation=...). Nothing here measured the
      interface type, so closing od-001 on this evidence would be unsupported.
      od-001 stays open.
    scope_annotation_added_by_exp002: >-
      NARROWER THAN IT LOOKS. Every arm exp001 compared was informed by posterior
      variance, so this foreclosure is a null about the CHOICE AMONG
      VARIANCE-DERIVED OBJECTIVES, not about saliency. exp002 ran the uninformed
      arms and found that variance DOES carry information beyond the validity
      mask: mask-only coverage (E) is distinguishably worse than argmax-variance
      plus inhibition of return (A') on both primary metrics, at 40 and again at
      45 fixations. See fc-008 and bio-016. The original verdict stands; only its
      scope is clarified.
      exp002 also strengthens it: at 40 fixations with 16 seeds, C is
      distinguishably WORSE than A' on median (1.05x bar), where exp001 found them
      indistinguishable at 18 fixations with 8 seeds. The cheap remedy is at least
      as good as the field integral, which is the direction this foreclosure
      already went.
    decided_in: experiments/exp001_gaze_objective/findings.md

  - id: fc-008
    altitude: fw
    closed: >-
      Replacing variance-driven gaze allocation with uninformed or mask-only
      coverage.
    in_favour_of: >-
      Keeping a posterior-variance-driven policy — argmax v plus inhibition of
      return, unchanged from fc-007.
    rationale: >-
      Measured and pre-registered, and it closes the gap fc-007 left open. All
      four exp001 arms read posterior variance, so fc-007 could not say whether
      variance mattered at all. exp002 ran two deliberately impoverished arms: D
      (blind raster, no information) and E (masked coverage, the validity mask
      only), at a pitch derived from the inhibition radius so that spacing is not
      confounded with policy type.
      E is DISTINGUISHABLY WORSE than A' on both primary metrics — median +0.00028
      at 1.38x the bar, p90 +0.04957 at 1.96x — and worse than C on p90. So the
      strong outcome, that the allocation half of the framework's claim is empty
      here, does NOT hold. Posterior variance carries information beyond the mask.
      The verdict survives the check that nearly overturned it: A' and C had
      converged by step 40 while D and E had not, making the gap plausibly an
      approach-rate artefact. Re-run to 45 fixations (E's lattice limit,
      post-hoc), E has stopped improving — median moved 1e-5 and p90 got worse —
      and the gap persists at 1.17x and 1.55x the bar.
    but_the_effect_is_small: >-
      THE SIZE MATTERS AS MUCH AS THE SIGN, and this foreclosure should not be
      cited without it. The validity mask is worth 0.01854 m of median error
      (63.7% of D's), and posterior variance on top of it is worth 0.00028 m
      (2.7% of E's) — a ratio of 65 : 1. On p90 the ratio narrows to 3.5 : 1.
      A policy that knows only WHERE THE DATA IS recovers 97.3% of the
      median-error benefit and 88.4% of the p90 benefit of the full
      variance-driven policy. Variance is a real but small correction on a much
      larger effect that is purely about coverage. See bio-015, bio-016, bio-017.
    limit_on_this_foreclosure: >-
      THIS FIXTURE HAS NO TRUE HALF-OCCLUSIONS (gap-010). Its right image is
      resampled from its left, so high posterior variance here never marks a
      region that is geometrically UNMEASURABLE — only one that is hard to match.
      The two structurally different sources of high variance that motivate an
      active policy are therefore represented by one of them.
      So this holds FOR A STIMULUS WITHOUT HALF-OCCLUSIONS AND NO FURTHER. The
      claim most exposed is the 65:1 ratio: on a stimulus with real occlusions the
      variance channel would carry a signal about geometric unmeasurability that
      it cannot carry here, and the ratio could move a long way.
    what_would_lift_it: >-
      A rendered stimulus with a controlled contrast axis at half-occlusion
      boundaries — gap-001, and od-002 which names Blender as the only instrument
      here able to produce one. NOT by growing the fixture: that is fc-004.
    cost_to_reopen: An experiment on a stimulus with true half-occlusions.
    decided_in: experiments/exp002_saliency_value/findings.md

# ------------------------------------------------------------------------------
# FALSIFIER VERDICTS
#
# Every specification carries a falsifier (docs/workflow.md). A verdict that
# lives only in a pull-request body is not in the tree and a cold session cannot
# read it — and by this repository's own argument, a verdict with no durable
# record cannot be checked, which is the same defect as a specification with no
# falsifier. They are recorded here, with the numbers, whichever way they came
# out.
# ------------------------------------------------------------------------------
falsifier_verdicts:

  - iteration: 2
    id: fv-002-1
    falsifier: >-
      If a substantial fraction of carried measurements cannot be given recoverable
      provenance — no SHA, no config, no n — then "data with provenance" is not
      achievable for them, they are prose after all, and the carry decision was wrong.
    verdict: did_not_fire
    qualification: fired partially and narrowly, as the specification anticipated
    numbers:
      inherited_entries: 41
      lacking_measured_at_sha: 3
      lacking_measured_at_sha_fraction: 0.073
      lacking_n: 0
      lacking_configuration: 0
    detail: >-
      All three are exp001 (as-exp001-foveal-mae, -coverage, -hallucination), whose
      source records "(pre-commit)" in its own SHA column at
      experiments/exp001_matcher_baseline/findings.md:22. The remaining 38 carry a real
      commit. Every inherited entry has an n. Provenance is recoverable for 92.7% of the
      record, so the carry decision stands and Part A did not need revisiting.
    machine_checkable: >-
      measured_at_sha is null on exactly those three entries, so the defect is queryable
      rather than buried in prose.
    verified_at_commit: ed80270

  - iteration: 2
    id: fv-002-2
    falsifier: >-
      If the CLAUDE.md written for this repository is not substantially shorter than
      active-stereo's, the invariants are not doing the work of the rules they replace
      and the methodology has not simplified.
    verdict: did_not_fire
    numbers:
      this_repo_lines: 111
      reference_lines: 192
      reduction_lines: 81
      reduction_fraction: 0.42
      this_repo_words: 886
      reference_words: 1498
      word_reduction_fraction: 0.41
    detail: >-
      Reference is visgraf/active-stereo@3f7a263 CLAUDE.md. 42% fewer lines and 41%
      fewer words, so the reduction is not an artefact of line wrapping.
    verified_at_commit: ed80270

  - iteration: 3
    id: fv-003-1
    falsifier: >-
      If the port's trajectory does not reproduce within numerical tolerance, then
      either the port is wrong or the predecessor's numbers are
      environment-dependent. Both matter before anything is built on this baseline.
    verdict: did_not_fire
    numbers:
      supplied_quantities_checked: 20
      reproduced: 20
      diverged: 0
      arrays_compared_against_the_original: 11
      arrays_identical: 11
    detail: >-
      Neither disjunct holds. The port is bit-identical to
      visgraf/bioeye@e908170 — both implementations executed in one interpreter and
      compared with np.array_equal including dtype and shape, across left, right,
      depth_gt, d_sub, var_d, valid_fe, posterior mean and var, the valid mask, the
      sentinel-applied var_d, and the RMSE and D_fix trajectories, plus the
      scanpath. And the numbers are not environment-dependent across the range
      tested: every supplied value reproduced to the digits given, in a DIFFERENT
      environment (Python 3.14.6 / numpy 2.5.2 / scipy 1.18.1 / matplotlib 3.11.1
      against the supplied 3.12.3 / 2.4.4 / 1.17.1 / 3.10.8).
      Reproduction was total, not partial: the trajectory AND the lockup both
      reproduced, so the most informative outcome the specification anticipated did
      not arise.
      One correction, in the direction of precision rather than disagreement: the
      RMSE is not literally frozen from step 5. It stays within 3.6e-4 of 0.4793,
      rising to a maximum at step 10 (0.479392) and drifting down to 0.479306 by
      step 17. Step 5 itself is 0.479029, which rounds to 0.4790 rather than
      0.4793. The characterisation is right about the shape and about the
      magnitude; "frozen" overstates it by a fourth decimal.
    verified_at_commit: ae11496

  - iteration: 3
    id: fv-003-2
    falsifier: >-
      fc-002 closed "a directory per layer" in favour of a flat package. If roughly
      400 lines of real code already requires subdirectories to stay navigable,
      fc-002 was closed too early and should be reopened.
    verdict: did_not_fire
    numbers:
      library_lines: 643
      modules: 6
      subpackages: 0
      largest_module_lines: 200
      test_lines: 383
      test_modules: 3
    detail: >-
      The flat package held, and comfortably. 643 lines — more than the 400 the
      falsifier anticipated — sit in six flat modules split along the seams the
      predecessor's own file already had: fixture, matching, loop, figure, and a
      baseline that composes them. The largest is loop.py at 200 lines. No
      subdirectory was created, and none was wanted; the question was not avoided
      by quietly adding structure.
      Honest limit on this verdict: 643 lines is small, and the modules divide
      cleanly because the predecessor's single file already had internal section
      breaks to follow. This is evidence that fc-002 was not closed too early, not
      evidence that it will hold at 3000 lines.
    verified_at_commit: ae11496

  - iteration: 4
    id: fv-004-1
    falsifier: >-
      If A' and C produce indistinguishable trajectories at the declared
      threshold, then controlling for revisiting is sufficient and changing the
      objective is not warranted; the reframe from variance to expected
      information gain is foreclosed.
    verdict: FIRED
    numbers:
      seeds: 8
      budget: 18
      median_abs_err: {A: 0.01318, A_prime: 0.01126, B: 0.01244, C: 0.01063}
      p90: {A: 0.41180, A_prime: 0.36736, B: 0.42003, C: 0.36848}
      rmse_secondary: {A: 0.47532, A_prime: 0.47246, B: 0.47622, C: 0.47291}
      C_vs_A_prime_median: {diff: -0.00063, bar: 0.00088, fraction_of_bar: 0.72}
      C_vs_A_prime_p90: {diff: 0.00112, bar: 0.00793, fraction_of_bar: 0.14}
      argmax_agreement_A_vs_C: 0.000
      spearman_A_vs_C: 0.348
    detail: >-
      Indistinguishable on both primary metrics, and the two primaries do not even
      agree on a direction — C is nominally better on median and nominally worse
      on p90 — which is what a null looks like. Both remedies DO beat the ported
      baseline on median (A' -0.00192, C -0.00255, both distinguishable), so the
      lockup is real and both fixes work; they just do not differ from each other.
      The result that makes this more than a negative: A and C never select the
      same fixation, 0 of 144. The objectives disagree completely about where to
      look and produce indistinguishable outcomes. Which pixel is fixated barely
      matters on this fixture; not repeating does.
      The pre-registered contingency was checked: the fifth diagnostic arm was to
      run only if C beat A'. It did not, so the blur confound does not threaten
      the conclusion and the arm was not run.
    verified_at_commit: ed0683a

  - iteration: 4
    id: fv-004-2
    falsifier: >-
      If B does not track C — different arms of the argmax, or a materially worse
      trajectory — then the cheap single-pixel approximation is unusable and any
      information-gain policy costs a field integral per candidate per step.
    verdict: FIRED
    numbers:
      argmax_agreement_B_vs_C: 0.000
      comparisons: 144
      median_argmax_distance_px: 115.2
      fovea_sigma_px: 34.0
      sigmas_apart: 3.4
      spearman_B_vs_C: 0.278
      B_vs_C_median: {diff: 0.00181, bar: 0.00187, fraction_of_bar: 0.97}
      distinct_fixations: {B: 11.88, C: 17.50}
    detail: >-
      Fires on the first disjunct, unambiguously. On the second it does not: the
      declared rule returns "indistinguishable" for the trajectory, but by a 3%
      margin, and that is reported as the knife-edge it is rather than rounded to
      a verdict. Recorded as constraint cn-001.
    verified_at_commit: ed0683a

  - iteration: 4
    id: fv-004-stride
    falsifier: >-
      Declared design check: halving the candidate stride must not change the
      fixation selected at step 1; if it does, the grid is too coarse and the
      stride is reduced before any arm is scored.
    verdict: FIRED at the pre-registered value, protocol followed
    numbers:
      stride_8: {candidates: 824, selected: [128, 176]}
      stride_4: {candidates: 3314, selected: [120, 180]}
      stride_2: {candidates: 13269, selected: [120, 180]}
      stride_1: {candidates: 53098, selected: [118, 187]}
    detail: >-
      Stride 8 failed its halving check, so the stride was reduced to 4 — which
      passes — and the stride-8 run was DISCARDED, not reported. Recorded because
      it qualifies the main result: stride 2 fails the same check, the competing
      picks are 7-9 px apart against a 34 px fovea sigma, and an objective whose
      argmax moves under grid refinement is not finely steering the policy. That
      flatness is consistent with, and may partly explain, the fv-004-1 null.
    verified_at_commit: ed0683a

  - iteration: 5
    id: fv-005-1
    falsifier: >-
      If E (masked coverage) is indistinguishable from A' and from C at the exp001
      bars, then posterior variance contributes nothing beyond the validity mask
      on this stimulus, and the allocation half of the framework's claim is empty
      here.
    verdict: did_not_fire
    numbers:
      E_vs_A_prime_median: {diff: 0.00028, bar: 0.00021, x_bar: 1.38, direction: E_worse}
      E_vs_A_prime_p90: {diff: 0.04957, bar: 0.02535, x_bar: 1.96, direction: E_worse}
      E_vs_C_median: {diff: -0.00038, bar: 0.00052, x_bar: 0.74, direction: indistinguishable}
      E_vs_C_p90: {diff: 0.05154, bar: 0.02375, x_bar: 2.17, direction: E_worse}
      post_hoc_at_45_fixations: {median_x_bar: 1.17, p90_x_bar: 1.55}
    detail: >-
      Variance does carry information beyond the mask. Recorded as fc-008, and
      fc-007's scope is annotated: exp001's null was about the choice among
      variance-derived objectives, not about saliency.
      The verdict survived the caveat that nearly overturned it. The declared
      convergence analysis showed A' and C converged by step 40 while D and E had
      not, which would have made the gap an approach-rate artefact; at that point
      the E-A' median gap was 0.7 steps of E's own improvement rate. Re-run to 45
      fixations, E's lattice limit and post-hoc, E has stopped improving and the
      gap persists.
      Size, which matters as much as sign: the mask is worth 65x more than the
      variance on median, 3.5x on p90. A mask-only policy recovers 97.3% of the
      median benefit.
    verified_at_commit: c0b54a4

  - iteration: 5
    id: fv-005-2
    falsifier: >-
      If D (blind raster) ties with E (masked coverage), even the validity mask
      contributes nothing and the result is purely about spacing.
    verdict: FIRED
    numbers:
      D_vs_E_median: {diff: 0.01854, bar: 0.00039, x_bar: 47.0}
      D_vs_E_p90: {diff: 0.17445, bar: 0.02967, x_bar: 5.9}
      D_vs_E_rmse: {diff: 0.03176, bar: 0.00949, x_bar: 3.4}
      D_fixations_on_invalid: {mean: 19.44, of: 40, fraction: 0.486}
    detail: >-
      D does not tie with E; it is worse by 47x the bar on median. The validity
      mask is not free information — D spends 49% of its budget outside the valid
      region because its lattice is blind to where the data is. Quantified and
      recorded as bio-015 rather than left in prose, as required.
    verified_at_commit: c0b54a4

  - iteration: 5
    id: fv-005-harness
    falsifier: >-
      Declared check: seeds 0-7 at step 18 must reproduce exp001's recorded
      values, or the harness has drifted and nothing in exp002 is comparable.
    verdict: passed
    numbers:
      max_abs_delta: 0.0
      arms_checked: [A, A_prime, B, C]
    detail: >-
      Exact reproduction for all four shared arms, so exp001 is re-derivable from
      exp002's run and the two differ only in the eight added seeds. This is what
      licenses the C_vs_B re-check below.
    verified_at_commit: c0b54a4

  - iteration: 5
    id: fv-005-recheck
    falsifier: >-
      exp001's C_vs_B was recorded indistinguishable at 0.97 of its bar. Declared
      in advance: re-evaluate at step 18 with 16 seeds, and if it flips, amend by
      addition rather than by editing the original verdict.
    verdict: FLIPPED
    numbers:
      exp001_8_seeds: {mean_diff: 0.00181, bar: 0.00187, x_bar: 0.97, verdict: indistinguishable}
      exp002_16_seeds: {mean_diff: 0.00233, bar: 0.00210, x_bar: 1.11, verdict: distinguishable_B_worse}
    detail: >-
      It flips. exp001's findings are amended by addition; the original verdict is
      left in place. exp001's falsifier-2 conclusion is unaffected — it fired on
      the argmax disjunct, 0 of 144 agreement, which this does not touch — and the
      flip strengthens cn-001. Recorded as bio-018.
      Worth noting for the method: the original was reported at 0.97 of its bar
      rather than rounded to a verdict, which is why the flip is legible rather
      than a surprise.
    verified_at_commit: c0b54a4

# ------------------------------------------------------------------------------
# STANDING CONSTRAINTS
#
# Measured costs and impossibilities that bind future work regardless of what is
# decided. Not decisions; consequences.
# ------------------------------------------------------------------------------
constraints:

  - id: cn-001
    from: exp001, falsifier 2
    statement: >-
      Any information-gain gaze policy costs a full field integral per candidate
      per step. The cheap single-pixel approximation does not substitute for it.
    evidence: >-
      B (argmax of the single-pixel Delta_c(c)) and C (argmax of the field
      integral Delta_total(c)) never selected the same candidate: argmax agreement
      0.000 over 144 comparisons (8 seeds x 18 steps), evaluated at the same state
      on the same grid, with picks a median 115 px apart — 3.4 x the 34 px fovea
      sigma, i.e. non-overlapping regions rather than neighbouring pixels.
      Spearman over the grid +0.278.
    cost_measured: >-
      C at stride 4 is 3314 field integrals per step, 1.8 s per step, against
      under a millisecond for argmax v with inhibition of return — roughly 1e4x.
    binds: >-
      Whoever reopens fc-007. It does not bind current work, because fc-007
      forecloses adopting such a policy at all.
    caveat: >-
      B and C were technically INDISTINGUISHABLE on the declared trajectory
      metrics, but the median comparison landed at 0.97 of its bar — a knife-edge,
      unlike the A'-vs-C verdict. This constraint rests on the argmax evidence,
      which is unambiguous, not on the trajectory comparison, which is not.
