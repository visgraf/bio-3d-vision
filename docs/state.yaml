        (2) can each of the four expensive results be asserted WITHOUT a focal
            length? If any cannot, the ray commitment is a re-derivation rather
            than a migration for that result;
        (3) how many of the reference's 59 core geometry tests survive? A large
            residue of genuinely pinhole-dependent geometry tests would mean the
            separation is not clean;
        (4) what does splitting rig from sensor cost outside geometry? The
            inventory predicted zero.
    verdict: >-
      (1) NON-EMPTY: additive, and not eliminating. (2) ALL FOUR, two verbatim and
      two restated. (3) 37 of 59 across, 3 structurally dropped, 19 out of scope,
      0 unaccounted. (4) ZERO forced by the split — but the prediction is weakly
      confirmed and the report says why.
    numbers:
      loop_py_diff: {added: 35, removed: 2}
      policy_py_diff: {added: 0, removed: 0}
      files_changed_outside_the_new_module: 3
      arrays_bit_identical: true
      lattice_round_trip_exact_indices: 76800
      expensive_results: {verbatim: 2, restated: 2, unassertable_without_a_focal_length: 0}
      focal_lengths_constructed_in_the_ported_tests: 1
      core_set: {total: 59, verbatim: 24, restated: 13, structurally_dropped: 3, out_of_scope: 19}
      library: {new_module_lines: 529, new_test_lines: 868}
    detail: >-
      (1) THE PREDICTION IS HALF RIGHT AND THE HALF THAT FAILS IS THE INFORMATIVE
      ONE. route_through_sampling's docstring said that once a geometry layer
      existed, "the ray goes straight into it and model.index drops out of this
      path". policy.py is UNCHANGED, so the index has left the policy path. It has
      not left the system: it reappears inside ActiveStereo.step, which cannot
      resolve a ray without a sampling model, because _fovea_weight is a Gaussian
      in row and column and vergence takes a median over a square pixel window.
      Eliminating it needs a foveal weight defined on ANGLE, which is step 17/18
      work. So the commitment is ADDITIVE — 35 lines added to loop.py, nothing
      rewritten, every array bit-identical — and NOT ELIMINATING.
      (2) ALL FOUR SURVIVE, AND THE TWO RESTATEMENTS ARE EXACT RATHER THAN
      APPROXIMATE. The Helmholtz identity at k = 1/2 and the R_e composition order
      port verbatim: both were already pure SO(3) and the reference classified one
      of them `mixed` only because the rig type dragged an intrinsic in.
      The k = 1/2 spherical-excess result and the rectification member choice were
      stated in PIXELS and are restated in angles. In max_vertical_disparity the
      focal length multiplies both eyes' image ordinates equally and every
      assertion is on a DIFFERENCE between the eyes, so it cancels from the
      question "is this zero" — the reference's loop over three focal lengths was
      testing that a constant cancels. "The plane of regard lands on the principal
      row" needs a principal point; "the plane of regard has zero y-component in
      the rectified frame" needs nothing.
      Exactly ONE focal length is constructed in the whole ported file, in a test
      that exists to show a magnitude in pixels is still available. It belongs to
      the test, not to the rig.
      (3) THE INVENTORY'S PREDICTION HELD. It said 39 of 59 were `mixed` — no
      intrinsic needed by the assertion, one required by the type — and that they
      would free themselves once the rig split. All 37 that came across are stated
      with no focal length and no principal point anywhere in their bodies.
      The 3 structurally dropped are the pixel bounds check, the pixel integrality
      check and the depth-field shape check: none has a counterpart at a direction
      boundary, because there is no pixel to bounds-check, no integrality to check,
      and Estimate is scalar. Dropped because the concept went.
      The 19 out of scope are test_geometry.py and test_projection_toedin.py.
      project_toed_in and toed_in_disparity were MEASURED to have no consumer in
      the reference outside a re-export, and depth_to_disparity/disparity_to_depth
      are already covered here by true_disparity and scale_to_depth. Neither
      migrates, and both scope questions were settled by measurement rather than
      by judgement.
      (4) ZERO CHANGES WERE FORCED BY THE SPLIT, AND THE PREDICTION IS CONFIRMED
      WEAKLY. Three files outside the new module changed — __init__.py exports,
      loop.py's step signature, sampling.py's new adapter — and every one of them
      was forced by the RAY commitment, not by separating rig from sensor. The
      split itself cost nothing because bio3dvision had no StereoRig to split: it
      was performed at migration time rather than applied to live code. The
      reference's 39 mixed tests are the evidence that it would have cost
      something there. A confirmation obtained by not having the problem is worth
      less than one obtained by solving it, and this is the former.
      NO FORECLOSURE WAS TAKEN, which is the expected shape for a geom-altitude
      iteration and is reported because the specification asked for a signal if
      one appeared.
      A TRAP THE RAY FORM INTRODUCED, worth recording because it is new rather
      than migrated: the reference multiplied depth by a ray whose z component was
      1, so depth was PLANAR. A unit direction is not that ray, and scaling it by
      depth would silently make depth a RANGE — differing by 1/cos(angle),
      smallest at the centre and largest at the field edge, which is the shape of
      a modelling result rather than a units error. The same confusion
      infer_depth_convention guards in the render path, arriving by a different
      door. Pinned by test_depth_is_planar_not_radial.
    verified_at_commit: 3569152

# ------------------------------------------------------------------------------
# STANDING CONSTRAINTS
#
# Measured costs and impossibilities that bind future work regardless of what is
# decided. Not decisions; consequences.
# ------------------------------------------------------------------------------
constraints:

  - id: cn-001
    from: exp001, falsifier 2
    statement: >-
      Any information-gain gaze policy costs a full field integral per candidate
      per step. The cheap single-pixel approximation does not substitute for it.
    evidence: >-
      B (argmax of the single-pixel Delta_c(c)) and C (argmax of the field
      integral Delta_total(c)) never selected the same candidate: argmax agreement
      0.000 over 144 comparisons (8 seeds x 18 steps), evaluated at the same state
      on the same grid, with picks a median 115 px apart — 3.4 x the 34 px fovea
      sigma, i.e. non-overlapping regions rather than neighbouring pixels.
      Spearman over the grid +0.278.
    cost_measured: >-
      C at stride 4 is 3314 field integrals per step, 1.8 s per step, against
      under a millisecond for argmax v with inhibition of return — roughly 1e4x.
    binds: >-
      Whoever reopens fc-007. It does not bind current work, because fc-007
      forecloses adopting such a policy at all.
    caveat: >-
      B and C were technically INDISTINGUISHABLE on the declared trajectory
      metrics, but the median comparison landed at 0.97 of its bar — a knife-edge,
      unlike the A'-vs-C verdict. This constraint rests on the argmax evidence,
      which is unambiguous, not on the trajectory comparison, which is not.
