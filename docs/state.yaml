# ------------------------------------------------------------------------------
# OPEN DECISIONS
#
# altitude — how far the decision reaches, and therefore how expensive it is to
# get wrong:
#   fw     framework. Changes the shape of the thing: interfaces between layers,
#          what a type means, what the project is committed to. Expensive to
#          reverse; reversing it invalidates work built on top.
#   exp    experiment design. What gets measured, against what falsifier.
#   impl   implementation. Local, reversible, no interface moves.
#   infra  tooling, CI, layout. Reversible, affects no result.
# ------------------------------------------------------------------------------
open_decisions:

  - id: od-002
    altitude: fw
    status: open
    title: Closing gap-001 needs a stimulus with a controlled contrast axis at half-occlusion boundaries.
    decision: >-
      Not taken. Recorded, not scheduled. Nothing about this is work to start now.
    problem: >-
      gap-001 asks whether the occluded/matched variance anti-calibration is a property
      of real imagery or of high contrast. Answering it requires a stimulus in which
      contrast at half-occlusion boundaries can be VARIED while the occlusion geometry
      is held fixed. Nothing in either predecessor can produce one, and neither can the
      fixture ported in this repository (gap-010 — it has no true half-occlusions).
    why_blender: >-
      Blender is the only instrument in this repository capable of it: it can hold
      geometry bit-identical across conditions while changing surface appearance, which
      is exactly what the predecessor's exp003 did on a coplanar material chart. That
      experiment varied albedo texture on COPLANAR patches, so it had no occlusion
      geometry to speak of; the question here needs a depth step with controlled
      contrast across it.
    why_it_is_fw: >-
      It decides what the one rendered source is FOR. Blender is committed to as the
      single rendered source (fc-003) and currently has no experiment attached to it at
      all — the commitment has been made and never exercised. Attaching the first
      experiment to it sets the precedent for what renders are used to answer.
    why_not_scheduled: >-
      CORRECTED AT exp008. This previously read "the repository does not run yet,
      and od-001 has not been implemented". BOTH CONDITIONS HAVE BEEN MET and had
      been for some time: the loop runs on two stimuli, and od-001 closed at
      fc-009. The clause was stale and is replaced rather than edited silently.
      The reason it is still not scheduled is now different, and better. Its
      subject is CONTRAST at occlusion boundaries, which needs material changes
      rather than geometry — every scene this repository can build is
      emission-shaded, so a contrast axis is new machinery, not a new arrangement
      of the machinery there is.
      And it should be asked at an occlusion fraction that makes the regime
      visible. exp008 measured that: allocation effects peak near 8.84% occluded
      surface and vanish by 17.16%, where every policy saturates at the prior
      (bio-041). Asking a contrast question at an arbitrary occlusion fraction
      would have risked asking it where nothing is measurable.
      Recording it here is still the point: gap-001 otherwise names a question with
      no identified instrument, which reads as unanswerable rather than as
      unscheduled.
    depends_on: [gap-001, gap-010, fc-003]

  - id: od-003
    altitude: fw
    status: open
    title: >-
      Whether vergence acquisition deserves a retest with a controller that has a
      signed out-of-range error signal.
    decision: Not taken. Recorded, not scheduled.
    problem: >-
      exp003 measured that verging to acquire is worse than not verging, on every
      axis except coverage (fc-010). But the diagnosis localises the failure to
      the ESTIMATOR, not to the idea: ActiveStereo.vergence takes the median of
      in-window valid matches, so a target outside the window is either masked
      out or returns an arbitrary in-window value. It cannot produce a signed
      error, and it was observed verging away from the target.
      A controller driven by disparities outside the fusional range — which is
      what biological vergence is driven by — would be a different measurement.
      Nothing here says it would succeed.
    why_it_is_fw: >-
      It decides whether the mechanical plant gets a second hearing. fc-010 as it
      stands is evidence against the plant; whether that evidence is about the
      plant or about one estimator of it is exactly what this decides.
    why_not_scheduled: >-
      It would require replacing ActiveStereo.vergence, which is a carried part of
      the faithful port. That is a deviation commit, made one at a time with its
      effect on the trajectory reported, and it is not this iteration.
    depends_on: [fc-010, gap-010]

# ------------------------------------------------------------------------------
# FORECLOSURE LEDGER
#
# Options this repository has closed, and what reopening one would cost. Recorded
# so that a later session can tell "we decided against this" from "nobody thought
# of it" — the two look identical in a codebase and are not the same thing.
# ------------------------------------------------------------------------------
foreclosures:

  - id: fc-001
    closed: Carrying the predecessors' implementations.
    in_favour_of: >-
      Carrying tests, method notes, pinned ADRs, and measurements-with-provenance.
      Implementations are rewritten against carried tests.
    rationale: >-
      "Carry only what can fail." Applied in docs/migration-inventory.md over 114
      classified items from both references.
    cost_to_reopen: Low for any single module; the references are public and pinned.
    decided_in: docs/migration-inventory.md

  - id: fc-002
    closed: A directory per framework layer.
    in_favour_of: A flat package, with structure added when something needs it.
    rationale: >-
      Measured in the reference at 3f7a263: geometry 830, encoding 374, inference
      456, scaling 95, control 151, policy 200, scenes 2069 lines, library total
      4913. Stimulus infrastructure is 2069/4913 = 42.1%. The three layers that
      make it "active Bayesian" rather than a stereo matcher — scaling (metric
      scaling and MLE fusion), control (the vergence loop), policy (gaze) — are
      446/4913 = 9.1% between them. A directory per layer is an invitation to
      fill it, and the invitation was accepted unevenly.
    cost_to_reopen: Low. Splitting a flat package later is mechanical.

  - id: fc-003
    closed: More than one rendered stimulus source.
    in_favour_of: Blender, alone.
    rationale: >-
      One renderer to verify, one set of conventions to state. The reference
      records that nothing inside Blender can be covered by its test suite
      (gap-009), and that cost is worth paying once, not twice.
    cost_to_reopen: Medium. Needs an ADR, written after trying it.

  - id: fc-004
    closed: Growing the analytic fixture into a stimulus corpus.
    in_favour_of: >-
      One analytic fixture — closed-form, milliseconds, no monocular depth cues —
      that exists so tests are fast and exact.
    rationale: >-
      It is a test fixture. A finding that rests on it has misused it. This is
      the specific mechanism behind fc-002's 42%: stimulus infrastructure grows
      because each addition is individually reasonable.
    cost_to_reopen: >-
      Low mechanically, high in judgement — reopening it is how the predecessor
      got where it did, so it needs an ADR and a reason that is not "we needed
      one more case".

  - id: fc-005
    closed: A definition of done made only of artifact-quality clauses.
    in_favour_of: A definition of done whose first clause is a progress term.
    rationale: >-
      The predecessor's five clauses were all about artifact quality — tests
      pass, new behaviour has a test, docstrings state units and frames, the ADR
      is written, the diff is clean (CLAUDE.md:113-117 at 3f7a263). Every one can
      be satisfied by a perfect component added to a loop that has never run,
      which is what happened.
    cost_to_reopen: None mechanically. It is a rule, and rules are reopened by argument.

  - id: fc-006
    closed: CLAUDE.md as the authority on units and frames.
    in_favour_of: >-
      Frames declared at the function that returns the value; CLAUDE.md governs
      process only.
    rationale: >-
      The predecessor's §3 declared depth "metres, cyclopean frame" and
      geometry/oculomotor.py:337-348 records that this is false — the value is z
      in the rectified left-camera frame, and the two agree only at zero
      elevation. A sentence in a governance file has nothing to fail against.
    cost_to_reopen: None mechanically; the reason not to is recorded above.

  - id: fc-007
    altitude: fw
    closed: >-
      Reframing the gaze objective from posterior variance to expected information
      gain.
    in_favour_of: >-
      argmax of posterior variance plus inhibition of return at the predecessor's
      20.0 px radius.
    rationale: >-
      Measured, pre-registered, and against the hypothesis that motivated the
      experiment. exp001 ran four arms over 8 seeds: the principled objective
      (argmax of the field integral of expected variance reduction) and the cheap
      remedy (argmax variance + inhibition of return) are INDISTINGUISHABLE on
      both declared primary metrics, at a threshold declared before any arm ran.
      Both beat the ported baseline; neither beats the other. The two objectives
      never once selected the same fixation (0 of 144 comparisons at matched
      state), so this is not "the objectives agree" — it is that the choice does
      not change the outcome, while the ~1e4x cost difference is real.
    first_fw_foreclosure: true
    cost_to_reopen: >-
      An experiment on a stimulus with true half-occlusions. This one cannot
      settle the question there — see the limit below — so reopening is not
      merely allowed, it is anticipated.
    limit_on_this_foreclosure: >-
      gap-010: the fixture has no true half-occlusions. Its right image is
      resampled from its left, so the (170, 94) failure driving the lockup is a
      MATCHING failure in a fully visible region, not an occlusion. The two
      structurally different sources of high posterior variance that motivated the
      experiment are therefore represented by only one of their two mechanisms.
      THIS FORECLOSES THE QUESTION FOR A STIMULUS WITHOUT OCCLUSIONS AND NO
      FURTHER. Everything measured is consistent with the objective mattering a
      great deal on a stimulus with real occlusions.
    what_would_lift_it: >-
      A rendered stimulus with a controlled contrast axis at half-occlusion
      boundaries — gap-001, and od-002 which names Blender as the only instrument
      in this repository able to produce one. NOT by growing the fixture: that is
      fc-004, and reopening it needs an ADR and a better reason than needing one
      more case.
    does_not_close: >-
      od-001, despite a natural-looking association. od-001 decides whether the
      L6-to-L1 interface passes a DIRECTION or a PIXEL — a question about the type
      of the boundary. exp001 varied the OBJECTIVE behind the choice, and every
      arm passed a pixel to step(fixation=...). Nothing here measured the
      interface type, so closing od-001 on this evidence would be unsupported.
      od-001 stays open.
    scope_annotation_added_by_exp002: >-
      NARROWER THAN IT LOOKS. Every arm exp001 compared was informed by posterior
      variance, so this foreclosure is a null about the CHOICE AMONG
      VARIANCE-DERIVED OBJECTIVES, not about saliency. exp002 ran the uninformed
      arms and found that variance DOES carry information beyond the validity
      mask: mask-only coverage (E) is distinguishably worse than argmax-variance
      plus inhibition of return (A') on both primary metrics, at 40 and again at
      45 fixations. See fc-008 and bio-016. The original verdict stands; only its
      scope is clarified.
      exp002 produced an A'-vs-C row at 40 fixations with 16 seeds that is
      DISTINGUISHABLE on median at 1.05x bar, favouring A'. It points the same way
      this foreclosure already went, but it is POST-HOC — exp002's
      pre-registration declares only the C_vs_B re-check — and it is not the same
      measurement as exp001's, which was step 18 with 8 seeds. It is also split at
      the noise floor: median 1.05x favouring A', p90 0.26x favouring C, rmse
      0.03x. It is recorded as a flag, not as evidence, and this foreclosure does
      NOT rest on it. See the post_hoc_annotation in
      experiments/exp002_saliency_value/verdicts.json.
    outstanding_test: >-
      A PRE-REGISTERED A'-versus-C comparison at the 40-45 fixation budget. exp001
      settled the pair at 18 fixations with 8 seeds; nothing has settled it at the
      longer budget, and the only figure that exists there is the post-hoc row
      above. NOT SCHEDULED, and recorded here so the absence is visible rather
      than inferred from a row that was never declared.
    stratified_recheck_exp005: >-
      STANDS, AND IS STRENGTHENED. exp005 re-ran exp001's four arms with the only
      change being the pixel set scored, and C-versus-A' is MORE indistinguishable
      away from depth discontinuities than pooled: median 0.72x pooled against
      0.32x in the AWAY band, p90 0.14x against 0.69x, both nulls. It is unchanged
      under a control that restricts where the policy may fixate.
      So this null is not an artefact of the discontinuity band that exp004 showed
      is pathological on this fixture. The concern that motivated exp005 does not
      apply to fc-007. Its gap-010 limit is unchanged: it still holds for a
      stimulus without half-occlusions and no further.
    rendered_support_exp007: >-
      SUPPORTED, INDIRECTLY. exp007 did not re-run B or C — dropped as a decision,
      because this null is the most robust result in the ledger and re-running the
      field-integral arms would have cost about 17.4 of the experiment's 18
      minutes. What it did run is A against A', which shows inhibition of return
      doing MORE work on rendered data than on the fixture: distinguishable on
      both metrics (1.25x median, 1.21x p90) where the fixture's pooled figure was
      distinguishable on median only.
      That is supporting evidence about the remedy, not a test of the objectives
      null itself. The null remains untested on rendered data.
    decided_in: experiments/exp001_gaze_objective/findings.md

  - id: fc-008
    altitude: fw
    closed: >-
      Replacing variance-driven gaze allocation with uninformed or mask-only
      coverage.
    in_favour_of: >-
      Keeping a posterior-variance-driven policy — argmax v plus inhibition of
      return, unchanged from fc-007.
    rationale: >-
      Measured and pre-registered, and it closes the gap fc-007 left open. All
      four exp001 arms read posterior variance, so fc-007 could not say whether
      variance mattered at all. exp002 ran two deliberately impoverished arms: D
      (blind raster, no information) and E (masked coverage, the validity mask
      only), at a pitch derived from the inhibition radius so that spacing is not
      confounded with policy type.
      E is DISTINGUISHABLY WORSE than A' on both primary metrics — median +0.00028
      at 1.38x the bar, p90 +0.04957 at 1.96x — and worse than C on p90. So the
      strong outcome, that the allocation half of the framework's claim is empty
      here, does NOT hold. Posterior variance carries information beyond the mask.
      The verdict survives the check that nearly overturned it: A' and C had
      converged by step 40 while D and E had not, making the gap plausibly an
      approach-rate artefact. Re-run to 45 fixations (E's lattice limit,
      post-hoc), E has stopped improving — median moved 1e-5 and p90 got worse —
      and the gap persists at 1.17x and 1.55x the bar.
    but_the_effect_is_small: >-
      THE SIZE MATTERS AS MUCH AS THE SIGN, and this foreclosure should not be
      cited without it. The validity mask is worth 0.01854 m of median error
      (63.7% of D's), and posterior variance on top of it is worth 0.00028 m
      (2.7% of E's) — a ratio of 65 : 1. On p90 the ratio narrows to 3.5 : 1.
      A policy that knows only WHERE THE DATA IS recovers 97.3% of the
      median-error benefit and 88.4% of the p90 benefit of the full
      variance-driven policy. Variance is a real but small correction on a much
      larger effect that is purely about coverage. See bio-015, bio-016, bio-017.
    limit_on_this_foreclosure: >-
      THIS FIXTURE HAS NO TRUE HALF-OCCLUSIONS (gap-010). Its right image is
      resampled from its left, so high posterior variance here never marks a
      region that is geometrically UNMEASURABLE — only one that is hard to match.
      The two structurally different sources of high variance that motivate an
      active policy are therefore represented by one of them.
      So this holds FOR A STIMULUS WITHOUT HALF-OCCLUSIONS AND NO FURTHER. The
      claim most exposed is the 65:1 ratio: on a stimulus with real occlusions the
      variance channel would carry a signal about geometric unmeasurability that
      it cannot carry here, and the ratio could move a long way.
    what_would_lift_it: >-
      A rendered stimulus with a controlled contrast axis at half-occlusion
      boundaries — gap-001, and od-002 which names Blender as the only instrument
      here able to produce one. NOT by growing the fixture: that is fc-004.
    cost_to_reopen: An experiment on a stimulus with true half-occlusions.
    stratified_recheck_exp005: >-
      QUALIFIED, NOT REVERSED, AND THE QUALIFICATION IS WHERE THE EVIDENCE COMES
      FROM. This foreclosure rests on E being distinguishably worse than A' on both
      primary metrics. exp005 re-ran exp002's arms scoring three bands separately,
      changing nothing else, and that comparison does not survive restriction to
      pixels away from depth discontinuities: median falls from 1.38x pooled
      (distinguishable) to 0.38x (INDISTINGUISHABLE), and p90 REVERSES SIGN — 1.96x
      with E worse pooled, against 1.75x with E BETTER in the AWAY band.
      The gradient is monotone: E-vs-A' on median reads 2.53x at discontinuities,
      1.41x in the middle band, 0.38x away. The evidence for this foreclosure comes
      from the AT and MIDDLE bands, which are exactly the regions exp004 showed are
      pathological on this fixture (fv-012-2, bio-029).
      READ THE MAGNITUDE WITH THE RATIO. The AWAY band carries 0.18% of the total
      squared error (bio-034), so the p90 reversal is 0.00078 m clearing a
      0.000446 m materiality floor. Material by the declared rule, sub-millimetre
      in metres. Both facts are the result.
      WHAT SURVIVES UNTOUCHED is the other half: D-versus-E, the validity mask's
      value, is LARGEST in the AWAY band at 32.20x against 47.04x pooled and is
      distinguishable in every band. The mask's value is real everywhere; the
      variance's is not. That sharpens this entry's own 65:1 ratio rather than
      contradicting it.
      NOT REVERSED HERE, deliberately. exp005 is a re-analysis and did not
      pre-register a reversal; reversing a foreclosure on evidence it did not
      declare in advance is the same defect as closing one on evidence that does
      not bear on it. A pre-registered re-test would need the E-versus-A'
      comparison on a RENDERED stimulus whose discontinuity regions are not
      pathological — od-002's instrument, and od-002 is open.
    rendered_recheck_exp007: >-
      CONFIRMED ON A STIMULUS WITHOUT THE ARTEFACT, and exp005's qualification
      above does not survive it. exp007 ran E and A' on a Blender render of the
      fixture's own geometry, at exp002's budget of 40 and with the fixture arms
      re-run at matched seeds and budget as the reference. E is distinguishably
      WORSE than A' on BOTH primary metrics — median 1.18x, p90 9.04x — matching
      the fixture's POOLED verdict, not its AWAY-band one. On p90 the rendered
      effect is five times the fixture's pooled figure and points opposite to the
      AWAY band.
      So the evidence for this foreclosure is not an artefact of the pathological
      bands. bio-037 explains why both can be true: the policy differences live at
      depth discontinuities on the RENDERED stimulus too, so exp005's AWAY band
      removed the artefact and the signal together. The artefact inflated the
      magnitude of the error there; it did not manufacture the difference.
      The stratified_recheck_exp005 note above is left standing rather than
      edited: it recorded what was measured, and this records what a better
      stimulus measured. The disagreement is the information.
      LIMIT, and it is why this does not close gap-001: the rendered scene copies
      the fixture's geometry, which produces only 5.09% half-occlusion and no
      contrast axis (bio-038). A pre-registered re-test on a stimulus with a
      controlled contrast axis at occlusion boundaries is still what od-002 names.
    decided_in: experiments/exp002_saliency_value/findings.md

  - id: fc-009
    altitude: fw
    closed: >-
      Passing a pixel index across the boundary from the active-sampling layer
      into geometry. Was od-001, taken by the maintainer and now implemented.
    in_favour_of: >-
      A unit ray in a stated frame, produced by a sampling model that sits in
      front of ActiveStereo rather than inside it.
    implemented_as: >-
      src/bio3dvision/sampling.py — a SamplingModel Protocol (direction, index,
      contains, shape, frame) with PinholeSampling as the only implementation,
      plus route_through_sampling, the adapter that turns a policy's choice into
      a direction and back again. Note the "and back again": it returns a PIXEL,
      because ActiveStereo consumes one. A ray is constructed on every step and
      no ray leaves the adapter, which is why falsifier 2 is deferred rather than
      answered.
    frame_declaration: >-
      Directions are unit vectors in the RECTIFIED LEFT-CAMERA frame: +x right
      along increasing column, +y down along increasing row, +z forward along the
      optical axis, right-handed. Stated at every public function that returns
      one, not at governance level — fc-006 records why, and the repetition
      across docstrings is deliberate.
    component_cost_measured: >-
      A RESULT ABOUT THE COMPONENT, NOT ABOUT THE INTERFACE. Constructing the
      sampling model cost ZERO lines of change to six existing modules — loop.py
      byte-identical to main by SHA-256, and matching.py, fixture.py, figure.py,
      baseline.py and policy.py untouched — with the only edit to pre-existing
      code being 10 added lines of exports in __init__.py, nothing removed. The
      work itself is 257 lines of new module and 212 lines of new test. The
      pinhole round trip is exact over all 76800 indices with a pre-rounding
      error of 2.8e-14 against the 0.5 that would flip one, 13 orders of margin.
      That is real and it is what this commit measured. It is NOT a measurement
      of what passing a ray costs.
    falsifier_2_outcome: >-
      DEFERRED. Not additive, not invasive — UNANSWERED, and the earlier verdict
      of ADDITIVE was an overstatement of what was measured.
      Why the evidence does not bear on the question: route_through_sampling
      converts index -> ray -> index and hands ActiveStereo a PIXEL. No ray
      crosses the boundary in this commit. The empty diff to loop.py therefore
      follows from the round trip being the identity — ActiveStereo receives a
      value bit-identical to the one it received before, so of course it did not
      have to change — and not from the ray commitment being cheap. The test that
      would discriminate has not been run, because nothing yet consumes a ray.
      Falsifier 2 asked whether PASSING A RAY is invasive. That remains open.
    falsifier_2_answered_at_step_15: >-
      ANSWERED. ADDITIVE, AND NOT ELIMINATING. The verdict above was deferred
      because no ray crossed the boundary; step 15 built the geometry layer that
      consumes one, so the question is finally decidable.
      WHAT HAPPENED. bio3dvision.oculomotor.target_to_fixation takes a UNIT
      DIRECTION, route_as_direction returns a ray and no index, and
      ActiveStereo.step accepts one. policy.py is UNCHANGED — 0 lines — so the
      index has left the policy path exactly as route_through_sampling's docstring
      predicted. loop.py gained 35 lines and lost 2, all of them the new signature
      and its guard; nothing existing was rewritten. Every array is bit-identical
      across the pixel and ray paths, and exp008 re-runs byte-identically
      (bio-043).
      SO THE COMMITMENT IS ADDITIVE. The migration inventory's reading is
      supported, and this time by a measurement of the interface rather than of
      the component.
      WHAT THE PREDICTION GOT WRONG. "model.index drops out of this path" is half
      right: it leaves the policy path and reappears inside ActiveStereo.step,
      which cannot resolve a ray without a sampling model. The reason is named and
      is not incidental — _fovea_weight is a Gaussian in row and column and
      vergence takes a median over a square pixel window, so a ray must be landed
      on the lattice before either can run. Eliminating the index needs a foveal
      weight defined on ANGLE. That is step 17/18 work and is deliberately not
      built here.
    step_15_estimate: >-
      TESTED AT STEP 15, AND THE CONDITION IT NAMED WAS MET IN PART. It said the
      estimate would be tested by the first commit in which model.index drops out
      of the policy path and route_through_sampling's second hop disappears. The
      first half happened: policy.py is unchanged and route_as_direction returns a
      ray. The second half did not: the hop moved into ActiveStereo.step rather
      than disappearing.
      The measured cost is 35 added lines in loop.py, 0 in policy.py, and 3 files
      touched outside the new module, none of which was forced by the rig/sensor
      split itself. That is a small number, and it is a number about THIS interface
      on THIS lattice — see bio-044 for what it does not cover.
    amendment: >-
      Corrected after first writing, in place, because the original was an
      overstatement rather than a verdict that later data reversed — the two are
      different and are handled differently here. cost_measured claimed to be
      "the number step 15's estimate should be revised against" and
      falsifier_2_outcome read ADDITIVE, NOT INVASIVE with the migration
      inventory's reading SUPPORTED. Neither was measured. The component cost is
      kept under its own name above; the interface verdict is now deferred; and
      step 15's estimate is explicitly not revised. fv-006-2 carried the same
      overstatement and is corrected in the same commit.
    reproduction: >-
      Uniform sampling on the existing pinhole grid is exactly the identity:
      index -> ray -> index is bit-exact over all 76 800 indices, with a
      pre-rounding float error of 2.8e-14 against the 0.5 that would flip an
      index — 13 orders of margin. All six arms reproduce main bit-for-bit on
      fixture arrays, d_sub, var_d, valid, scanpath, posterior mean and variance,
      and all four figure panels, by np.array_equal rather than allclose.
    what_it_does_not_do: >-
      No foveated lattice, no spherical projection, no plant question. The
      interface admits the first two without a signature change — direction is an
      arbitrary index-to-unit-vector map, index returns the nearest sample, and
      contains exists because membership stops being a bounds check on a
      non-uniform lattice — but no speculative parameter was added for either.
      They are decisions before they are code.
    one_declaration_not_a_measurement: >-
      PinholeSampling's principal point defaults to the geometric centre
      ((H-1)/2, (W-1)/2). CameraParams carries no principal point because the
      ported loop never projects a 3-D point, so nothing measured in this
      repository constrains it, and nothing currently reads the absolute
      orientation of the returned rays — only that the round trip is the
      identity, which holds for any principal point. Recorded so that a later
      component which does depend on absolute orientation knows this value was
      chosen here rather than measured.
    infrastructure: >-
      Labelled infrastructure under CLAUDE.md's definition of done, clause 1. It
      moved no measurement and closed no scientific question; it closed an open
      decision, which is the clause's second admissible outcome.
    cost_to_reopen: >-
      Low. The pixel path is not deleted — ActiveStereo still consumes an index,
      and route_through_sampling's second hop exists only because of that. When a
      geometry layer arrives the ray goes straight into it and model.index drops
      out of the path.
    decided_in: docs/state.yaml od-001; implemented on branch feat/sampling-model

  - id: fc-010
    altitude: fw
    closed: >-
      Narrowing the disparity search window as a strategy on this fixture,
      whether fixed (N) or re-centred by verging at every fixation (V).
    in_favour_of: The wide search the port already does.
    rationale: >-
      Measured and pre-registered, under a coverage rule these arms needed and
      the earlier experiments did not. On the intersection of the three arms'
      valid sets — the same 37383 pixels measured three ways — the wide baseline
      reads median 0.01476 m and both narrow arms read ~0.111 m, about 7.5x
      worse, at 2.01x and 11.30x the declared bar. Narrowing does not improve
      quality on this stimulus; it destroys it.
      V additionally costs 147 disparity hypotheses against W's 57 (2.6x) and 19
      front-end invocations against 1.
    what_v_did_buy: >-
      Coverage, and bad coverage. V's union valid set is 64731 against W's 53168,
      +11563 pixels or +21.7% — but the median error on the pixels only V reaches
      is 0.235 m, 16x the wide baseline's error on the shared pixels. N does not
      even buy that: narrowing without re-centring LOSES 6175 pixels, because
      matches whose true disparity falls outside a fixed window fail the ratio
      and consistency tests faster than the receding border constraint adds
      columns.
    mechanism: >-
      THE VERGENCE CONTROLLER HAS NO ERROR SIGNAL, and this is the finding under
      all the numbers. ActiveStereo.vergence estimates fixation disparity as the
      median of d_sub over VALID pixels in a foveal window. A pixel whose true
      disparity lies outside the window usually fails validity and is excluded
      from that median — measured at window [8,12] with the near card at 18.96
      px, only 41.8% survive and their median d_sub reads 10.32. The survivors
      return an arbitrary in-window disparity rather than a signed "too near /
      too far": at seed 0 fixations 5-7 the fixation sat on true disparities of
      15.17 and 18.96 while d_sub read 8.00 and 6.00, the LOWER edge, and the
      controller verged AWAY from the target, 10.0 -> 7.9 -> 5.95.
      The pixels carrying the vergence error signal are exactly the pixels the
      validity mask removes. A real vergence system is driven by disparities
      outside the fusional range; this one is driven by the median of what it can
      already fuse, which is a fixed point by construction.
    scope: >-
      THIS IS A RESULT ABOUT THE PORTED CONTROLLER, NOT ABOUT VERGENCE. A
      vergence estimator with a signed out-of-range error signal — coarse-to-fine,
      or disparity energy — is untested and is not what was measured. Recorded as
      od-003.
    limit_on_this_foreclosure: >-
      gap-010: no true half-occlusions on this fixture, so nothing here speaks to
      a region that is geometrically unmeasurable rather than merely out of
      window. Holds for a stimulus without half-occlusions and no further. One
      window width was run, declared in advance and not swept.
    cost_to_reopen: >-
      A retest with a controller that has a signed out-of-range error signal
      (od-003), or a stimulus with half-occlusions (od-002).
    not_band_checked: >-
      THIS FORECLOSURE HAS NEVER BEEN BAND-CHECKED, and the asymmetry with fc-007
      and fc-008 is deliberate and recorded so a cold session can see it. exp005
      stratified exp001 and exp002; the equivalent for exp003 was specified as
      exp006 and deliberately not run. See am-004 for why.
    rendered_recheck_exp007: >-
      SURVIVES ITS FIRST INDEPENDENT TEST. Until exp007 this foreclosure rested
      entirely on one pooled figure on one stimulus. exp007 re-ran W and V on a
      Blender render of the fixture's geometry — the arms verified identical to
      exp003's by hypothesis count, W 57 and V 147, matching fv-007-1 — and V is
      distinguishably worse than W on both primary metrics, 1.58x on median and
      1.90x on p90.
      V's coverage cost is WORSE on rendered data than on the fixture: it reaches
      6996 fewer pixels than W against 2980, and its exclusive pixels are 11x
      worse than W's. See bio-039.
      Seeds 0-7 rather than exp003's 0-15, which widens the bar rather than
      narrowing it.
    decided_in: experiments/exp003_vergence_acquisition/findings.md

  - id: fc-011
    altitude: fw
    closed: >-
      Modelling L5 as a mechanical plant — an actuator layer whose job is to move
      the eyes — as the branch this project develops next.
    in_favour_of: >-
      L5 models ATTENTIONAL ALLOCATION: where the system spends its limited
      measurement budget, not how an eyeball is driven there.
    decided_by: >-
      The maintainer, on the evidence of fc-008 and fc-010. NOT DERIVED FROM A
      MEASUREMENT IN THIS REPOSITORY, and recorded that way deliberately: it is a
      judgement about which of two branches to develop, taken on an asymmetry
      between two states of knowledge (below), not a result that a run produced.
    the_asymmetry_that_decided_it: >-
      THIS IS THE WHOLE ARGUMENT, and it is about states of knowledge rather than
      about outcomes.
      ALLOCATION IS MEASURED, AND IT WORKS WEAKLY. exp002 ran the deliberately
      impoverished arms and found posterior variance does carry information beyond
      the validity mask (fc-008) — distinguishably, on both primary metrics, and
      small: the mask is worth 65x more than the variance on median error, and a
      policy knowing only where the data is recovers 97.3% of the median benefit.
      That is a weak positive. It is still a positive, and it is repeatable.
      ACQUISITION IS MEASURED ONCE, WITH A CONTROLLER THAT CANNOT STEER. exp003
      measured verging-to-acquire as worse than not verging on every axis except
      coverage (fc-010) — but fc-010's own `mechanism` field localises the failure
      to the estimator, not to the act.
      A weak measured positive and a single measurement made with a broken
      instrument are different states of knowledge, and this decision reflects the
      difference. It develops the branch that has evidence, and it does not
      convert the absence of a working instrument into evidence against the branch
      that lacked one.
    the_plant_is_untested_not_refuted: >-
      READ THIS BEFORE CITING fc-010 AGAINST A PLANT. fc-010 is evidence about ONE
      VERGENCE ESTIMATOR, and that estimator PROVABLY cannot produce the signal a
      plant would need.
      The proof is structural, not statistical, and it is in fc-010's `mechanism`:
      ActiveStereo.vergence estimates fixation disparity as the median of d_sub
      over VALID pixels in a foveal window. A pixel whose true disparity lies
      outside the window generally fails validity and is excluded from that
      median, so the estimate is confined to the window's interior BY
      CONSTRUCTION. It can report a value; it cannot report "too near" or "too
      far". The measured instance: at window [8,12] with the near card at 18.96 px
      only 41.8% of pixels survive and their median d_sub reads 10.32, and at seed
      0 fixations 5-7 the controller verged AWAY from the target, 10.0 -> 7.9 ->
      5.95.
      An actuator commanded by a signal that cannot carry a sign is not a test of
      actuation. So fc-010 is not evidence about mechanical actuation as such, and
      this foreclosure does not treat it as any.
      WHY THIS IS SPELLED OUT RATHER THAN ASSUMED: writing fc-010 into the ledger
      as evidence against plants would repeat the exact overstatement fc-009's
      amendment already had to correct once — a measurement recorded as bearing on
      a question it does not bear on. It was corrected there in place; it is
      pre-empted here.
    retest_condition: >-
      od-003, which is pointed at rather than restated. It records what evidence
      would reopen the vergence question and what it would cost, and duplicating
      its terms here would create a second copy to keep in step with it.
    agrees_with: >-
      fv-007-1, which recorded at b77b24e that exp003's falsifier did not fire on
      its stated condition and that "THE STATED CONSEQUENCE IS NOT INVOKED... this
      does not by itself direct step 10 toward the attentional branch. The
      measured outcome bears on the same decision and is recorded as od-003 rather
      than deciding it here."
      This foreclosure is the decision fv-007-1 declined to take on that evidence,
      taken now by the maintainer, on a stated asymmetry, and NOT on the falsifier
      firing. The two entries agree: the falsifier did not license this, and this
      does not claim it did. fv-007-1 carries a reciprocal pointer back to here.
    forecloses_nothing_downstream: >-
      AN ATTENTIONAL L5 MUST NOT MAKE A PLANT UNREPRESENTABLE. This closes a
      branch of development, not a region of design space, and the difference has
      to survive into the code or the foreclosure will quietly become structural.
      CONCRETELY, AND THIS IS THE TESTABLE PART: no assumption that sensory data
      is FIXED ACROSS FIXATIONS may be baked into any interface. An interface that
      takes the image pair once and then serves fixations out of it forever is
      cheap to write, is adequate for every experiment run so far, and would make
      a plant unrepresentable without anyone deciding that it should be. exp003's
      arm V is the existing counter-example: it re-runs the front end every
      fixation, and it is the first arm in either repository in which an action
      changes what data exists.
      So the shape to preserve is the one arm V already needs. Any interface added
      after this foreclosure must be able to express "the data changed because the
      system moved", whether or not anything currently moves.
    cost_to_reopen: >-
      Low as a decision, and that is the point of recording it this way: nothing
      is being built that a plant would have to be dug out of. Reopening it needs
      the retest in od-003, not an unwinding of work.
    decided_in: >-
      docs/state.yaml, this entry. There is no findings file because there was no
      run: this is a maintainer's decision on the evidence already in the ledger,
      not a result. fc-007, fc-008 and fc-010 were each decided in an
      experiment's findings; this one is not, and the difference is visible here
      rather than inferred.
    unaffected_by_exp007: >-
      exp007 re-ran V against W on a rendered stimulus and V did NOT reverse — it
      is distinguishably worse there too (bio-039). So nothing in exp007 bears on
      whether a mechanical plant is testable, and this entry's framing — the plant
      UNTESTED, NOT REFUTED — stands exactly as written.
      Recorded because the exp007 specification anticipated the other outcome: had
      V-vs-W reversed, this framing would have become more clearly right. It did
      not, and the framing is unchanged rather than strengthened. od-003 untouched.
    not_band_checked: >-
      Like fc-010, and for the same reason: see am-004.
    vocabulary_note: >-
      "L5" IS CHAT-SURFACE VOCABULARY AND IS NOT DEFINED IN THIS REPOSITORY. The
      layer numbering belongs to the framework document the maintainer holds; the
      only other place it surfaces here is fc-007's `does_not_close`, on the
      L6-to-L1 interface. Recorded so that a session finding "L5" here does not go
      looking for a definition that is not in the tree. The clause that this
      repository can actually check is `forecloses_nothing_downstream`.

# ------------------------------------------------------------------------------
# FALSIFIER VERDICTS
#
# Every specification carries a falsifier (docs/workflow.md). A verdict that
# lives only in a pull-request body is not in the tree and a cold session cannot
# read it — and by this repository's own argument, a verdict with no durable
# record cannot be checked, which is the same defect as a specification with no
# falsifier. They are recorded here, with the numbers, whichever way they came
# out.
# ------------------------------------------------------------------------------
falsifier_verdicts:

  - iteration: 2
    id: fv-002-1
    falsifier: >-
      If a substantial fraction of carried measurements cannot be given recoverable
      provenance — no SHA, no config, no n — then "data with provenance" is not
