  # --- PLAN: intent, from Chat, NOT established here ---------------------------
  plan:
    source: chat
    standing: >-
      NOT ESTABLISHED IN THIS REPOSITORY. Supplied from the Chat surface, where it
      lives as a document in the maintainer's hands. Nothing here measures or
      pins it. Treat it as a prior, exactly as an `inherited` entry in
      docs/inherited-measurements.yaml is treated — usable, and an assumption
      whenever it is relied on.
    amended: twice in seven iterations, and expected to be amended again
    staleness:
      last_amended_commit: 19d2723
      rule: >-
        STALE IF AN AMENDMENT HAS BEEN TAKEN SINCE `last_amended_commit` AND IS
        NOT RECORDED BELOW. This half is the one that can rot silently — it is
        not derivable from anything here, so nothing in the repository
        contradicts it when it goes wrong.
        The marker is the last commit that CHANGED THE PLAN, not the last merge.
        Merges that do not touch the plan do not make it stale, which is why this
        will not fire spuriously — and why, unlike the rule it replaces, it can
        be passed.
      checking: >-
        Two steps, because this file changes for many reasons and only some of
        them are amendments.
          (1) `git log <last_amended_commit>..main -- docs/state.yaml` lists
              commits that touched the file at all. Most will not have touched the
              plan — the commit that wrote this rule did not.
          (2) For any that did, compare `sequence.plan` between the two revisions.
              ONLY a change to a step, a stage, or `amendments` bumps
              `last_amended_commit`. A change to any other part of this file,
              including this rule itself, does not make the plan stale.
        One clause is not answerable from the repository at all: whether the
        maintainer has taken an amendment that was never recorded here. No marker
        can close that, and it is exactly what `source: chat` is warning about.
    stages:

      - stage: 0
        name: Scaffold
        steps:
          - {n: 1, title: Audit the active-stereo structure, altitude: infra, status: complete}
          - {n: 2, title: Decide how carried results are held, altitude: infra, status: complete}
          - {n: 3, title: Adapt the methodology files, altitude: infra, status: complete}
          - {n: 4, title: Generate the general research scaffold, altitude: infra, status: complete}
          - n: 5
            title: Create the template repository
            altitude: infra
            status: deferred
            deferred_until: the end of Stage 0
            note: See amendment am-001.
          - n: 6
            title: Update the research description for bio-3d-vision
            altitude: infra
            status: deferred
            deferred_until: the loop runs
            note: >-
              A description written before the loop runs describes an intention.
              Deferred until there is something to describe.
          - {n: 7, title: Create the project repository, altitude: infra, status: complete}

      - stage: 1
        name: Gradient before infrastructure
        steps:
          - n: 8
            title: Port the bioeye loop, the analytic fixture, and the four-panel figure
            altitude: infra
            status: complete
          - n: 9
            title: "First framework foreclosure: variance versus expected information gain"
            altitude: fw
            status: complete
            outcome: fc-007, extended by fc-008
          - n: 10
            title: Decide the plant
            altitude: fw
            status: complete
            outcome: fc-011
            note: See amendment am-002, and its correction am-002-c.
            correction: >-
              THIS ENTRY PREVIOUSLY READ `status: complete` WITH `outcome:
              fc-010`. Both were false, and neither was ever derivable from the
              ledger. fc-010 closes NARROWING THE DISPARITY SEARCH WINDOW in
              favour of the wide search the port already does; none of its eleven
              fields mentions the plant, and its own `scope` field says "THIS IS A
              RESULT ABOUT THE PORTED CONTROLLER, NOT ABOUT VERGENCE".
              fv-007-1, in this same file and predating the claim, had already
              recorded that its stated consequence "IS NOT INVOKED... this does
              not by itself direct step 10 toward the attentional branch. The
              measured outcome bears on the same decision and is recorded as
              od-003 rather than deciding it here."
              So the file contradicted itself, and the half that was wrong is this
              one. Corrected here to the state the ledger actually supports.

      - stage: 2
        name: Rendering
        steps:
          - n: 11
            title: Migrate the Blender rendering code
            altitude: infra
            status: complete
            outcome: >-
              A rendered stereo pair reaches the loop. 349 code lines in two
              modules split at the testability boundary; fv-011-1a and
              fv-011-1b both pass, the second against a real Blender 5.2.
              Labelled infrastructure: it moved no measurement about vision and
              closed no open decision. od-002 is untouched.
            why_it_sits_here: >-
              ITS ALTITUDE IS infra, BUT IT IS NOT INFRASTRUCTURE MIGRATED ON
              FAITH. Three foreclosures — fc-007, fc-008 and fc-010 — are each
              limited by gap-010: this fixture has no true half-occlusions, so
              every one of them holds for a stimulus without them and no further.
              od-002 names Blender as the only instrument in this repository able
              to produce a stimulus with a controlled contrast axis at occlusion
              boundaries, which is what would lift that limit.
              That is why Blender moved from step 7 to step 11: it is not being
              migrated because a plan says so, but because three standing
              foreclosures cannot be tested past their limit without it.
          - n: 12
            title: Test rendering against the loop
            altitude: geom
            status: complete
            outcome: >-
              exp004. The scene model reproduces the fixture's left image to
              2.5e-4 and its depth map bit-identically. Away from depth
              discontinuities the sources agree; at them they diverge by 48x the
              bar, with the RENDER BETTER — the direction the specification did
              not predict. fv-012-1 fired at a knife-edge and is located in the
              policy path, not the render path.
          - {n: 13, title: Adapt the static pipeline to Blender rendering, altitude: geom, status: next}
          - {n: 14, title: Reproduce the static-scene result on Blender data, altitude: geom, status: planned}

      - stage: 3
        name: Geometry and results
        steps:
          - n: 15
            title: Migrate the active-stereo geometry, in ray form
            altitude: geom
            status: complete
            outcome: >-
              src/bio3dvision/oculomotor.py. The stereo rig no longer carries a
              sensor: StereoRig is baseline and capture vergence, and the focal
              length and principal point stay in the SamplingModel. All 37 ported
              tests are stated with no intrinsic anywhere in their bodies.
              fc-009's falsifier 2 is ANSWERED — additive, and not eliminating.
            taken_out_of_order: >-
              Steps 13 and 14 are still `next`/`planned`; see am-005 for what
              remains of them. Position clause (2) is unaffected: `next` is still
              13, the lowest step that is neither complete nor deferred.
          - {n: 16, title: Incorporate the carried results, altitude: geom, status: planned}

      - stage: 4
        name: The loop
        steps:
          - n: 17
            title: Build and test the active loop
            altitude: fw
            status: planned
            status_note: >-
              LEFT `planned` DELIBERATELY, AND IT IS NOT UNSTARTED. Built and
              tested across 17a (the head-frame belief), 17a-fix (its frame),
              17b (gaze-contingent rendering) and 17c (rectify in the camera,
              then close the loop), all merged, with exp010 measuring the closed
              loop against a matched open arm. See am-008 for what was done and
              what remains; the remainder is why this is not `complete`.
            outcome: >-
              THE LOOP RUNS. exp010 moves the eye, re-renders at each fixation and
              fuses across saccades into a persistent head-frame belief — the first
              time in either repository that an action changes the sensory data.
              Outcome (a): CLOSED beats OPEN in 8/8 seeds on the cells both measure
              (fv-020, bio-066..bio-069), and NOT at depth discontinuities.
              Preceded by fc-012, taken alone before anything was built.
          - {n: 18, title: Prototype the omnidirectional rig in Blender, altitude: fw, status: planned}

    amendments:
      - id: am-001
        moved: step 5, Create the template repository
        from: its numbered position
        to: after step 7, deferred to the end of Stage 0
        reason: >-
          A template extracted from a working instance is an OBSERVATION; one
          built first is a GUESS. The template is extracted after this repository
          works, not designed before it.
      - id: am-002
        moved: step 10, Decide the plant
        from: its numbered position
        to: after the acquisition experiment (exp003)
        reason: >-
          A foreclosure taken without evidence is a guess carrying a decision's
          authority. The plant is decided after the acquisition experiment
          (exp003) rather than ahead of it.
        reason_amended: >-
          CORRECTED IN PLACE. The second half of this reason previously read "The
          plant was decided on measurement — fc-010 — rather than ahead of it, and
          od-003 records precisely what evidence would reopen it." THE REORDERING
          THIS AMENDMENT RECORDS IS REAL AND STANDS; the claim appended to it was
          not.
          fc-010 is about the disparity search window, not the plant. Deciding the
          plant on it would be exactly the substitution this amendment's own first
          sentence warns against — a decision drawing authority from a measurement
          that does not bear on it. od-003 is real and does record what would
          reopen the vergence question, but it is a retest condition for one
          estimator, not the evidence that a plant question was settled.
          What actually happened is recorded as am-002-c below.
      - id: am-002-c
        corrects: am-002
        what_was_inserted: >-
          `sequence.plan` step 10 was marked complete with outcome fc-010, and
          `sequence.position` listed 10 in `complete` with a matching `evidence`
          line, in 19d2723.
        who_and_how: >-
          NOT THE PLAN RUNNING AHEAD OF THE LEDGER — AN UNEARNED CLAIM INSERTED
          INTO THE PLAN. It was a Chat-surface decision supplied to the session
          that wrote the sequence block as though it were already established, and
          it was written into the `position` half, which is the half whose whole
          standing is that everything in it is DERIVABLE. Nothing in the ledger
          ever derived it.
          The distinction matters because the two failures have different fixes. A
          plan running ahead of the ledger is corrected by waiting; a claim
          inserted into the derivable half is corrected by deleting it and by
          asking why the derivation check passed. Both are done here — see
          `position.checking_amended`.
        why_it_is_recorded: >-
          `plan` is already labelled `source: chat` and `standing: NOT ESTABLISHED
          IN THIS REPOSITORY`, and that label did its job for the plan half. It
          did not protect the `position` half, which carries the opposite label.
          A claim that crosses from the first into the second loses its warning
          without losing its origin, and nothing in the file marked the crossing.

      - id: am-003
        moved: step 13, Adapt the static pipeline to Blender rendering
        from: next, immediately after step 12
        to: after exp005, an unplanned stratified re-analysis
        reason: >-
          NOT IN THE SEQUENCE WHEN IT WAS RUN, and recorded here because a step
          was deferred for it. exp004 measured that the fixture's error at depth
          discontinuities is 22.7x worse than a render of the same geometry, which
          raised the question of whether exp001's and exp002's effect sizes had
          been measured through an artefact floor. Step 13 builds the static
          pipeline on Blender and would have inherited those results; better to
          know whether they were load-bearing or floor-limited before building on
          them.
        outcome: >-
          Answered, and not in the direction that motivated the deferral. The floor
          is real and policy-invariant (bio-032) but it did not attenuate the
          effects — it carried them (bio-033). fc-007 stands and is strengthened;
          fc-008 is qualified as to where its evidence comes from; fc-010 is
          untouched. No foreclosure was reversed. Step 13 is unblocked.

      - id: am-004
        moved: exp006, the stratified re-analysis of exp003
        from: specified
        to: deliberately not run
        reason: >-
          exp007 answers the same question on a stimulus WITHOUT the artefact,
          which is strictly better evidence than re-scoring the artefact-ridden
          one — and it did: V is distinguishably worse than W on rendered data on
          both metrics (bio-039).
          And fc-010's MECHANISM does not depend on the outcome. The ported
          vergence estimator takes the median of d_sub over VALID pixels in a
          foveal window, so a target outside the window is excluded from its own
          error signal: the pixels carrying it are exactly the pixels validity
          deletes. That is geometric, and no re-scoring of which pixels are
          counted changes it.
        consequence: >-
          fc-010 AND fc-011 ARE NOT BAND-CHECKED, while fc-007 and fc-008 are.
          Recorded on both entries so the asymmetry is visible to a cold session
          rather than inferred from the absence of an exp006.
      - id: am-005
        moved: steps 13 and 14
        from: planned, next after step 12
        to: substantially satisfied by exp004, with a remainder stated
        reason: >-
          Step 13 is "adapt the static pipeline to Blender rendering" and step 14
          is "reproduce the static-scene result on Blender data". exp004 built the
          scene model, rendered through it, and ran the ported loop on both
          sources; exp007 then ran six arms on both. Between them the pipeline is
          adapted and the static result is reproduced.
        what_remains: >-
          NOT MARKED COMPLETE BY ASSERTION, because two things in their titles have
          not been done.
          Step 13: nothing consumes a render except an experiment runner. There is
          no scene registry, no configuration path, and run_baseline still calls
          make_synthetic_scene directly — bio3dvision.run_baseline cannot be
          pointed at a render. Whether that plumbing is wanted at all is now a
          question rather than a plan, since two experiments have run without it.
          Step 14: exp007 reproduced the POLICY COMPARISONS on rendered data, not
          the ported baseline's own trajectory numbers (bio-001..bio-008). Those
          are pinned as tests against the fixture and have no rendered counterpart.
          Reproducing them on a render would be a different measurement — the
          scene is the same but the stimulus is not — and no one has asked for it.
        status_left_as: >-
          Both remain `next`/`planned` in the plan half rather than being marked
          complete. The plan is intent and this amendment is a record of what the
          intent now looks like against what exists.

      - id: am-006
        moved: step 15, Migrate the active-stereo geometry in ray form
        from: the next numbered work after step 12
        to: displaced by exp008, an occlusion sweep that is not one of the eighteen steps
        origin: >-
          THE CHAT SURFACE, not this repository. exp008 was specified there and is
          not derivable from the plan; recorded as such so a cold session does not
          look for it among the steps.
        reason: >-
          exp007 measured E-vs-A' at 9.04x bar on p90 on a stimulus with ~2%
          occluded surface, against the fixture's pooled 1.85x. Occlusion fraction
          was therefore a live variable that had never been swept, and every
          question after this one — acquisition, the closed loop, the contrast
          axis — would be asked on some stimulus whose occlusion fraction nobody
          had characterised.
        the_counter_case_argued_and_set_aside: >-
          BUILD THE LOOP RATHER THAN MEASURE THE STIMULUS FURTHER. Four iterations
          in a row had by then gone to the stimulus — exp004 built the scene model,
          exp005 re-scored the fixture, exp007 swept policies on rendered data, and
          exp008 sweeps geometry. None of them ran a closed loop, which is what
          this project exists to do and what its predecessors never did. The
          counter-case is that a fifth stimulus iteration is exactly the failure
          fc-005 names: perfect components accumulating around a loop that has
          never run.
          It was set aside on the argument that asking a more expensive question on
          an uncalibrated stimulus would repeat the previous four iterations'
          discovery at higher cost.
          THE COUNTER-CASE IS RECORDED BECAUSE IT MAY HAVE BEEN RIGHT. exp008's
          answer — an optimum near 9% and saturation by 17% — is useful, but it is
          a fact about stimuli, and the fifth consecutive iteration to produce one.
          A cold session should see the fork, not only the path taken.
        consequence: >-
          Step 15 remains `planned` and is now the longest-deferred numbered work.
          fc-009 records that its cost estimate is UNTESTED and will be tested by
          the first commit in which a geometry layer consumes a ray directly. That
          commit has still not happened.

      - id: am-007
        corrects: step 17a's frame choice
        what_was_wrong: >-
          The head-frame belief was tied to rectification_rotation, which zeroes
          azimuth AND vergence by construction. That makes it a RECTIFIER frame,
          not a head frame. Across a 17 degree azimuth saccade the mapping moved
          ZERO cells while the world direction each cell views moved 17 degrees, so
          one cell received measurements of unrelated directions and fused them
          (bio-053). A correctness fault, not a cost.
        how_it_survived: >-
          THIS IS THE PART WORTH THE RECORD. 17a's own reproject docstring described
          the azimuth-invariance and called it "a real limitation of this operator",
          and a test asserted it. Every 17a control either held the eyes fixed or
          varied elevation alone; there was NO test in which azimuth changed and
          something was REQUIRED to move.
          AN HONEST DESCRIPTION OF A DEFECT IS NOT THE SAME AS NOTICING IT IS ONE.
          The defect was documented, tested, reviewed and merged as a property.
        how_it_was_caught: >-
          17b priced it: 0.0% grid loss for azimuth at EVERY amplitude, against
          26-77% for elevation. A number that implausible is what made it visible,
          which is an argument for measuring a consequence even when the mechanism
          is believed understood.
        the_fix: >-
          Reproject through eye_rotations by the RELATIVE rotation between the
          anchor fixation's eye orientation and the current one. The anchor makes
          the map exactly the identity at the origin, preserving the fixed-eye
          control, while azimuth and vergence enter everywhere else (bio-054).
        also_recorded: >-
          17a's specification framed the discretisation as a choice to be stated
          with its cost, and the cost that surfaced was a wrong answer. Recorded so
          a later session reading 17a's confident docstring finds the correction
          attached to it.

      - id: am-008
        moved: step 17, Build and test the active loop
        from: planned, the centrepiece of Stage 4
        to: substantially satisfied by 17a, 17a-fix, 17b, 17c and exp010, with a remainder stated
        origin: >-
          THE CHAT SURFACE. The 17a/17b/17c subdivision is not one of the eighteen
          steps and is recorded in `position.out_of_sequence`, not here.
        reason: >-
          Step 17 is "build and test the active loop". It is built: belief.py holds
          a head-frame belief with reprojection, scene_model.rectified_camera_poses
          renders a rectified pair that follows the gaze, and
          experiments/exp010_closed_loop/run.py runs the loop — choose from the
          belief, saccade, re-render, re-match, fuse, repeat. It is tested: B0 is
          bit-identical at Fixation(0, 0, 0), the azimuth falsifier B0 could not
          catch is carried beside it, and exp010 measures the closed arm against a
          matched open one over 8 seeds and 40 fixations.
          RECONCILED BECAUSE THE PLAN'S CENTREPIECE READ `planned` WHILE THE LOOP
          RAN. A cold session deriving position from the plan half would have taken
          the thing this project exists to do as unstarted.
        what_remains: >-
          NOT MARKED COMPLETE BY ASSERTION, because three things have not been done
          and one of them was named as step 17's own work.
          THE ANGULAR FOVEAL WEIGHT, which is the named one. Step 15 recorded that
          eliminating the sample index "needs a foveal weight defined on ANGLE.
          That is step 17/18 work." It was not built at 17a — fc-009's note says so
          — and exp010 confirms it is still pixel-native at 17c:
          ActiveStereo._fovea_weight is a Gaussian in row and column and
          ActiveStereo.vergence takes a median over a square pixel window. So a ray
          still cannot drive the loop without a sensor to land it on, which is the
          exact property step 15 predicted step 17 would remove.
          NOTHING IN src/ CLOSES THE LOOP. The only code that fuses across fixations
          is experiments/exp010_closed_loop/run.py — verified by search: `.fuse(`
          appears there, in two tests, and nowhere in src/. run_baseline still runs
          the open loop on the fixture, ActiveStereo.run is the open loop, and
          HeadFrameBelief is exported but used by no library code. This is the same
          shape as am-005's step-13 remainder and is recorded the same way.
          THE FRAME CONVERSION LIVES IN THE RUNNER TOO. ActiveStereo returns planar
          z in the rectified frame AT THE MEASURING FIXATION, which is
          fixation-dependent, so fusing it across fixations fuses different
          quantities. exp010 converts to range from the cyclopean origin before
          fusing; HeadFrameBelief itself was NOT changed and still fuses whatever it
          is handed. Any future caller that fuses ActiveStereo's output directly
          across fixations reintroduces the defect.
        status_left_as: >-
          `planned` in the plan half, with a status_note and an outcome attached.
          position.complete is UNCHANGED and does not gain 17: that half claims to
          be derivable from the ledger, and 17 is not complete. Position clause (2)
          is unaffected — `next` is still 13, the lowest step that is neither
          complete nor deferred.
          The work itself is recorded in position.out_of_sequence, which is where a
          cold session finding fv-017..fv-020 or bio-047..bio-069 is told to look.

# ------------------------------------------------------------------------------
# WHAT RUNS
# ------------------------------------------------------------------------------
runs:
  summary: >-
    The ported baseline runs. It is the predecessor's loop, verified bit-identical
    to it, on the predecessor's analytic fixture, producing the predecessor's
    four-panel figure. No new science: this is a measured starting point, not a
    result.
  entry_points:
    - call: bio3dvision.run_baseline(steps=18, seed=0)
      does: >-
        Draws the analytic fixture, runs the block matcher once, then N fixations
        of the active loop, and returns the engine, history and panel arrays.
      cost: ~0.08 s for 18 steps
    - call: bio3dvision.save_result_fig(engine, depth_gt, history, out=None)
      does: Renders the four panels to results/fig_result.png and returns their data.
  library:
    package: bio3dvision
    modules: [fixture, matching, loop, figure, baseline, policy, sampling, acquisition,
              blender_render, blender_load, scene_model, oculomotor, belief]
    lines: 3851
    policies: [A, A_prime, B, C, D, E]
    sampling: >-
      SamplingModel Protocol with PinholeSampling; sits in front of ActiveStereo,
      not inside it. Uniform configuration is the identity (fc-009).
    public_api: [ActiveStereo, BaselineRun, CameraParams, PanelArrays, cost_volume,
                 decode_disparity, error_summary, front_end_block, lr_consistency,
                 make_synthetic_scene, panel_arrays, run_baseline, save_result_fig,
                 scale_to_depth, true_disparity]
    note: Still flat. Zero subpackages. See fc-002 and falsifier fv-003-2.
  test_suite:
    exists: true
    count: 208
    count_note: >-
      192 run everywhere; 16 need the optional `blender` extra and skip without it.
      CI installs the extra so those 8 run there — falsifier 1a is the only check
      of the render path that needs no Blender binary, and skipping it in CI would
      have left the path unverified in the one place it is always checked. THREE
      of the 8 additionally need a Blender BINARY (the falsifier 1b tests) and
      skip on the runner, with a reason naming what is unverified.
    measured_in_ci: >-
      75 passed, 3 skipped on both 3.12 and 3.13 at 35d5f50, when the suite was
      78. Recorded because it is the number that says how much of the render path
      CI actually covers, and because the count was first written here as two —
      corrected against the run rather than against the guess. The step-12 figure
      is pending this branch's first CI run.
    count_corrected: >-
      Read 27 until this commit, and had been wrong for some time — 27 is neither
      the collected node count (69) nor the number of test functions (60). The
      difference between those two is parametrisation, not missing tests.
      Measured rather than counted by hand: `pytest --collect-only -q`. A stale
      number in the file that describes what runs is a small defect with a large
      shape — this is the channel a cold session trusts without checking.
    test_functions: 60
    environment_last_run: {python: 3.13.15, numpy: 2.5.2, scipy: 1.18.1, matplotlib: 3.11.1}
    what_it_covers: >-
      The scaffold guards; the fixture's determinism and its lack of true
      half-occlusions (gap-010); the ported trajectory, the lockup and its
      per-pixel mechanism; the control/measurement boundary; and the four-panel
      figure's reproducibility under a fixed seed.
  loop:
    exists: true
    status: ported, faithful, with three known defects carried deliberately
    defects_carried:
      - "1e3 variance sentinel instead of nan - a convention this repository rejects"
      - "gaussian_filter over np.where(valid, var, 0.0) in the gaze policy - mixing before masking"
      - "no inhibition of return - the loop locks onto one pixel for its last 10 of 18 steps (bio-002)"
    note: >-
      Deviations are later commits, one at a time, each reporting its effect on the
      trajectory. They are decisions, not cleanups. Nothing here is step 9.
  experiments:
    - id: exp001_gaze_objective
      question: Does the gaze objective matter, once revisiting is controlled for?
      answer: No, on this fixture. See foreclosure fc-007.
      pre_registered: 19aee2a, committed alone before any arm was run
      amended: >-
        By exp002, by addition: its C_vs_B verdict flips with 16 seeds (bio-018),
        and its scope is narrower than it read — a null about the choice among
        variance-derived objectives, not about saliency.
    - id: exp002_saliency_value
      question: >-
        Does posterior variance carry information beyond the validity mask?
      answer: >-
        Yes, but barely. Mask-only coverage is distinguishably worse than
        variance-driven allocation, so variance is not empty (fc-008) — but the
        mask is worth 65x more than the variance on median error. See fc-008.
      pre_registered: 9179a55, committed alone before the runner existed
    - id: exp003_vergence_acquisition
      question: >-
        Does acquisition — an action that changes what data exists — buy
        anything, and does the gain require acting or merely narrowing?
      answer: >-
        It costs. Narrowing the search window makes the shared pixels 7.5x worse
        whether or not the loop re-centres it, and re-centring costs 2.6x the
        hypotheses to buy 21.7% more coverage of pixels whose error is 16x the
        baseline's. See fc-010, and od-003 for what the failure is attributable to.
      pre_registered: 4456337, committed alone before the runner existed
      first_closed_loop: >-
        Arm V re-runs the front end every fixation — the first arm in either
        repository in which an action changes what data exists.
    - id: exp004_scene_model_check
      question: >-
        Does a Blender render of the analytic fixture's geometry behave like the
        fixture where the model says it must, and differ where it says it must?
      answer: >-
        Yes away from depth discontinuities — the matcher's output there is
        IDENTICAL on the two sources. At discontinuities they diverge by 48x the
        bar on p90, and THE RENDER IS BETTER, which is the direction the
        specification did not predict. The fixture's reflect-warp produces 5x the
        rate of confident gross matching errors that a real render of the same
        geometry does. See fv-012-1, fv-012-2 and bio-029.
      pre_registered: d048442, committed alone before the runner existed
      is_not: >-
        A result about vision, and not a measurement of gap-010. One scene, one
        texture family, 8 seeds, no contrast control. It closes nothing and
        annotates no foreclosure.

    - id: exp005_stratified_reanalysis
      question: >-
        Were exp001's and exp002's effect sizes measured through the artefact
        floor exp004 found at depth discontinuities?
      answer: >-
        NO, AND THE OPPOSITE. The floor is real and policy-invariant — six arms
        agree on p90 at discontinuities to 1.40%, and their largest mutual
        difference is smaller than the materiality floor (bio-032). But it did not
        attenuate the effects; it carried them. Effect sizes SHRINK away from
        discontinuities, monotonically for the two comparisons behind fc-008, and
        four verdicts flip from distinguishable to indistinguishable. Neither
        declared falsifier fired: one required the verdicts to match, the other
        required them to grow.
      pre_registered: 0fe1d03, committed alone before the runner existed
      is_not: >-
        A new experiment. Same arms, seeds, budgets and bar as the originals; the
        only change is the pixel set scored. POOLED reproduces exp001's stored
        metrics exactly, which is what licenses the rest.
      changed_no_foreclosure: >-
        fc-007 annotated (stands, strengthened), fc-008 annotated (qualified as to
        where its evidence comes from), fc-010 untouched. gap-010 not lifted,
        od-002 not touched.

    - id: exp007_rendered_policy_sweep
      question: >-
        Do the policy comparisons behave the same way on a rendered stimulus
        without the fixture's discontinuity artefact?
      answer: >-
        YES, AND THEY MATCH THE ORIGINALS' POOLED FIGURES RATHER THAN exp005'S
        BANDED ONES. Of eight comparison-metrics, four came out (a), three (a=b),
        one (c); outcome (b) never occurred and NO COMPARISON REVERSED DIRECTION.
        In all three cases where the pooled and AWAY references disagreed, the
        rendered stimulus went with pooled.
        The reason is bio-037: the policy differences live at depth discontinuities
        on the RENDERED stimulus too, so exp005's AWAY band removed the artefact
        and the signal together. The artefact inflated the magnitude of the error
        there; it did not manufacture the difference.
      pre_registered: c744f69, committed alone before the runner existed
      predictions_were_wrong: >-
        Four of eight. The pre-registration followed exp005's reading and predicted
        outcome (b) for E-vs-A' on both metrics and A-vs-A' on median, and (d) for
        E-vs-A' on p90. All four came out (a) or (c). Recorded because a
        pre-registration whose predictions are never checked is decoration.
      changed_no_foreclosure: >-
        fc-008 annotated (confirmed on rendered data; exp005's qualification does
        not survive), fc-007 annotated (supported indirectly, its own null still
        untested on rendered data), fc-010 annotated (survives its first
        independent test), fc-011 annotated (unaffected — V-vs-W did not reverse).
        gap-010 not lifted, od-002 and od-003 not touched.

    - id: exp008_occlusion_sweep
      question: >-
        Does the value of variance-driven allocation scale with the fraction of
        geometrically unmeasurable surface?
      answer: >-
        NOT AS A SLOPE. Outcome (d): non-monotone, with an OPTIMUM near 8.84%
        occluded surface and a COLLAPSE by 17.16%, where a blind raster and a
        variance-driven policy read p90 within 0.0165 m of each other. The common
        value ~1.49 m is the prior — 3.0 m against a 4.5 m background — so every
        policy leaves most of the frame unmeasured and none can distinguish itself.
        D-versus-E is the one monotone series and it DECREASES: the validity mask's
        worth falls as occlusion rises.
      pre_registered: 96e8e45, committed alone before the runner existed
      is_instrument_calibration: >-
        The result sizes future stimuli rather than answering a question about
        vision. It also corrected exp007's headline: the 5.09% "lateral overlap"
        there is about 61% frame border, and genuine occlusion in that stimulus is
        1.97% (bio-040).
      changed_no_foreclosure: >-
        gap-010 annotated with the occlusion fraction a rendered stimulus needs,
        not closed. od-002's stale why_not_scheduled corrected — both conditions it
        named had been met. fc-008 annotated via bio-042 as to the range its 65:1
        ratio was measured in. od-003 untouched, no policy changed.

    - id: exp009_epipolar_cost
      question: >-
        What does the epipolar violation cost when a toed-in pair is matched in 2-D
        instead of rectified, and is the vertical disparity measurable at all?
      answer: >-
        OUTCOME (b), EVERYWHERE AND SMALL. Matching the toed-in pair costs
        1.7-10.9 mm of median range error on a 2.4-4.5 m scene — clearing exp001's
        bar in all fifteen cells because it is extremely reproducible (seed sd
        0.1-1.6 mm), and at worst 0.4% of range. Concentrated AT discontinuities
        (ratio to 2.26), modest AWAY (1.14-1.60). Coverage costs 8-9 points once
        the fixture's finite extent is divided out. Vertical disparity IS
        recoverable on axis away from edges (corr +0.878) and decays to noise by
        az 0.20; its residual sits at the integer quantisation floor, so that is a
        lower bound. The 2-D matcher costs 0.188 s against a 0.57 s render, so the
        loop STAYS RENDER-BOUND.
      pre_registered: 8ddd4d4, committed alone before the runner existed
      is_instrument_calibration: >-
        Partly. It measures a property of the matcher, not of vision, and it exists
        to put a number on a decision 17c cannot avoid. It also found a THIRD
        latent assumption in the ported matcher (bio-057) and corrected its own
        preregistration's d_v table (bio-058).
      changed_no_foreclosure: >-
        NOTHING. No foreclosure taken, none annotated, none reversed. od-002 and
        od-003 untouched, no policy changed, no default adopted, no 17c. The
        decision this measured for is the maintainer's.

    - id: exp010_closed_loop
      question: >-
        Does re-acquiring beat re-weighting? Two arms differing in exactly one
        thing: whether the proposed saccade is executed.
      answer: >-
        OUTCOME (a). CLOSED beats OPEN in 8/8 seeds on the cells both measure —
        POOLED median 0.0146 m against 0.0258, x_bar 1.37 — and NOT at depth
        discontinuities, where both metrics are indistinguishable and AT p90 is
        nominally worse. The effect is on the smooth interior: MIDDLE p90 x_bar
        5.70, AWAY median 4.26. Coverage is a separate and larger effect, 0.928 of
        the belief measured against 0.622. It costs 41x, and it keeps NO cell on
        the sensor across a whole run.
      pre_registered: 9468833, committed alone before the runner existed
      is_instrument_calibration: >-
        No. This is the question the repository exists to ask, and it is the first
        time either repository has asked it. Both predecessors built the components
        and neither ran the loop.
      changed_no_foreclosure: >-
        The experiment took none. fc-012 was taken separately and BEFORE it, on
        exp009's evidence, as its own commit. od-002 and od-003 untouched, no policy
        changed. gap-001's contrast axis is still absent.

    - id: exp011_consolidation
      question: >-
        Does the AT effect survive more seeds, does the gain scale with occlusion,
        and is the coverage gain the larger result?
      answer: >-
        (b), (c), and COVERAGE. AT stays indistinguishable at 24 seeds and moves the
        wrong way (0.96 -> 0.91) because the bar is a sample sd with no 1/sqrt(n) —
        and EVERY band's x_bar fell, correcting exp010's confidence. The accuracy
        gain PEAKS at 8.84% occlusion, the same level exp008 found allocation
        sharpest, and falls at 17.16%. The coverage gain is 33x to 341x the accuracy
        gain and, unlike it, does not vary with occlusion at all.
      pre_registered: 1c1ab23, committed alone before the runner existed
      is_instrument_calibration: >-
        Partly, and usefully so. Its sharpest finding is about exp001's bar rather
        than about vision: an effect favoured by 23 of 24 seeds can sit below a bar
        that is one standard deviation of the per-seed differences. That sizes every
        verdict this repository has taken.
      changed_no_foreclosure: >-
        None taken, none reversed. od-002 and od-003 untouched. The pixel-native
        foveal weight and fc-010's vergence estimator were carried unchanged. It
        annotates bio-066 rather than overturning it — exp010's verdicts stand with
        smaller margins.

    - id: exp012_bar_reanalysis
      question: >-
        What did exp001's bar cost, across every verdict this repository has taken
        — and what else walked in from the predecessor without being examined?
      answer: >-
        THE FINDING IS exp011's AT BAND (bio-076): closing the loop helps at depth
        discontinuities at all four occlusion levels in 23-24 of 24 seeds, p = 3e-6,
        and two of the four were recorded as "indistinguishable". The framework's
        original motivation was on record as an absence.
        (c), NARROWLY, on the ledger question. 45 of 96 nulls read differently under
        a standard-error bar
        and no positive moved, but the two bars agree on 87.3% of 353 comparisons
        and 138 of those agreements are by construction, because the materiality
        floor binds. Exactly one foreclosure rests on a comparison that moved —
        fc-007, on one of two primary metrics, where the sd bar, the se bar and a
        sign test disagree with each other and the effect is 0.63 mm. fc-008 and
        fc-010 were checked and are clean. Of 13 audited methods and constants, 10
        were carried in and 8 have never been examined here.
      pre_registered: 67b0a66, committed alone before the re-scorer existed
      is_instrument_calibration: >-
        Entirely, and it is the second iteration in a row whose sharpest finding is
        about the instrument. It measures nothing about vision; it measures what
        this repository's own criterion has been saying.
      changed_no_foreclosure: >-
        NONE REVERSED, none taken. fc-007 annotated as affected, fc-008 and fc-010
        annotated as checked and unaffected — a negative result of an audit is a
        result. od-002 and od-003 untouched. gap-011 records the count of
        unexamined constants; nothing was re-derived.

  not_present:
    - >-
      NO LONGER TRUE, AND THIS ENTRY IS KEPT AS A CORRECTED ONE BECAUSE IT WAS THE
      PROJECT'S DEFINING ABSENCE. It read: "A CLOSED LOOP, still... nothing
      connects them. No experiment moves an eye, nothing re-renders across
      fixations, and no measurement is fused after a saccade."
      THE LOOP RUNS AS OF STEP 17c. exp010 moves the eye, re-renders at each
      fixation, and fuses across saccades into a persistent head-frame belief. An
      action changes the sensory data, which had never happened in either
      repository. See fv-020 and bio-066..bio-069.
      WHAT IS STILL ABSENT, so this is not read as more than it is: the loop is one
      policy (greedy argmax variance, no inhibition of return — loop.py DEFECT 3),
      on one stimulus at one occlusion level, with a foveal weight defined in pixels
      (fc-009) whose peak does not sit on the target (bio-065), and a vergence
      estimator that cannot report a sign (fc-010). It helps on the smooth interior
      and NOT at depth discontinuities.
    - >-
      Geometry IN THE LOOP, though the geometry itself now exists. Step 15
      migrated the oculomotor surface in ray form — fixation distance and point,
      eye rotations under the binocular Listing law, the rectification rotation,
      and target_to_fixation taking a unit direction — and ActiveStereo.step
      accepts a ray. What does NOT happen is any of it driving the loop: no eye
      rotation is applied, no fixation state is carried between steps, and the
      ray is landed straight back on the pixel lattice because the foveal weight
      is defined there. Step 17 is where geometry becomes control.
      Projection is still absent, deliberately: project_toed_in and
      toed_in_disparity were measured to have no consumer, and fc-003 makes
      Blender the only rendered source, so an analytic toed-in forward model has
      nothing here to serve.
    - >-
      Any rendered stimulus ANYONE HAS ASKED A QUESTION OF. Step 12 added a scene
      model and used it to check the render path against the fixture, which is a
      consistency check and not a question about vision. The scenes this
      repository can build remain ground-truth apparatus: the fixture's own
      geometry, tiled fronto-parallel planes, and a flat wall. od-002 is untouched,
      and gap-001's contrast axis does not exist.
    - Any measurement of anything this repository has not inherited.

