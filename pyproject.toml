[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bio-3d-vision"
version = "0.0.0"
description = "Research project on active 3D vision."
readme = "README.md"
requires-python = ">=3.12"
# No `license` field: this repository has no LICENSE file yet, and adding one is
# the maintainer's call, not the scaffold's.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    "ruff>=0.6",
]
# Reading Blender's float depth pass. OPTIONAL, and the core loop must never
# need it: bio3dvision.blender_load imports it inside the one function that
# reads EXR, so `import bio3dvision` works without it and the tests that would
# need it skip. Pinned to the `OpenEXR` package rather than imageio, which
# dispatches EXR to the wrong plugin and returns a WRONGLY SHAPED array instead
# of raising - measured, see bio-024.
blender = [
    "OpenEXR>=3.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bio3dvision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "infrastructure: pins the scaffold, not any result about vision",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true

# spikes/ is deliberately exempt from typing, linting and tests. It is where you
# try things; its only permitted output is a decision or a deletion. The import
# ban that keeps it out of the library is enforced in tests/test_scaffold.py.
[[tool.mypy.overrides]]
module = "spikes.*"
ignore_errors = true

# scipy and matplotlib ship no type stubs. Neither does OpenEXR, and `bpy` and
# `mathutils` do not exist outside Blender at all.
[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*", "OpenEXR.*", "Imath.*", "bpy.*", "mathutils.*"]
ignore_missing_imports = true

# bio3dvision.blender_render runs inside Blender's interpreter, against an API
# that ships no stubs, so every `bpy` expression is Any and strict mode can say
# nothing useful about it. Exempted rather than annotated with fictions: this is
# the module the suite already cannot reach (gap-009), and pretending the type
# checker covers it would misplace the boundary this repository is trying to
# draw. bio3dvision.blender_load, which is the tested half, stays fully strict.
[[tool.mypy.overrides]]
module = "bio3dvision.blender_render"
ignore_errors = true
